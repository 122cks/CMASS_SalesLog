  <script>
    // Early diagnostics: capture parsing/runtime errors (includes resource/script errors)
    // so we can surface filenames/lines for live debugging (logged to console).
    try{
      window.__cmass_errors = window.__cmass_errors || [];
      window.addEventListener('error', function(ev){
        try{
          const info = {
            message: ev.message || null,
            filename: ev.filename || (ev.target && ev.target.src) || null,
            lineno: ev.lineno || 0,
            colno: ev.colno || 0,
            stack: ev.error && ev.error.stack ? ev.error.stack : null,
            targetTag: ev.target && ev.target.tagName ? ev.target.tagName : null
          };
          window.__cmass_errors.push(info);
          console.error('__cmass_error__', info);
        }catch(e){}
      }, true);
      window.addEventListener('unhandledrejection', function(ev){
        try{
          const info = { reason: ev.reason && (ev.reason.stack || ev.reason.message || String(ev.reason)), type: 'unhandledrejection' };
          window.__cmass_errors.push(info);
          console.error('__cmass_unhandledrej__', info);
        }catch(e){}
      });
    }catch(e){}
  </script>

  <script>
    // One-time automatic service-worker & cache cleanup to ensure clients load the
    // newest JS/CSS. This runs only once per-browser (flagged in localStorage)
    // and reloads the page with `sw_cleared=1` to avoid loops.
    (function(){
      try{
        const params = new URLSearchParams(window.location.search);
        if (params.get('sw_cleared') === '1') { try{ localStorage.setItem('_cmass_sw_cleared','1'); }catch(e){} return; }
        if (localStorage.getItem('_cmass_sw_cleared') === '1') return;
        (async function(){
          try{
            if ('serviceWorker' in navigator){
              try{ const regs = await navigator.serviceWorker.getRegistrations().catch(()=>[]); await Promise.all((regs||[]).map(r=>r.unregister().catch(()=>{}))); }catch(e){}
            }
            if (window.caches && caches.keys){
              try{ const keys = await caches.keys().catch(()=>[]); await Promise.all((keys||[]).map(k=>caches.delete(k).catch(()=>{}))); }catch(e){}
            }
          }catch(e){ console.warn('sw cleanup inner failed', e); }
          try{ localStorage.setItem('_cmass_sw_cleared','1'); }catch(e){}
          try{
            const u = new URL(window.location.href);
            u.searchParams.set('sw_cleared','1');
            window.location.replace(u.toString());
          }catch(e){ try{ window.location.reload(true); }catch(_){} }
        })();
      }catch(e){ console.warn('sw cleanup failed', e); }
    })();

    const visits = rows.map(r => { try{ r._dateNorm = normalizeDate(r); return r; }catch(e){ return r; } }).sort((a,b)=> (b._dateNorm||'').localeCompare(a._dateNorm||''));


    // KPI 1, 2: 학교+방문일별로 duration 1번만 집계
    function getSchoolDayDurations(visits) {
      const map = {};
      visits.forEach(v => {
        const school = v.school || '';
        const date = v._dateNorm || v._date || v.visitDate || '';
        if (!school || !date) return;
        const key = `${school}|${date}`;
        if (map[key] === undefined) map[key] = Number(v.duration) || 0;
      });
      return map;
    }
    const schoolDayDurations = getSchoolDayDurations(visits);
    const schoolDayDurArr = Object.values(schoolDayDurations);
    // 총 방문 시간(분): 학교+방문일별 duration 합계
    document.getElementById('totalTime').textContent = schoolDayDurArr.reduce((sum, d) => sum + d, 0);
    // 평균 방문 시간(분) (학교당): 학교+방문일별 duration 평균
    document.getElementById('avgDuration').textContent = schoolDayDurArr.length ? Math.round(schoolDayDurArr.reduce((sum, d) => sum + d, 0) / schoolDayDurArr.length) : 0;

    // KPI 3: 수집된 연락처
    document.getElementById('contactsCount').textContent = visits.filter(v => (v.phone || v.email || '').toString().trim()).length;
    // KPI 4: 후속 조치 항목 수
    document.getElementById('followUpsCount').textContent = visits.filter(v => v.followUp || v.follow_up || v.followup || v['후속조치']).length;

    document.getElementById('totalVisits').textContent = visits.length;
    const uniq = Array.from(new Set(visits.map(v => (v.school||'').toString().trim()).filter(Boolean)));
    document.getElementById('uniqueSchools').textContent = uniq.length;
    document.getElementById('recentDate').textContent = visits.length ? (visits[0]._dateNorm || '-') : '-';

    // Populate subject filter options dynamically
    try{
      const subjEl = document.getElementById('subjectFilter'); if (subjEl){
  const subs = Array.from(new Set(visits.flatMap(v => Array.isArray(v.subject) ? v.subject : (Array.isArray(v.subjects) ? v.subjects : (v.subject ? [v.subject] : (v.subjects ? [v.subjects] : []))))));
        // preserve current selection
        const cur = subjEl.value || '';
        subjEl.innerHTML = '<option value="">전체</option>' + subs.map(s=> `<option value="${escapeHtml(String(s))}">${escapeHtml(String(s))}</option>`).join('');
        if (cur) subjEl.value = cur;
      }
    }catch(e){}

    // Build charts: subjects, region, reaction distribution
    try{
      buildCharts(visits);
    }catch(e){ console.warn('buildCharts failed', e); }

  if (!visits.length){ if (cont) cont.innerHTML = '<div class="small">데이터가 없습니다.</div>'; }
    else {
      // Add requests/deliveries columns and collect hidden note data blocks
      let html = '<table class="notes-table"><thead><tr>' +
        '<th>방문일</th><th>지역</th><th>학교</th><th>시간</th><th>소요</th><th>과목</th><th>선생님</th><th>반응</th><th>상세</th>' +
        '</tr></thead><tbody>';

      // will append hidden blocks here to preserve full texts for modal
      let noteDataCollect = '';

      visits.slice(0,1000).forEach(e => {
        const date = e._dateNorm || '';
        // split date for stacked display: "YYYY-" on first line and "MM-DD" on second
        const dateYear = date ? escapeHtml(String(date).substring(0,4) + '-') : '';
        const dateMd = date ? escapeHtml(String(date).substring(5)) : '';
        const school = escapeHtml(e.school || '');
        const region = escapeHtml(e.region || '');
        const time = (e.visitStart||'') + (e.visitEnd ? (' ~ ' + e.visitEnd) : '');
        const staffLabel = escapeHtml(e.staffLabel || e.staff || '');
  const subjects = Array.isArray(e.subject) ? e.subject.join(', ') : (Array.isArray(e.subjects) ? e.subjects.join(', ') : (e.subject || e.subjects || ''));
  const activities = Array.isArray(e.activities) ? e.activities.join(', ') : (e.activities || '');
        const teacher = escapeHtml(e.teacher || '');
        const duration = (typeof e.duration === 'number' && !isNaN(e.duration)) ? String(e.duration) : (e.duration_label||'');
  const favor = escapeHtml(e.favor || '');
  // Remove a possible leading literal '반응' so we don't display it twice
  const favorValue = String(favor || '').replace(/^\s*반응\s*/,'');
        const followUp = escapeHtml(e.followUp || e.followup || '');
        const contact = escapeHtml((e.phone||e.contact||e.email||'').toString());

          // canonicalize possible fields from various doc shapes
          const rawRequests = (e.request||e.requests||e.requestText||e.askText||'').toString();
          const rawMaterials = (e.materials||e.material||e.deliveryMaterials||e.delivery_materials||'').toString();
          const rawDeliveries = (e.deliveries||e.delivery||e.delivery_note||e.deliveryItems||e.delivered||'').toString();
          const rawConversation = (e.conversation||e.convo||e.note||e.notes||'').toString();
          const rawIssue = (e.issue||e.issues||e.specialNotes||e.remark||e.remarks||'').toString();
          const rawGift = (e.gift||e.gifts||e.present||'').toString();

        // Build full HTML used in modal (ordered per user request)
        let parts = [];
        if (activities && String(activities).trim()) parts.push('<div><strong>영업활동:</strong> ' + escapeHtml(String(activities)).replace(/\n/g,'<br>') + '</div>');
        if (rawMaterials && String(rawMaterials).trim()) parts.push('<div style="margin-top:6px"><strong>전달자료:</strong> ' + escapeHtml(String(rawMaterials)).replace(/\n/g,'<br>') + '</div>');
        if (rawRequests && String(rawRequests).trim()) parts.push('<div style="margin-top:6px"><strong>고객요청사항:</strong> ' + escapeHtml(String(rawRequests)).replace(/\n/g,'<br>') + '</div>');
        if (rawConversation && String(rawConversation).trim()) parts.push('<div style="margin-top:6px"><strong>대화내용:</strong> ' + escapeHtml(String(rawConversation)).replace(/\n/g,'<br>') + '</div>');
        if (rawIssue && String(rawIssue).trim()) parts.push('<div style="margin-top:6px"><strong>특이사항:</strong> ' + escapeHtml(String(rawIssue)).replace(/\n/g,'<br>') + '</div>');
        if (rawDeliveries && String(rawDeliveries).trim()) parts.push('<div style="margin-top:6px"><strong>납품사항:</strong> ' + escapeHtml(String(rawDeliveries)).replace(/\n/g,'<br>') + '</div>');
        if (rawGift && String(rawGift).trim()) parts.push('<div style="margin-top:6px"><strong>증정사항:</strong> ' + escapeHtml(String(rawGift)).replace(/\n/g,'<br>') + '</div>');
        if (followUp && String(followUp).trim()) parts.push('<div style="margin-top:6px"><strong>후속조치:</strong> ' + escapeHtml(String(followUp)).replace(/\n/g,'<br>') + '</div>');
        if (contact && String(contact).trim()) parts.push('<div style="margin-top:6px"><strong>연락처:</strong> ' + contact + '</div>');
        const fullNoteHtml = parts.length ? parts.join('') : '<div class="small">내용이 없습니다.</div>';

    // safe id using server_id or doc id; fallback to a short random token
    const idToken = String(e.server_id || e.id || ('r' + Math.random().toString(36).slice(2))).replace(/[^a-zA-Z0-9_\-]/g,'_');

  // Render only a '보기' button in the merged 상세 column. The full text is shown in a modal when clicked.
  // Reduce vertical padding for the '보기' button (half the previous vertical size)
  const noteCellHtml = `<div id="${idToken}_wrap">` +
    `<div style="text-align:center"><button class="alt-btn" style="padding:2px 8px;font-size:12px;line-height:1" onclick="openNoteModal('${idToken}')">보기</button></div>` +
    `</div>`;

    // hidden data element to store full note HTML for modal consumption (append to collector)
  const noteDataHtml = `<div id="${idToken}_data" style="display:none">${fullNoteHtml}</div>`;
  noteDataCollect += noteDataHtml;

        html += '<tr>' +
          `<td class="visit-date-cell"><span class="visit-date-year">${dateYear}</span><span class="visit-date-md">${dateMd}</span></td>` +
          `<td>${region}</td>` +
          `<td>${school}</td>` +
          `<td>${time}</td>` +
          `<td>${duration}</td>` +
          `<td>${escapeHtml(subjects)}</td>` +
  `<td>${teacher}</td>` +
  `<td><div class="reaction-cell"><span class="reaction-value">${favorValue || '-'}</span></div></td>` +
      `<td>${noteCellHtml}</td>` +
          '</tr>';
      });

      html += '</tbody></table>' + noteDataCollect;
      if (cont) cont.innerHTML = html;
    }

  }catch(e){ console.warn('loadPersonalVisits failed', e); try{ if (loadingEl) loadingEl.textContent = '불러오기 중 오류'; }catch(_){} }
  finally{ try{ document.getElementById('dashboardArea').style.display='block'; document.getElementById('loading').style.display='none'; }catch(e){} }
}

// Helper: escape HTML for simple cell rendering
function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// Toggle long note text: show preview by default, expand/collapse on button click
// openNoteModal(id) will display the full note text in a modal. The modal element is
// created on-demand and reused. Note contents are stored in a hidden dataset to avoid
// embedding large text directly into onclick attributes.
function openNoteModal(id){
  try{
    // Find the row data by matching the idToken to a row's server_id or id
    // We stored the full note text in an element with id `${id}_data` when rendering
    let dataEl = document.getElementById(id + '_data');
    let noteHtml = '';
    if (dataEl){ noteHtml = dataEl.innerHTML || ''; }
    // If data element not found (older rows), attempt to recover from attributes
    // Fallback: show a simple message
    if (!noteHtml){ noteHtml = '<div class="small">내용을 불러올 수 없습니다.</div>'; }

    // Create modal overlay if not present
    let overlay = document.getElementById('__cmass_note_modal_overlay');
    if (!overlay){
      overlay = document.createElement('div'); overlay.id='__cmass_note_modal_overlay'; overlay.className='cmass-modal-overlay';
      overlay.innerHTML = `<div class="cmass-modal" role="dialog" aria-modal="true" aria-labelledby="__cmass_note_modal_title">` +
                          `<header><div id="__cmass_note_modal_title" class="modal-title">상세 내용 보기</div><div><button id="__cmass_note_modal_close_btn" class="modal-close">닫기</button></div></header>` +
                          `<div class="modal-body" id="__cmass_note_modal_body"></div>` +
                          `</div>`;
      document.body.appendChild(overlay);
      // wire close handler
      document.getElementById('__cmass_note_modal_close_btn').addEventListener('click', closeNoteModal);
      // close on overlay click outside modal
      overlay.addEventListener('click', function(ev){ if (ev.target === overlay) closeNoteModal(); });
      // close on escape
      window.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') closeNoteModal(); });
    }

    // Ensure modal title indicates this is the detailed view
    const titleEl = document.getElementById('__cmass_note_modal_title');
    if (titleEl) titleEl.textContent = '상세 내용 보기';
    const body = document.getElementById('__cmass_note_modal_body');
    if (body) body.innerHTML = noteHtml;
    overlay.style.display = 'flex';
  }catch(e){ console.warn('openNoteModal failed', e); }
}

// Chart helpers: aggregate visits and render/update charts
let __subjectsChart = null, __regionChart = null, __reactionChart = null, __dailyVisitsChart = null, __monthlyTrendChart = null;
function buildCharts(visits){
  try{
    // Aggregate subjects
    const subjectCounts = new Map();
    visits.forEach(v => {
  const subs = Array.isArray(v.subject) ? v.subject : (Array.isArray(v.subjects) ? v.subjects : (v.subject ? [v.subject] : (v.subjects ? [v.subjects] : [])));
      subs.forEach(s => {
        if (!s) return;
        const key = String(s).trim();
        if (!key) return;
        subjectCounts.set(key, (subjectCounts.get(key)||0)+1);
      });
    });

    // Aggregate regions
    const regionCounts = new Map();
    visits.forEach(v => {
      const r = (v.region||'').toString().trim();
      if (!r) return;
      regionCounts.set(r, (regionCounts.get(r)||0)+1);
    });

    // Aggregate reactions (favor)
    const reactionCounts = new Map();
    visits.forEach(v => {
      const raw = String(v.favor || v.favorValue || v.favor_raw || '').replace(/^\s*반응\s*/,'').trim();
      const val = raw || (v.favor || '') || '';
      const key = String(val).trim() || '알수없음';
      reactionCounts.set(key, (reactionCounts.get(key)||0)+1);
    });

    // helper to build chart data arrays from map
    function mapToData(m){
      const entries = Array.from(m.entries()).sort((a,b)=> b[1]-a[1]);
      const labels = entries.map(e=> e[0]);
      const data = entries.map(e=> e[1]);
      return { labels, data, entries };
    }

    const subjData = mapToData(subjectCounts);
    const regData = mapToData(regionCounts);
  const reactData = mapToData(reactionCounts);

    const palette = ['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f','#edc949','#af7aa1','#ff9da7','#9c755f','#bab0ac'];

    // Helper for tooltip label: show count and percent
    function labelWithCountAndPercent(ctx){
      try{
        const label = ctx.label || '';
        // parsed works for doughnut/bar in Chart.js v3
        const value = (ctx.parsed !== undefined) ? ctx.parsed : (ctx.raw || 0);
        const dataArr = (ctx.dataset && ctx.dataset.data) ? ctx.dataset.data : [];
        const total = dataArr.reduce((s,v)=> s + (Number(v)||0), 0) || 0;
        const pct = total ? ((Number(value)/total)*100).toFixed(1) : '0.0';
        return `${label}: ${value}건 (${pct}%)`;
      }catch(e){ return (ctx.label || '') + ': ' + (ctx.raw||ctx.parsed||0); }
    }

    // Subjects chart
    const sCtx = document.getElementById('subjectsChart');
    if (sCtx){
      const sOpts = {
            plugins:{
              // We will render a custom DOM legend to the right so disable in-canvas legend
              legend:{ display:false },
              tooltip:{ enabled:true, callbacks: { label: labelWithCountAndPercent } }
            },
            maintainAspectRatio:false,
            aspectRatio: 1.6
          };
      if (__subjectsChart) {
        __subjectsChart.data.labels = subjData.labels; __subjectsChart.data.datasets[0].data = subjData.data; __subjectsChart.options = sOpts; __subjectsChart.update();
      } else {
        // plugin to draw labels (subject names) around the doughnut
        const subjectLabelPlugin = {
          id: 'subjectLabelPlugin',
          afterDraw: function(chart){
            try{
              const ctx = chart.ctx;
              const meta = chart.getDatasetMeta(0);
              const labels = chart.data.labels || [];
              ctx.save();
              ctx.fillStyle = '#334';
              // slightly reduced font sizes so labels don't compete with the chart area
              ctx.font = (chart.width>300? '10px':'9px') + ' system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              meta.data.forEach((arc, i) => {
                if (!arc) return;
                const a = (arc.startAngle + arc.endAngle) / 2;
                const r = (arc.outerRadius || (chart.outerRadius || 0)) + 14;
                const x = arc.x + Math.cos(a) * r;
                const y = arc.y + Math.sin(a) * r;
                const label = (labels[i] || '').toString();
                if (!label) return;
                // short label if too long
                const short = label.length>12 ? (label.substring(0,12) + '…') : label;
                ctx.fillText(short, x, y);
              });
              ctx.restore();
            }catch(e){ /* silent */ }
          }
        };

        __subjectsChart = new Chart(sCtx, { type:'doughnut', data:{ labels: subjData.labels, datasets:[{ data: subjData.data, backgroundColor: palette } ] }, options: sOpts, plugins:[subjectLabelPlugin] });
      }
    }

    // Region chart
    const rCtx = document.getElementById('regionChart');
    if (rCtx){
  const rOpts = { plugins:{ legend:{ display:false }, tooltip:{ enabled:true, callbacks:{ label: labelWithCountAndPercent } } }, maintainAspectRatio:false };
      if (__regionChart) {
        // update existing chart to bar type data
        __regionChart.data.labels = regData.labels;
        __regionChart.data.datasets[0].data = regData.data;
        __regionChart.update();
      } else {
        // create a bar chart for regions
        __regionChart = new Chart(rCtx, {
          type: 'bar',
          data: {
            labels: regData.labels,
            datasets: [{ label: '건수', data: regData.data, backgroundColor: palette }]
          },
          options: Object.assign({}, rOpts, {
            scales: {
              x: { beginAtZero: true, ticks: { autoSkip: true, maxRotation: 0 } },
              y: { beginAtZero: true, ticks: { precision: 0 } }
            }
          })
        });
      }
    }

    // Daily visits (영업일자) - aggregate by normalized date and render line chart
    try{
      const dateMap = new Map();
      visits.forEach(v => { const d = (v._dateNorm || '').toString().trim(); if(!d) return; dateMap.set(d, (dateMap.get(d)||0) + 1); });
      const dateEntries = Array.from(dateMap.entries()).sort((a,b)=> a[0].localeCompare(b[0]));
      const dateLabels = dateEntries.map(e=> e[0]);
      const dateCounts = dateEntries.map(e=> e[1]);
      const dvCtx = document.getElementById('dailyVisitsChart');
      if(dvCtx){
        const dvOpts = { plugins:{ legend:{ display:false }, tooltip:{ enabled:true } }, maintainAspectRatio:false };
        if(__dailyVisitsChart){
          __dailyVisitsChart.data.labels = dateLabels;
          __dailyVisitsChart.data.datasets[0].data = dateCounts;
          __dailyVisitsChart.update();
        } else {
          __dailyVisitsChart = new Chart(dvCtx, {
            type: 'line',
            data: { labels: dateLabels, datasets: [{ label: '미팅건수', data: dateCounts, borderColor: '#4e79a7', backgroundColor: 'rgba(78,121,167,0.08)', tension: 0.2, fill: true, pointRadius:3 }] },
            options: Object.assign({}, dvOpts, { scales: { x: { type: 'category', ticks: { autoSkip: true, maxRotation: 0 } }, y: { beginAtZero:true, ticks:{ precision:0 } } } })
          });
        }
      }
    }catch(e){ console.warn('daily visits chart render failed', e); }

    // Monthly visits (월별) - aggregate by YYYY-MM and render line chart
    try{
      const monthMap = new Map();
      visits.forEach(v => {
        const dNorm = (v._dateNorm || '').toString().trim();
        if (!dNorm) return;
        const month = dNorm.substring(0,7); // YYYY-MM
        monthMap.set(month, (monthMap.get(month)||0) + 1);
      });
      const monthEntries = Array.from(monthMap.entries()).sort((a,b)=> a[0].localeCompare(b[0]));
      const monthLabels = monthEntries.map(e=> e[0]);
      const monthCounts = monthEntries.map(e=> e[1]);
      const mCtx = document.getElementById('monthlyTrendChart');
      if (mCtx){
        const mOpts = { plugins:{ legend:{ display:false }, tooltip:{ enabled:true } }, maintainAspectRatio:false };
        if (__monthlyTrendChart){
          __monthlyTrendChart.data.labels = monthLabels;
          __monthlyTrendChart.data.datasets[0].data = monthCounts;
          __monthlyTrendChart.update();
        } else {
          __monthlyTrendChart = new Chart(mCtx, {
            type: 'line',
            data: { labels: monthLabels, datasets: [{ label: '월별 미팅건수', data: monthCounts, borderColor: '#59a14f', backgroundColor: 'rgba(89,161,79,0.08)', tension: 0.2, fill: true, pointRadius:3 }] },
            options: Object.assign({}, mOpts, { scales: { x: { type: 'category', ticks: { autoSkip: true, maxRotation: 0 } }, y: { beginAtZero:true, ticks:{ precision:0 } } } })
          });
        }
      }
    }catch(e){ console.warn('monthly visits chart render failed', e); }

    // Reaction chart removed (rendering moved to NPS breakdown); '알수없음' is excluded from calculations elsewhere

    // Render textual lists under each chart: label + count + percent, sorted desc
    function renderList(containerId, entries, colors){
      const el = document.getElementById(containerId);
      if (!el) return;
      const total = entries.reduce((s,e)=> s + (e[1]||0), 0) || 0;
      // entries is array of [label,count] sorted desc
      const rows = entries.map(([label,count],i) => {
        const pct = total ? ((count/total)*100).toFixed(1) : '0.0';
        const safe = escapeHtml(label);
        const color = (colors && colors[i]) ? colors[i] : '#ccc';
        return `<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed rgba(0,0,0,0.04)"><div style=\"display:flex;align-items:center;gap:8px;max-width:70%\"><span style=\"display:inline-block;width:12px;height:12px;background:${color};margin-right:6px;border-radius:2px;flex:0 0 12px;\"></span><div style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${safe}</div></div><div style=\"color:#334;min-width:80px;text-align:right\">${count}건 (${pct}%)</div></div>`;
      });
      el.innerHTML = rows.join('');
    }

    // Render a vertical DOM legend (intended for placement to the right of a chart)
    function renderLegendRight(containerId, entries, colors){
      const el = document.getElementById(containerId);
      if (!el) return;
      const total = entries.reduce((s,e)=> s + (e[1]||0), 0) || 0;
        const rows = entries.map(([label,count],i) => {
        const pct = total ? ((count/total)*100).toFixed(1) : '0.0';
        const safe = escapeHtml(label);
        const color = (colors && colors[i]) ? colors[i] : '#ccc';
        return `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px;border-bottom:1px dashed rgba(0,0,0,0.04)"><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"display:inline-block;width:10px;height:10px;background:${color};margin-right:6px;border-radius:3px;flex:0 0 10px;\"></span><div style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px;font-size:13px;color:#234\">${safe}</div></div><div style=\"text-align:right;min-width:70px;color:#334;font-weight:600;font-size:13px\">${count}건 (${pct}%)</div></div>`;
      });
      el.innerHTML = rows.join('');
    }

    // build color arrays matching the chart order
    const subjColors = subjData.entries.map((_,i)=> palette[i % palette.length]);
    const regColors = regData.entries.map((_,i)=> palette[i % palette.length]);
  // Populate the right-side legend for subjects (integrates the previous bottom list)
  renderLegendRight('subjectsLegend', subjData.entries, subjColors);
  renderList('regionList', regData.entries, regColors);

  }catch(e){ console.warn('buildCharts error', e); }
}

});

<script>
// --- NPS gauge from nps_preview.html (embedded into front) ---
const NPS_MOCK = [
  { favor: '반응좋음' },{ favor: '반응좋음' },{ favor: '반응좋음' },
  { favor: '반응보통' },{ favor: '반응보통' },{ favor: '반응나쁨' }
];
const NPS_TEST_DATA = [
  { favor: '반응보통' }, { favor: '반응보통' }, { favor: '반응보통' }, { favor: '반응보통' },
  { favor: '반응보통' }, { favor: '반응보통' }, { favor: '반응보통' }, { favor: '반응보통' },
  { favor: '반응좋음' }, { favor: '반응좋음' }, { favor: '반응좋음' }, { favor: '반응좋음' }, { favor: '반응좋음' }
];

function computeNps_local(visits){
  let promoters=0, passives=0, detractors=0;
  (visits||[]).forEach(v=>{
    const raw = String(v.favor || v.favorValue || v.favor_raw || v.reaction || v.반응 || '').trim();
    if(raw === '반응좋음') promoters++;
    else if(raw === '반응보통') passives++;
    else if(raw === '반응나쁨') detractors++;
  });
  const total = promoters+passives+detractors;
  const pPct = total? Math.round(promoters/total*100):0;
  const paPct = total? Math.round(passives/total*100):0;
  const dPct = total? Math.round(detractors/total*100):0;
  const nps = Math.round(pPct - dPct);
  return {promoters,passives,detractors,total,pPct,paPct,dPct,nps};
}

function ensureGaugeCanvasSize(){
  const cnv = document.getElementById('gauge'); if(!cnv) return;
  const w = Math.round(480 * 0.7); const h = Math.round(240 * 0.7); const dpr = window.devicePixelRatio || 1;
  try{ cnv.style.setProperty('width', w + 'px', 'important'); }catch(e){ cnv.style.width = w + 'px'; }
  try{ cnv.style.setProperty('height', h + 'px', 'important'); }catch(e){ cnv.style.height = h + 'px'; }
  cnv.width = Math.round(w * dpr); cnv.height = Math.round(h * dpr);
}

function drawGauge_local(b){
  ensureGaugeCanvasSize();
  const cnv = document.getElementById('gauge'); if(!cnv) return;
  const ctx = cnv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  ctx.clearRect(0,0,cnv.width,cnv.height);
  const cssW = parseInt(getComputedStyle(cnv).width,10) || 480;
  const cssH = parseInt(getComputedStyle(cnv).height,10) || 240;
  const centerX = cssW/2; const centerY = cssH; const radius = Math.min(cssW, cssH*2)*0.4;
  const cols = ['#2ecc71','#f1c40f','#e74c3c'];
  const angles = [ { start: Math.PI, end: Math.PI + Math.PI/3 }, { start: Math.PI + Math.PI/3, end: Math.PI + 2*Math.PI/3 }, { start: Math.PI + 2*Math.PI/3, end: Math.PI*2 } ];
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(centerX*dpr, centerY*dpr, radius*dpr, angles[i].start, angles[i].end); ctx.lineWidth = Math.round(radius*0.2*dpr); ctx.strokeStyle = cols[i]; ctx.stroke(); }
  const v = Math.max(-100, Math.min(100, Number(b.nps)||0));
  const angle = (v/100)*Math.PI/2 + Math.PI;
  const needleLen = radius*0.8*dpr;
  const tipX = centerX*dpr + Math.cos(angle)*needleLen;
  const tipY = centerY*dpr + Math.sin(angle)*needleLen;
  ctx.beginPath(); ctx.moveTo(centerX*dpr, centerY*dpr); ctx.lineTo(tipX, tipY); ctx.lineWidth = Math.round(radius*0.05*dpr); ctx.strokeStyle = '#07243a'; ctx.stroke();
  ctx.beginPath(); ctx.arc(centerX*dpr, centerY*dpr, Math.round(radius*0.1*dpr),0,Math.PI*2); ctx.fillStyle='#07243a'; ctx.fill(); ctx.beginPath(); ctx.arc(centerX*dpr, centerY*dpr, Math.round(radius*0.05*dpr),0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
}

function renderNpsBreakdown_local(b){
  // Render the styled breakdown cards (Promoters / Passives / Detractors) under the gauge
  const bd = document.getElementById('breakdownList');
  if(!bd) return;
  const rows = [];
  // Show percent + count together inside the swatch; remove right-side count per request
  rows.push(`<div class="list-item"><div class="swatch" style="background:#2ecc71;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:1"><div style="font-weight:800;font-size:15px">${b.pPct}%</div><div style="font-weight:700;font-size:12px;margin-top:4px">${b.promoters}건</div></div><div class="break-main"><div class="break-title">Promoters</div><div class="break-sub">반응좋음</div></div></div>`);
  rows.push(`<div class="list-item"><div class="swatch" style="background:#f1c40f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:1"><div style="font-weight:800;font-size:15px">${b.paPct}%</div><div style="font-weight:700;font-size:12px;margin-top:4px">${b.passives}건</div></div><div class="break-main"><div class="break-title">Passives</div><div class="break-sub">반응보통</div></div></div>`);
  rows.push(`<div class="list-item"><div class="swatch" style="background:#e74c3c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:1"><div style="font-weight:800;font-size:15px">${b.dPct}%</div><div style="font-weight:700;font-size:12px;margin-top:4px">${b.detractors}건</div></div><div class="break-main"><div class="break-title">Detractors</div><div class="break-sub">반응나쁨</div></div></div>`);
  bd.innerHTML = rows.join('');
}

async function fetchVisits_local(staff){
  try{
    if(window.firebaseDb){
      const db = window.firebaseDb;
      let q = db.collection('visit_entries');
      if (staff && String(staff).trim()){
        try{ q = q.where('staff','==', String(staff).trim()); }catch(e){ /* ignore if where unsupported */ }
      }
      q = q.limit(5000);
      const snap = await q.get();
      const docs = (snap && snap.docs)? snap.docs.map(d=>{const o=d.data(); o.id=d.id; return o;}):[];
      return docs;
    }
  }catch(e){ console.warn('firestore failed', e); }
  return null;
}

async function refreshNps_onFront(useMock=false, mockData=null){
  let visits = null;
  // determine staff from query string (or other helper) so NPS shows staff-specific data
  let staff = '';
  try{ if (typeof getStaffFromQuery === 'function') staff = getStaffFromQuery() || ''; }catch(e){}
  if(!useMock) visits = await fetchVisits_local(staff);
  if(!visits) visits = mockData || NPS_MOCK;
  const b = computeNps_local(visits);
  drawGauge_local(b);
  renderNpsBreakdown_local(b);
  const npsEl = document.getElementById('npsScore'); if(npsEl) npsEl.textContent = (b.nps>0? '+'+b.nps: b.nps);
}

// init on front
try{ preventFocusScroll && preventFocusScroll(); }catch(e){}
ensureGaugeCanvasSize();
// Try to use real data; fallback to test data for visualization
refreshNps_onFront(false, NPS_TEST_DATA);

</script>
