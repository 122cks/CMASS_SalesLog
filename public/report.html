    <script>
    (function(){
  function qs(id){ return document.getElementById(id); }
  function qsParam(k){ try{ return (new URLSearchParams(window.location.search || '').get(k) || '').toString(); }catch(e){ return ''; } }
  // normalize/trim URL params to avoid accidental mismatches
  let staff = (qsParam('staff') || '').toString().trim();
  // Helper: normalize common legacy staff tokens to canonical tokens used in UI/DB
  function normalizeStaffToken(raw){
    try{
      const s = (raw||'').toString().trim(); if (!s) return '';
      const lower = s.toLowerCase();
        const canon = {
        // Korean display variants
  '송훈재': 'SongHoonjae', '송훈재 부장': 'SongHoonjae', '송훈재부장': 'SongHoonjae',
        '임준호': 'LimJunho', '임준호 차장': 'LimJunho', '임준호차장': 'LimJunho',
        '조영환': 'ChoYounghwan', '조영환 부장': 'ChoYounghwan', '조영환부장': 'ChoYounghwan'
      };
      // If the input already looks like a canonical token, normalize casing
  const candidates = ['SongHoonjae','LimJunho','ChoYounghwan'];
      for (const c of candidates){ if (c.toLowerCase() === lower) return c; }
      return canon[lower] || s;
    }catch(e){ return raw || ''; }
  }
  // canonicalize the incoming staff URL param immediately so subsequent logic
  // can compare tokens reliably.
  staff = normalizeStaffToken(staff);
  const visitDate = (qsParam('visitDate') || qsParam('date') || '').toString().trim();
      document.getElementById('subtitle').textContent = `담당자: ${staff || '-'} · 방문일: ${visitDate || '-'}`;
      document.getElementById('staffName').textContent = staff || '';
      document.getElementById('reportDate').textContent = visitDate || '';

      // Helpers: fetch server reports and update header counts
      async function fetchServerReports(){
        try{
          if (!window.firebaseDb) return [];
          const snap = await window.firebaseDb.collection('visit_entries').get();
          const arr = [];
          snap.forEach(d=>{
            try{
              const raw = d.data() || {};
              raw.server_id = d.id;
              // Normalize server doc into the internal entry shape so consumers
              // (renderEntries, buildOfficeSummary) see consistent field names
              if (typeof mapServerDocToEntry === 'function'){
                arr.push(mapServerDocToEntry(raw));
              } else {
                arr.push(raw);
              }
            }catch(_){ /* tolerate per-doc parse errors */ }
          });
          return arr;
        }catch(e){ console.warn('fetchServerReports failed', e); return []; }
      }

      async function updateLocalReportsInfo(){
        try{
          let local = [];
          try{ local = (typeof loadLocalReports === 'function') ? loadLocalReports() : (JSON.parse(localStorage.getItem('cmass_reports')||'[]')||[]); }catch(e){ local = []; }
          let server = [];
          try{ server = await fetchServerReports(); }catch(e){ server = []; }
          const tot = new Map();
          // key by server_id if present, else by _savedAt or JSON
          local.forEach(it=>{ const key = it && it.server_id ? ('s:'+String(it.server_id)) : ('l:'+String(it._savedAt||JSON.stringify(it))); tot.set(key, it); });
          server.forEach(it=>{ const key = it && it.server_id ? ('s:'+String(it.server_id)) : ('l:'+String(it._savedAt||JSON.stringify(it))); tot.set(key, it); });
          const el = qs('localReportsInfo'); if (el) el.textContent = `로컬: ${local.length} / 서버: ${server.length} / 총: ${tot.size}`;
        }catch(e){ /* ignore */ }
      }

      document.addEventListener('DOMContentLoaded', function(){ try{ const btn = qs('btnReloadLocal'); if (btn){ btn.addEventListener('click', function(){ try{ if (typeof _reRenderUI === 'function'){ _reRenderUI(); } updateLocalReportsInfo(); }catch(e){ updateLocalReportsInfo(); } }, true); } }catch(e){} updateLocalReportsInfo(); });

      // Ensure anonymous authentication before Firestore write/delete operations.
      // Uses the compat SDK firebase.auth() when available.
      async function ensureAnonymousAuth(firebaseAuth){
        try{
          const auth = firebaseAuth || (window.firebase && firebase.auth ? firebase.auth() : null);
          if (!auth) return null;
          if (auth.currentUser) return auth.currentUser;
          const cred = await auth.signInAnonymously();
          // compat SDK: currentUser should be set after sign-in
          return cred && cred.user ? cred.user : auth.currentUser || null;
        }catch(err){
          console.warn('ensureAnonymousAuth failed', err);
          throw err;
        }
      }

      // Attach onAuthStateChanged listener so the UI reflects authentication state reliably
      try{
        if (window.firebase && firebase.auth){
          firebase.auth().onAuthStateChanged(function(user){
            try{
              const authEl = document.getElementById('cmass-auth-status');
              if (!authEl) return;
              if (user){ authEl.textContent = '(인증 상태: 익명 로그인됨)'; }
              else {
                const pin = (window.sessionStorage && sessionStorage.getItem('cmass_pin_authenticated')) || null;
                authEl.textContent = pin ? '(인증 상태: PIN 필요)' : '(인증 상태: 확인 중)';
              }
              console.debug('[auth] onAuthStateChanged fired', user);
            }catch(e){ console.warn('onAuthStateChanged handler failed', e); }
          });
        }
      }catch(e){ console.warn('attach onAuthStateChanged failed', e); }

      // Wire the manual anonymous-signin button to attempt sign-in and update UI
      try{
        const anonBtn = document.getElementById('cmass-anon-signin');
        if (anonBtn){
          anonBtn.addEventListener('click', async function(){
            try{
              if (!window.firebase || !firebase.auth){ alert('Firebase SDK가 아직 로드되지 않았습니다. 잠시 후 다시 시도하세요.'); return; }
              if (firebase.auth().currentUser){ alert('이미 로그인되어 있습니다.'); return; }
              await firebase.auth().signInAnonymously();
              try{ const authEl = document.getElementById('cmass-auth-status'); if (authEl) authEl.textContent = '(인증 상태: 익명 로그인됨)'; }catch(e){}
              alert('익명 로그인 시도 완료');
            }catch(err){ console.error('anon signin failed', err); alert('익명 로그인 실패: ' + (err && err.message ? err.message : String(err))); }
          }, true);
        }
      }catch(e){ console.warn('wire anon button failed', e); }
      function buildOfficeSummary(){
        try{
          const entries = (window._cmass_report_lastFiltered && window._cmass_report_lastFiltered.length) ? window._cmass_report_lastFiltered.slice() : (computeMetrics(loadLocalReports()).filtered || []);
          if (!entries || entries.length === 0) {
            // 향상된 폴백: 렌더된 DOM에서 항목 정보를 추출해 가능한 한 원본 포맷에 가깝게 요약을 생성합니다.
            try{
              const domList = Array.from(document.querySelectorAll('.report-entry'));
              if (!domList.length) return '';

              // FIELD_LABELS (renderEntries와 동일한 한글 레이블 맵)
              const FIELD_LABELS = {
                server_id: '서버 ID', staff: '직원', staffLabel: '직원(표시명)', region: '지역', school: '학교', 's-code': '학교코드', visitDate: '방문일', startHour: '방문시작시간', startMinute: '방문시작분', duration: '총 방문시간', endTime: '방문종료시간', subject: '과목', activities: '영업활동', favor: '우호도', teacherName: '선생님 이름', phone: '연락처', email: '이메일', conversation: '대화내용', issue: '특이사항', _savedAt: '저장시기'
              };

              function reverseLabelToKey(lbl){
                for (const k in FIELD_LABELS){ if (FIELD_LABELS[k] === lbl) return k; }
                return null;
              }

              const parsed = domList.map(div => {
                const out = {};
                try{
                  const title = div.querySelector('.school-title'); if (title && title.textContent){ const t = title.textContent.trim(); const parts = t.split('·'); out.school = (parts[0]||'').trim(); if (parts[1]) out.visitDate = (parts[1]||'').trim(); }
                  const meta = div.querySelector('.muted'); if (meta && meta.textContent){ const m = meta.textContent.trim(); const parts = m.split('·').map(s=>s.trim()); out.staffLabel = parts[0] || ''; out.region = parts[1] || ''; }
                  const summaryLeft = div.querySelector('.report-entry-summary .meta-left'); if (summaryLeft && summaryLeft.textContent){ out.compact = summaryLeft.textContent.trim(); }
                  const details = div.querySelector('.report-entry-details');
                  if (details){
                    const childs = Array.from(details.querySelectorAll('div'));
                    childs.forEach(p => {
                      try{
                        const strong = p.querySelector('strong'); if (!strong) return;
                        const label = strong.textContent.replace(':','').trim();
                        const val = p.textContent.replace(strong.textContent,'').trim();
                        const key = reverseLabelToKey(label);
                        if (key){
                          // normalize certain fields
                          if (key === 'duration'){ out.duration = Number(String(val).replace(/[^0-9]/g,'')) || 0; }
                          else if (key === 'startHour'){
                            // value may be 'HH:MM'
                            const m = val.match(/(\d{1,2}):(\d{1,2})/);
                            if (m){ out.startHour = String(m[1]).padStart(2,'0'); out.startMinute = String(m[2]).padStart(2,'0'); }
                          } else if (key === 'subject'){
                            out.subject = val.split(',').map(s=>s.trim()).filter(Boolean);
                          } else if (key === 'phone'){
                            out.phone = val;
                          } else {
                            out[key] = val;
                          }
                        }
                      }catch(e){}
                    });
                  }
                }catch(e){}
                return out;
              }).filter(Boolean);

              // group by school
              const bySchool = {};
              parsed.forEach(p=>{ const s = (p.school||'학교 미정'); bySchool[s] = bySchool[s] || []; bySchool[s].push(p); });

              // metrics
              const uniqueSchools = Object.keys(bySchool);
              const totalMeetings = parsed.length;
              const contacts = parsed.filter(p=> p.phone && String(p.phone).trim()).length;

              // office times
              const office = loadOfficeData() || {};
              const internalM = (Number(office.internalHours||0) * 60) + Number(office.internalMinutes||0);
              const meetingTotalM = parsed.reduce((s,it)=> s + (Number(it.duration)||0), 0);
              const startTimes = parsed.map(it=>{ try{ if (it.startHour !== undefined && it.startHour !== '') return (Number(it.startHour||0)*60 + Number(it.startMinute||0)); }catch(e){} return null; }).filter(x=>x!==null).sort((a,b)=>a-b);
              const earliestStart = startTimes.length ? startTimes[0] : null;
              const latestEnd = parsed.reduce((acc,it)=>{ try{ const st = (it.startHour !== undefined && it.startHour !== '') ? (Number(it.startHour||0)*60 + Number(it.startMinute||0)) : null; const dur = Number(it.duration||0); if (st!==null){ const end = st + dur; return Math.max(acc,end); } }catch(e){} return acc; }, 0);
              const cleanupM = Number(office.endMinutes || 0) || 30;
              // format minutes-as-clock (HH:MM). Handles null/invalid and wraps hours into 0-23
              function fmtHM(totalMin){
                if (totalMin === null || totalMin === undefined || String(totalMin).trim() === '') return '--:--';
                let t = Number(totalMin);
                if (!Number.isFinite(t) || t < 0) t = 0;
                const h = Math.floor(t/60) % 24; // wrap to 0-23 to avoid 24:00
                const m = t % 60;
                return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
              }
              // format duration minutes as 'XH YM' (e.g. 100 -> '1H 40M')
              function fmtDurationM(totalMin){
                let t = Number(totalMin) || 0;
                if (!Number.isFinite(t) || t <= 0) return '0M';
                const h = Math.floor(t/60);
                const m = t % 60;
                return (h > 0 ? (h + 'H') : '') + (h > 0 && m > 0 ? ' ' : '') + (m > 0 ? (m + 'M') : (h>0?'' : '0M'));
              }
              // Determine check-in.
              // If there is no office internal time (internalM === 0) prefer the earliest visit start as check-in.
              let checkinTotal = null;
              try{
                const checkinH = Number(office.checkinHour || 0);
                const checkinM = Number(office.checkinMinute || 0);
                const officeCheckin = (Number.isFinite(checkinH) || Number.isFinite(checkinM)) ? (checkinH*60 + checkinM) : null;
                if ((Number(internalM) === 0) && earliestStart !== null){
                  // No office internal time: use earliest visit start when available
                  checkinTotal = earliestStart;
                } else if (earliestStart !== null && officeCheckin !== null){
                  checkinTotal = Math.min(earliestStart, officeCheckin);
                } else if (earliestStart !== null){
                  checkinTotal = earliestStart;
                } else { checkinTotal = (officeCheckin !== null) ? officeCheckin : null; }
              }catch(e){ if (earliestStart !== null) checkinTotal = earliestStart; }
              const checkoutTotal = (latestEnd > 0 ? (latestEnd + cleanupM) : (checkinTotal + internalM + meetingTotalM + cleanupM));

              const lines = [];
              lines.push(`(${staff || ''} 퇴근보고)`);
              lines.push(`방문일: ${visitDate || ''}`);
              lines.push(`총 방문 학교: ${uniqueSchools.length}개 · 총 미팅수: ${totalMeetings}건 · 연락처 확보: ${contacts}건 · 추가선정 확인: 0건`);

              // 1. 출근/퇴근
              const externalM = meetingTotalM + cleanupM;
              // Show cleanup (자료정리) duration in human-friendly format (e.g. 100 -> '1H 40M')
              lines.push(`퇴근보고(자료정리시간): ${fmtDurationM(cleanupM)}`);
              // 근무시간은 첫 방문 시작시간(checkinTotal)부터 퇴근자료정리 완료시간(checkoutTotal)까지로 계산
              const workedM = (checkoutTotal !== null && checkinTotal !== null) ? (checkoutTotal - checkinTotal) : (internalM + externalM);
              lines.push(`1. 출근: ${fmtHM(checkinTotal)} · 퇴근: ${fmtHM(checkoutTotal)} (근무시간 ${Math.floor(workedM/60)}H ${workedM%60}M)`);
              // Show office internal time only when office internal values were saved
              // Show office internal time only when a positive value was provided
              const internalHoursNum = Number(office.internalHours || 0);
              const internalMinutesNum = Number(office.internalMinutes || 0);
              const hasOfficeInternal = (internalHoursNum > 0 || internalMinutesNum > 0);
              if (hasOfficeInternal) lines.push(`   사무실 내근 (${Math.floor(internalM/60)}H ${internalM%60}M)`);
              lines.push('');
              lines.push('2. 세부업무');

              const korNums = ['가','나','다','라','마','바','사','아','자','차','카','타','파','하'];
              let idx = 0;
              for (const sch of uniqueSchools){
                idx++; const list = bySchool[sch] || [];
                // compute school start/end and max duration

                if (ch === ',' && !inQ){ cols.push(cur); cur = ''; continue; }
                cur += ch;
              }
              cols.push(cur);
              return cols.map(c=> (c||'').trim());
            });
            return rows;
          }catch(e){ return null; }
        }

        async function loadStaffMap(){
          if (window._cmass_staffMapReport) return window._cmass_staffMapReport;
          const byName = {};
          const byNorm = {};
          try{
            let rows = null;
            if (typeof window.fetchCsvRows === 'function'){
              try{ rows = await window.fetchCsvRows(); }catch(e){ rows = null; }
            }
            if (!rows){
              try{ const res = await fetch('/sales_staff.csv', { cache: 'no-store' }); if (res && res.ok){ const txt = await res.text(); rows = await parseCsvText(txt); } }catch(e){ rows = null; }
            }
            if (rows && rows.length>1){
              const header = rows[0].map(h=>String(h||'').trim());
              const nameKeys = header.filter(h=> /학교명|school[_ ]?name|name/i.test(h));
              const establishKeys = header.filter(h=> /설립|설립구분|establish|establishment|type/i.test(h));
              const studentsKeys = header.filter(h=> /총학생수|학생수|students|student/i.test(h));
              const featureKeys = header.filter(h=> /특성|feature|character/i.test(h));
              const scodeKeys = header.filter(h => /scode|학교코드|school[_ ]?code|schoolcode/i.test(h));
              for (let r=1;r<rows.length;r++){
                const row = rows[r];
                const obj = {};
                for (let i=0;i<header.length;i++) obj[header[i]] = String(row[i]||'').trim();
                const name = (nameKeys.map(k=>obj[k]).find(v=>v) || obj['학교명'] || obj['name'] || '').trim();
                if (!name) continue;
                const establish = (establishKeys.map(k=>obj[k]).find(v=>v) || obj['설립'] || obj['establish'] || '').trim();
                const students = (studentsKeys.map(k=>obj[k]).find(v=>v) || obj['총학생수'] || obj['students'] || '').trim();
                const feature = (featureKeys.map(k=>obj[k]).find(v=>v) || obj['특성'] || obj['feature'] || '').trim();
                // attempt to extract canonical school code (scode) when available in CSV
                let scodeVal = '';
                try{ scodeVal = (scodeKeys.map(k=>obj[k]).find(v=>v) || obj['scode'] || obj['학교코드'] || obj['school_code'] || obj['schoolcode'] || '').trim(); }catch(e){ scodeVal = ''; }
                const meta = { establish: establish || '', students: students || '', feature: feature || '', scode: scodeVal || '' };
                byName[name] = meta;
                const norm = (String(name||'').toLowerCase().replace(/\s+/g,' ').trim());
                byNorm[norm] = meta;
              }
            }
          }catch(e){ /* tolerate */ }
          window._cmass_staffMapReport = { byName, byNorm };
          return window._cmass_staffMapReport;
        }
        // start loading in background
        try{ loadStaffMap().catch(()=>{}); }catch(e){}
        window.loadStaffMapReport = loadStaffMap;
        // Lightweight helper to resolve school metadata (including scode) by name.
        try{
          window.findSalesStaffMeta = function(rawName){
            try{
              if (!rawName) return null;
              // ensure loader started
              try{ if (!window._cmass_staffMapReport && typeof loadStaffMapReport === 'function') loadStaffMapReport().catch(()=>{}); }catch(e){}
              const norm = String(rawName||'').toLowerCase().replace(/\s+/g,' ').trim();
              const map = window._cmass_staffMapReport || { byName: {}, byNorm: {} };
              if (map.byName && map.byName[rawName]) return map.byName[rawName];
              if (map.byNorm && map.byNorm[norm]) return map.byNorm[norm];
              return null;
            }catch(e){ return null; }
          };
        }catch(e){}
      })();

      function computeMetrics(entries){
        try{ window.computeMetrics = computeMetrics; }catch(e){}
        try{
          const targetVisit = (visitDate || '').toString().trim();
          // allow an effective staff override (set by _reRenderUI) so the UI can infer
          // the viewer's staff token when URL param is missing
          // normalize both the target and entry staff tokens for reliable comparisons
          const targetStaff = normalizeStaffToken((window._cmass_effectiveStaff || staff) || '');
          // Start by filtering with visitDate/staff from the provided array
          let rawFiltered = (entries||[]).filter(e => {
            try{
              const evd = (e.visitDate || '').toString().trim();
              const est = (e.staff || e.staffLabel || '').toString().trim();
              // visitDate: allow prefix match (handles full ISO timestamps)
              const visitMatch = !targetVisit || (evd.indexOf(targetVisit) === 0);
              // staff: require exact token match when provided (compare canonical tokens)
              const staffMatch = !targetStaff || (normalizeStaffToken(est) === targetStaff);
              return visitMatch && staffMatch;
            }catch(ex){ return false; }
          });
          // If we found nothing with the strict staff+visitDate filter, but a visitDate
          // is provided, try a looser fallback that matches visitDate only. This
          // handles cases where the saved entry uses a different staff token (e.g.
          // label vs token mismatch) but is still the same visit day.
          let usedStaffFallback = false;
          // If no entries matched both visitDate+staff, we used to fall back to visitDate-only.
          // Do NOT do this when an explicit staff filter (targetStaff) was provided via URL.
          if ((rawFiltered || []).length === 0 && targetVisit && !targetStaff){
            const looser = (entries||[]).filter(e => { try{ const evd = (e.visitDate||'').toString().trim(); return (!targetVisit) || (evd.indexOf(targetVisit) === 0); }catch(x){ return false; } });
            if ((looser||[]).length > 0){ rawFiltered = looser; usedStaffFallback = true; }
          }
          // Deduplicate by server_id when present, otherwise by _savedAt fallback
          const seen = new Set();
          const filtered = [];
          for (const e of rawFiltered){
            try{
              const key = (e && e.server_id) ? ('s:' + String(e.server_id)) : ('l:' + String(e._savedAt || JSON.stringify(e)));
              if (seen.has(key)) continue;
              seen.add(key);
              filtered.push(e);
            }catch(err){ filtered.push(e); }
          }
          const totalMeetings = filtered.length;
          try{ console.debug('[report] computeMetrics', { targetStaff: targetStaff, targetVisit: targetVisit, rawCount: (entries||[]).length, matched: totalMeetings, usedStaffFallback: !!usedStaffFallback }); }catch(e){}
          const schools = new Set(filtered.map(it => (it.school||'').toString().trim()).filter(Boolean));
          const totalSchools = schools.size;
          const contactsSecured = filtered.reduce((s,it)=> s + (((it.phone && String(it.phone).trim()) || (it.email && String(it.email).trim())) ? 1:0), 0);
          // Legacy 'publisher' reporting has been removed from the UI.
          // Keep the metric present but force to 0 to avoid relying on removed fields.
          const additionalSelections = 0;
          return { totalMeetings, totalSchools, contactsSecured, additionalSelections, filtered };
        }catch(e){ return { totalMeetings:0, totalSchools:0, contactsSecured:0, additionalSelections:0, filtered:[] }; }
      }

        // Render list of schools visited that day as clickable buttons under the summary
        try{

          const normalizedStaff = normalizeStaffToken(staff);
          const filteredByStaffRaw = (m.filtered || []).filter(it => { try{ const est = (it.staff || it.staffLabel || '').toString().trim(); return !normalizedStaff || (normalizeStaffToken(est) === normalizedStaff); }catch(e){ return false; } });
          // Deduplicate entries by server_id when present, otherwise by _savedAt fallback.

              if (match){ match.classList.add('active');

              btnAll.classList.add('active');

            }
          }catch(e){ btnAll.classList.add('active'); }
        }catch(e){ console.warn('renderSummary school list error', e); }
      }

          let startHour = '';
          let startMinute = '';
          try{
            if (start && String(start).indexOf(':') !== -1){ const parts = String(start).split(':'); startHour = parts[0]; startMinute = parts[1]; }
            else if (doc.startHour || doc.start_hour){ startHour = String(doc.startHour || doc.start_hour || ''); startMinute = String(doc.startMinute || doc.start_minute || ''); }
          }catch(e){}

          const possibleEnds = ['visitEnd','visitend','visit_end','endTime','end_time','visitEndTime','visit_end_time'];
          let endTime = '';
          for (const k of possibleEnds){ if (doc[k]){ endTime = doc[k]; break; } }
          // also preserve raw visitStart/visitEnd strings for direct display

          return {

            // normalize staff token from server document to canonical token when possible

                const lower = raw.toLowerCase();

                };
                const candidates = ['SongHoonjae','LimJunho','ChoYounghwan'];
                for (const c of candidates){ if (c.toLowerCase() === lower) return c; }
                return canon[lower] || raw;
              }catch(e){ return doc.staff || ''; }
            })(),
            staffLabel: doc.staffLabel || doc.staff || '',
            region: doc.region || '',
            school: doc.school || '',
            meta: doc.meta || doc.schoolMeta || '',
            visitDate: doc.visitDate || '',
            // keep both parsed hour/minute and raw visitStart string

        // Map local entry shape back to server payload
        function mapEntryToServerPayload(e){
          // attempt to attach scode (정보공시학교코드) by consulting CSV metadata if available
          let __mapped_scode = '';
          try{
            if (e && e.school){ try{ const m = (typeof findSalesStaffMeta === 'function') ? findSalesStaffMeta(e.school) : null; if (m && m.scode) __mapped_scode = m.scode; }catch(_e){} }

          }catch(_e){}

          return {
            staff: e.staff || '',
            staffLabel: e.staffLabel || '',
            region: e.region || '',
            school: e.school || '',
            visitDate: e.visitDate || '',
            visitStart: (e.startHour ? (String(e.startHour).padStart(2,'0') + ':' + (e.startMinute ? String(e.startMinute).padStart(2,'0') : '00')) : ''),
            duration: (e.duration !== undefined) ? Number(e.duration) : 0,
            visitEnd: e.endTime || '',
            subject: Array.isArray(e.subject) ? e.subject : (e.subject ? [e.subject] : []),
            activities: Array.isArray(e.activities) ? e.activities : (e.activities ? [e.activities] : []),

            teacher: e.teacherName || e.teacher || '',
            Phonenumber: e.phone || e.Phonenumber || '',
            phone: e.phone || e.Phonenumber || '',
            email: e.email || '',
            // conversation and issue (do not merge legacy request/delivery/gift/followup)
            conversation: e.conversation || e.notes || '',
            issue: e.issue || '',
            materials: Array.isArray(e.materials) ? e.materials : (e.materials ? [e.materials] : (e.material ? [e.material] : [])),
            _savedAt: e._savedAt || new Date().toISOString(),
            's-code': __mapped_scode || ''
          };
        }
        
          // Remove empty-string / empty-array fields so we don't overwrite
          // existing server-side values with blanks when merging updates.
          function sanitizePayload(p){
            try{
              const out = {};
              for (const k of Object.keys(p || {})){
                const v = p[k];
                if (v === null || v === undefined) continue;
                if (typeof v === 'string'){
                  if (String(v).trim() === '') continue;
                  out[k] = v;
                  continue;
                }
                if (Array.isArray(v)){
                  if (v.length === 0) continue;
                  out[k] = v;
                  continue;
                }
                out[k] = v;
              }
              return out;
            }catch(e){ return p || {}; }
          }

        // Prevent duplicate server uploads for the same entry
        async function uploadEntryToServer(entry) {
          if (!window.firebaseDb) {

              .where('staff', '==', payload.staff);

            const snap = await query.limit(2).get();
            if (!snap.empty) {
              // If found, update the first matching doc instead of adding a new one
              const doc = snap.docs[0];
              const sanitized = sanitizePayload(payload);
              await window.firebaseDb.collection('visit_entries').doc(doc.id).set(sanitized, { merge: true });

            } else {

              console.log('[서버업로드] 새 문서 추가:', ref.id, sanitized);
              return ref.id;
            }
          } catch (err) {
            console.error('[서버업로드] Firestore 에러:', err, payload);
            alert('서버 저장 실패: ' + (err && err.message ? err.message : String(err)));
            return null;
          }
        }

                  // However, if a server document is missing some fields (e.g. legacy docs without `staff` token)
                  // prefer filling those missing fields from the corresponding local entry when available.
                  const merged = [];
                  const serverById = {};
                  // index local entries by server_id (array) for possible enrichment/duplicates
                  const localById = {};
                  (localFiltered||[]).forEach(l => {
                    try{
                      const sid = String(l.server_id || l.serverId || '');
                      if (!sid) return;
                      localById[sid] = localById[sid] || [];
                      localById[sid].push(l);
                    }catch(e){}
                  });
                  docs.forEach(d => { if (d && d.server_id) serverById[String(d.server_id)] = d; });

                  // Start with server docs but enrich missing fields from local when possible.
                  // If multiple local entries share the same server_id, preserve them as additional
                  // entries rather than collapsing them into a single server doc.
                  docs.forEach(d => {
                    try {
                      if (!d) {
                        merged.push(d);
                        return;
                      }
                      const sid = String(d.server_id || d.serverId || '');
                      const localList = sid && localById[sid] ? localById[sid].slice() : [];
                      if (localList && localList.length) {
                        // Use first local item to enrich missing display fields on the server doc
                        const local = localList.shift();
                        const enriched = Object.assign({}, d);
                        if ((!enriched.staff || String(enriched.staff).trim() === '') && local.staff) enriched.staff = local.staff;
                        if ((!enriched.staffLabel || String(enriched.staffLabel).trim() === '') && local.staffLabel) enriched.staffLabel = local.staffLabel;

                        if ((!enriched.duration || Number(enriched.duration) === 0) && local.duration) enriched.duration = local.duration;
                        // copy teacher name from local when server doc lacks it

                          enriched.teacherName = local.teacherName || local.teacher || '';

                        // Enrich textual fields if server doc lacks them
                        if ((!enriched.request || String(enriched.request).trim() === '') && (local.request || local.requests || local.req || local.askText || local.requestText)) {
                          enriched.request = local.request || local.requests || local.req || local.askText || local.requestText || '';
                        }
                        if ((!enriched.conversation || String(enriched.conversation).trim() === '') && (local.conversation || local.notes || local.memo || local.note)) {
                          enriched.conversation = local.conversation || local.notes || local.memo || local.note || '';

                        }
                        merged.push(enriched);
                        // Any remaining local entries that share the same server_id but are distinct
                        // (for example, multiple sessions recorded locally before server consolidation)
                        // should be preserved as separate entries so they remain visible to the user.
                        try {
                          localList.forEach(extraLocal => {

                      }

                      console.error('[CMASS debug] Failed to merge entry:', e);
                      merged.push(d);
                    }
                  });

                  // Add local entries that are not represented on server (by server_id or by _savedAt)
                  localFiltered.forEach(l => {
                    try {
                      const sid = l.server_id || l.serverId || '';
                      if (sid && serverById[String(sid)]) return;
                      const exists = merged.find(mdoc => mdoc && mdoc._savedAt && l._savedAt && String(mdoc._savedAt) === String(l._savedAt));
                      if (!exists) merged.push(l);
                    } catch (e) {

                    }
                  });

                  const m = computeMetrics(merged || docs || []);
                  renderSummary(m);
                  renderEntries(m.filtered); // 전체 리스트 표시

    <script>
      // Inline safe uploader: upload checked local entries to Firestore one-by-one and
      // update localStorage with returned server_id. This is a defensive replacement
      // for the optional external integration script which may not be present or may
      // perform aggressive removals. It will never delete unrelated local entries.
      (function(){
        function qs(id){ return document.getElementById(id); }
        async function ensureAnon(){ try{ if (window.firebase && firebase.auth){ if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); return firebase.auth().currentUser; } }catch(e){ console.warn('ensureAnon failed', e); } return null; }

        async function uploadSelected(){
          const statusEl = qs('cmass-save-server-status'); const btn = qs('cmass-save-server-btn');
          if (btn) btn.disabled = true; if (statusEl) statusEl.textContent = '업로드 중...';
          try{
            if (!window.firebaseDb){ console.warn('no firebaseDb available'); if (statusEl) statusEl.textContent = 'Firebase unavailable'; return; }
            // ensure auth
            try{ await ensureAnon(); }catch(e){ console.warn('anon auth failed', e); }

            const checks = Array.from(document.querySelectorAll('input.cmass-upload-check')).filter(c => c && !c.disabled && c.checked);
            if (!checks.length){ if (statusEl) statusEl.textContent = '업로드할 항목을 선택하세요.'; return; }

            for (const chk of checks){
              try{
                // re-load fresh local array each iteration to avoid index drift
                const arr = loadLocalReports();
                let li = Number(chk.getAttribute('data-local-index'));
                let entry = null;
                if (!Number.isNaN(li) && li >=0 && li < arr.length){ entry = arr[li]; }
                // fallback: try to find by matching key fields if index not valid
                if (!entry){
                  // look for best match by server_id, _savedAt, then school+date+start
                  entry = null;
                  const sid = chk.dataset && chk.dataset.serverId ? String(chk.dataset.serverId) : '';
                  if (sid){ entry = arr.find(a=> a && String(a.server_id||'') === sid); }
                  if (!entry){ entry = arr.find(a=> a && a._savedAt && chk.getAttribute('data-local-index') === '-1' && String(a._savedAt) === String(chk.getAttribute('data-local-index'))); }
                  if (!entry){
                    entry = arr.find(a => a && String(a.school||'') === String(chk.dataset && chk.dataset.school || '') && String(a.visitDate||'') === String(visitDate));
                  }
                }
                if (!entry){ console.warn('could not locate local entry for upload checkbox', chk); continue; }
                // If already on server, skip
                if (entry.server_id){ console.debug('entry already saved on server, skipping', entry.server_id); continue; }

                // Build payload and add to Firestore
                const payload = mapEntryToServerPayload(entry);
                try{
                  const sanitized = (typeof sanitizePayload === 'function') ? sanitizePayload(payload) : payload;
                  const ref = await window.firebaseDb.collection('visit_entries').add(sanitized);
                  if (ref && ref.id){
                    // ensure server_id present on server doc
                    try{ await window.firebaseDb.collection('visit_entries').doc(ref.id).update({ server_id: ref.id }); }catch(e){}
                    // reload array, find matching entry again (match by _savedAt if available)
                    const arr2 = loadLocalReports();
                    let idx = arr2.findIndex(a => a && a._savedAt && entry._savedAt && String(a._savedAt) === String(entry._savedAt));
                    if (idx === -1){
                      // fallback by school+date+start
                      idx = arr2.findIndex(a => a && String(a.school||'')===String(entry.school||'') && String(a.visitDate||'')===String(entry.visitDate||'') && String(a.startHour||'')===String(entry.startHour||''));
                    }
                    if (idx === -1){
                      // as last resort, append and set index
                      arr2.push(Object.assign({}, entry, { server_id: ref.id })); idx = arr2.length-1;
                    } else {
                      arr2[idx].server_id = ref.id;
                    }
                    // Remove other local entries that have the same server_id to avoid duplicates, but do not remove unrelated entries
                    for (let k = arr2.length -1; k >=0; k--){ if (k === idx) continue; try{ if (arr2[k] && String(arr2[k].server_id||'') === String(ref.id)){ arr2.splice(k,1); if (k < idx) idx--; } }catch(e){} }
                    localStorage.setItem('cmass_reports', JSON.stringify(arr2));
                    if (statusEl) statusEl.textContent = `업로드 완료: ${entry.school || ''}`;
                  }
                }catch(e){ console.error('upload add failed', e); if (statusEl) statusEl.textContent = '업로드 실패 - 콘솔 확인'; }
              }catch(inner){ console.warn('upload loop item error', inner); }
            }
            // finished - re-render UI
            try{ _reRenderUI(); }catch(e){}
            if (statusEl) statusEl.textContent = '업로드 완료';
          }catch(err){ console.error('uploadSelected failed', err); if (qs('cmass-save-server-status')) qs('cmass-save-server-status').textContent = '업로드 실패'; }
          finally{ if (btn) btn.disabled = false; }
        }

            try{ window.uploadSelected = uploadSelected; }catch(e){}

        // Admin helper: backfill scode for existing visit_entries using CSV metadata (region+school disambiguation).
        // Usage: open console on report.html and call `await window.backfillScodes()`
        async function backfillScodes(){
          if (!window.firebaseDb){ console.error('Firebase DB not ready'); return { ok:false, reason:'no-db' }; }
          try{
            if (typeof window.confirm === 'function'){
              if (!confirm('기존 문서에 scode(정보공시학교코드)를 채웁니다. region+school 기반 매핑을 시도합니다. 계속하시겠습니까?')) return { ok:false, reason:'cancel' };
            }

            // Load and parse sales_staff.csv locally (independent of dashboard page)
            let csvText = '';
            try{ csvText = await fetch('/sales_staff.csv').then(r=> r.ok ? r.text() : ''); }catch(e){ console.warn('[backfillScodes] CSV fetch 실패', e); }
            if (!csvText){ console.warn('[backfillScodes] CSV 내용을 가져오지 못했습니다. school 기반 추정만 수행'); }

            function parseCSV(raw){
              try{
                raw = raw.replace(/\r\n/g,'\n');
                const lines = raw.split(/\n/).filter(l=> l.trim().length>0);
                if (!lines.length) return [];
                const header = lines[0].split(',').map(h=> h.trim());
                const idxSchool = header.findIndex(h => /^(school|학교|학교명)$/i.test(h));
                const idxRegion = header.findIndex(h => /^(region|지역|시도|시군구)$/i.test(h));
                const idxScode = header.findIndex(h => /^(scode|학교코드|정보공시학교코드)$/i.test(h));
                const rows = [];
                for (let i=1;i<lines.length;i++){
                  const row = lines[i].split(',');
                  if (row.length < header.length) continue;
                  const school = (row[idxSchool]||'').trim();
                  const region = (idxRegion !== -1 ? (row[idxRegion]||'').trim() : '');
                  const scode = (idxScode !== -1 ? (row[idxScode]||'').trim() : '');
                  if (!school || !scode) continue;
                  rows.push({ school, region, scode });
                }
                return rows;
              }catch(e){ console.warn('[backfillScodes] CSV parse 오류', e); return []; }
            }

            const csvRows = csvText ? parseCSV(csvText) : [];
            console.log('[backfillScodes] CSV rows:', csvRows.length);

            function normalizeSchoolKey(s){
              try{
                let t = (s||'').toString().toLowerCase();
                t = t.replace(/\s+/g,'');
                t = t.replace(/(남|여|여자|남자)(?=(?:고|중))/g,'');
                t = t.replace(/학교|중학교|고등학교/g,'');
                t = t.replace(/[^0-9a-z\u3131-\uD79D]/g,'');
                return t;
              }catch(e){ return (s||'').toString().toLowerCase(); }
            }

            // Build maps for fast lookup
            const exactMap = new Map(); // region|school(lower) -> scode
            const normBuckets = new Map(); // normalizedSchool -> array of {scode, regionLower}
            for (const r of csvRows){
              const regL = (r.region||'').toLowerCase();
              const schL = (r.school||'').toLowerCase();
              exactMap.set(regL+'|'+schL, r.scode);
              const nk = normalizeSchoolKey(r.school);
              if (nk){
                const arr = normBuckets.get(nk) || [];
                arr.push({ scode: r.scode, regionLower: regL });
                normBuckets.set(nk, arr);
              }
            }

            function resolveScode(school, region){
              if (!school) return '';
              const regL = (region||'').toLowerCase();
              const schL = (school||'').toLowerCase();
              const direct = exactMap.get(regL+'|'+schL);
              if (direct) return direct;
              const nk = normalizeSchoolKey(school);
              const bucket = normBuckets.get(nk) || [];
              if (!bucket.length) return '';
              if (bucket.length === 1) return bucket[0].scode;
              // try region disambiguation
              const regionMatched = bucket.filter(b => b.regionLower === regL);
              if (regionMatched.length === 1) return regionMatched[0].scode;
              // fallback: unique scode across bucket
              const uniqueSet = new Set(bucket.map(b=> b.scode));
              if (uniqueSet.size === 1) return bucket[0].scode;
              return ''; // ambiguous
            }

            console.log('[backfillScodes] 시작 - visit_entries 스캔 및 매핑 수행');
            const snap = await window.firebaseDb.collection('visit_entries').get();
            let total = 0, updated = 0, skipped = 0, failed = 0;
            for (const d of snap.docs){
              total++;
              try{
                const data = d.data() || {};
                const existing = (data.scode || '').toString().trim();
                if (existing){ skipped++; continue; }
                const schoolName = (data.school || '').toString();
                if (!schoolName){ skipped++; continue; }
                const regionName = (data.region || '').toString();
                let scode = '';
                // Prefer local resolution (region+school) over global findSalesStaffMeta
                try{ scode = resolveScode(schoolName, regionName); }catch(e){ scode=''; }
                if (!scode && typeof findSalesStaffMeta === 'function'){
                  try{ const meta = findSalesStaffMeta(schoolName); if (meta && meta.scode) scode = meta.scode; }catch(e){}
                }
                if (scode){
                  try{ await window.firebaseDb.collection('visit_entries').doc(d.id).set({ 's-code': scode }, { merge: true }); updated++; console.log('[backfillScodes] updated', d.id, schoolName, '=>', scode); }
                  catch(e){ failed++; console.warn('[backfillScodes] update 실패', d.id, e); }
                } else { skipped++; }
              }catch(e){ failed++; console.warn('[backfillScodes] item 처리 오류', e); }
            }
            console.log('[backfillScodes] 완료 - total:', total, 'updated:', updated, 'skipped:', skipped, 'failed:', failed);
            return { ok:true, total, updated, skipped, failed };
          }catch(e){ console.error('[backfillScodes] 실패', e); return { ok:false, error: e }; }
        }
        try{ window.backfillScodes = backfillScodes; }catch(e){}

    // 중복 바인딩 제거: 아래에서 한 번만 바인딩
    })();
    </script>

function reloadServerReports() {

    if (!window.firebaseDb) { console.warn('Firebase DB not ready'); return; }
    window.firebaseDb.collection('visit_entries').get().then(snapshot => {
      const entries = [];
      snapshot.forEach(doc => {
        const raw = doc.data() || {};
        raw.server_id = doc.id;
        try{
          if (typeof mapServerDocToEntry === 'function') entries.push(mapServerDocToEntry(raw));
          else entries.push(raw);
        }catch(e){ entries.push(raw); }
      });
      // 학교 필터를 강제로 초기화
      if (window._setActiveSchoolSelection) window._setActiveSchoolSelection('');
      // 기존 _reRenderUI와 동일하게 렌더링
      const metrics = computeMetrics(entries);
      window._cmass_report_lastFiltered = (metrics.filtered || []).slice();
      renderSummary(metrics);
      renderEntries(metrics.filtered); // 전체 리스트 표시
    }).catch(e => { console.error('reloadServerReports error', e); });
  } catch(e) { console.warn('reloadServerReports failed', e); }
}

                console.log('elementFromPoint center:', topEl);
                try{ console.log('computed pointer-events:', window.getComputedStyle(topEl).pointerEvents); }catch(e){}
                console.groupEnd();
              }catch(e){ console.warn('capture handler error', e); }
            };
            el.addEventListener('click', cap, true);

            // also attach a non-capture test handler (bubble) that logs when reached
            // and show a one-time alert to make the click result obvious to the user.
            const bub = function(ev){
              try{
                console.log(`[CMASS diag] bubble click reached ${id}`);
                if (!ev.currentTarget.dataset || !ev.currentTarget.dataset._cmassDiagFired){
                  try{ ev.currentTarget.dataset._cmassDiagFired = '1'; }catch(e){}
                  try{ alert('버튼 클릭 감지: ' + id); }catch(e){ console.log('alert blocked', e); }
                  // remove marker after short delay so repeated tests possible
                  setTimeout(()=>{ try{ delete ev.currentTarget.dataset._cmassDiagFired }catch(e){} }, 2000);
                }
              }catch(e){ console.warn('bubble handler error', e); }
            };
            el.addEventListener('click', bub, false);

            // Log what element is currently at the center of the button (possible overlay)
            try{
              const r = el.getBoundingClientRect();
              const cx = Math.round(r.left + r.width/2);
              const cy = Math.round(r.top + r.height/2);
              const topEl = document.elementFromPoint(cx, cy);
              log('elementFromPoint for', id, topEl);
            }catch(e){ }

          }catch(e){ warn('check per-id failed', id, e); }
        });

        // Try calling wireOfficeButtons again if present to re-attach listeners
        try{ if (typeof window.wireOfficeButtons === 'function'){ window.wireOfficeButtons(); log('wireOfficeButtons() 호출 완료'); } }catch(e){ warn('wireOfficeButtons 호출 실패', e); }

        // Ensure diagnostic helpers exist (redefine lightly if missing)
        try{
          if (typeof window.checkCopyButtonListeners2 !== 'function'){
            window.checkCopyButtonListeners2 = function(){ try{ const b = document.getElementById('btnCopyKakao'); if (!b) return {found:false}; try{ b.style.outline='3px dashed red'; b.scrollIntoView({block:'center'}); }catch(e){} return {found:true}; }catch(e){ return {found:false, error:e}; } };
            log('checkCopyButtonListeners2 재정의됨');
          }
          if (typeof window.testCopyToKakao2 !== 'function'){
            window.testCopyToKakao2 = async function(){ try{ log('testCopyToKakao2 호출'); return {ok:false, reason:'not-implemented-in-diagnostic'}; }catch(e){ return {ok:false,error:e}; } };
            log('testCopyToKakao2 재정의됨');
          }
        }catch(e){ warn('diagnostic helper 정의 실패', e); }

        console.groupEnd();
      }catch(e){ console.error('[CMASS diag] load listener failed', e); }
    });
  })();
  </script>
  </body>
