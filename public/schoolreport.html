<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <title>학교별 방문현황 - C-MASS</title>
  <style>
    /* Base look + Tailwind-like utility helpers used by this page */
    :root{--slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:rgba(15,23,42,0.04);--slate-500:#6b7280;--slate-700:#374151;--slate-900:#0b1220;--blue-600:#0b63d6}

    .min-h-screen{min-height:100vh}
    .bg-slate-50{background:var(--slate-50)}
    .p-4{padding:1rem}
    @media(min-width:768px){.md\:p-8{padding:2rem}}
    .font-sans{font-family:Segoe UI, Arial, sans-serif}
    .text-slate-900{color:var(--slate-900)}
     /* Make the main container responsive: use 95% of viewport width on wide screens
       while keeping it centered. This replaces the fixed large pixel width. */
     .max-w-7xl{max-width:95vw; width:95%; margin-left:auto; margin-right:auto}
    .mx-auto{margin-left:auto;margin-right:auto}
    .mb-6{margin-bottom:1.5rem}
    .space-y-6 > * + *{margin-top:1.5rem}
    .bg-white{background:#fff}
    .rounded-xl{border-radius:12px}
    .shadow-sm{box-shadow:0 6px 18px rgba(17,24,39,0.06)}
    .border{border:1px solid var(--slate-200)}
    .border-slate-200{border-color:var(--slate-200)}
    .p-6{padding:1.5rem}
    .text-lg{font-size:1.125rem}
    .font-bold{font-weight:700}
    .text-slate-500{color:var(--slate-500)}
    .text-slate-800{color:#0b1220}
    .flex{display:flex}
    .items-center{align-items:center}
    .gap-2{gap:0.5rem}
    .rounded{border-radius:8px}
    .px-4{padding-left:1rem;padding-right:1rem}
    .py-2{padding-top:0.5rem;padding-bottom:0.5rem}
    .w-64{width:16rem}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--blue-600);color:#fff;border:none;cursor:pointer}

    /* original local card/table styles preserved for internal use */
    .page{max-width:1100px;margin:0 auto}
    .card{background:#fff;border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 8px 20px rgba(17,24,39,0.04);border:1px solid rgba(15,23,42,0.04)}

    tbody td{padding:10px;border-bottom:1px solid var(--slate-200)}

    .pill{display:inline-block;padding:6px 8px;background:var(--slate-100);border-radius:8px;font-size:13px}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    /* Date/School summary styles refined for pixel-match */
    /* Date blocks: stronger separation and subtle accent */
    #schoolsSummary .date-block{margin-bottom:18px;padding:8px;border-radius:14px;background:linear-gradient(180deg, rgba(11,99,214,0.02), rgba(15,23,42,0.00));box-shadow:0 6px 18px rgba(11,99,214,0.03)}
    #schoolsSummary .date-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-radius:10px;border-left:6px solid rgba(11,99,214,0.14);box-shadow:0 4px 12px rgba(2,6,23,0.03)}
    #schoolsSummary .date-header .date-text{font-weight:800;font-size:18px;color:var(--slate-900);letter-spacing:0.2px}
    #schoolsSummary .date-header .date-count{color:var(--slate-500);font-size:14px}
    #schoolsSummary .schools-wrap{margin-top:10px}

    #schoolsSummary .school-left{font-weight:700;font-size:15px;color:var(--slate-900)}
    #schoolsSummary .school-region{font-size:13px;color:var(--slate-500);margin-top:4px}

    #schoolsSummary .visit-left{min-width:220px}

    #loadingOverlay .box{background:rgba(255,255,255,0.06);padding:18px 22px;border-radius:10px}
     /* Ensure summary tables use a fixed layout so column widths remain consistent
       between default and staff-filtered views. Use a dedicated class so both
       statically-declared and dynamically-created tables share identical rules. */
      .fixed-report-table { table-layout: fixed !important; width:1750px !important; min-width:1750px !important; }
      .fixed-report-table th, .fixed-report-table td { overflow: hidden; box-sizing: border-box !important; }
      /* Strongly enforce column widths via <col> so dynamically-created tables
        and statically-declared ones render identical widths across views. */

      .fixed-report-table col.col-subject { width:120px !important; min-width:120px !important; }

      .fixed-report-table col.col-reaction { width:100px !important; min-width:100px !important; }
      .fixed-report-table col.col-convo { width:650px !important; min-width:650px !important; }
      .fixed-report-table col.col-sales { width:280px !important; min-width:280px !important; }
      .fixed-report-table col.col-materials { width:280px !important; min-width:280px !important; }
      .fixed-report-table col.col-follow { width:150px !important; min-width:150px !important; }
      /* ensure the conversation column wraps as intended - support both
        dynamic per-school tables (4th col) and the visitLogSection static
        table (8th col). */
      .fixed-report-table th:nth-child(4), .fixed-report-table td:nth-child(4),
      .fixed-report-table th:nth-child(8), .fixed-report-table td:nth-child(8) { white-space: pre-wrap; }

<body>

          <div class="kpi-title" style="font-size:13px;color:var(--slate-500)">방문 학교</div>

  <script src="/js/csv-utils.js"></script>

  <script>
    // Page-provided SCHOOL_INFO should be empty by default; authoritative
    // metadata comes from `public/sales_staff.csv` (CSV is canonical).
    const SCHOOL_INFO = { name: '' };

    // Placeholder emptied so CSV-loaded orders fully replace this array at runtime.
    const TEXTBOOK_ORDERS = [];

    // Visit records (raw rows). Initialize to empty array so code referencing
    // `RAW_DATA` doesn't throw when the page loads before Firestore/CSV fills it.
    const RAW_DATA = [];
    window.RAW_DATA = RAW_DATA;

    // Optional manual overrides for school name matching.
    // Use when order CSV uses a different canonical name than visit logs.
    // Example: { '명지중': '명지중학교' }
    const SCHOOL_NAME_OVERRIDES = {};
    // expose for runtime debugging/quick edits in console
    window.__SCHOOL_NAME_OVERRIDES = SCHOOL_NAME_OVERRIDES;

    function resolveSchoolOverride(rawName){
      try{
        if(!rawName) return rawName;
        const k = normalizeSchool(rawName||'');
        if(k && SCHOOL_NAME_OVERRIDES && SCHOOL_NAME_OVERRIDES[k]) return String(SCHOOL_NAME_OVERRIDES[k]);
      }catch(e){}
      return rawName;
    }

    // Return orders relevant to a specific school when possible.
    // If orders have a `school` field, filter by it; otherwise, return global orders when school matches SCHOOL_INFO.name.
    function getOrdersForSchool(schoolName){
      if(!Array.isArray(TEXTBOOK_ORDERS) || !TEXTBOOK_ORDERS.length) return [];
      try{
        // apply manual override mapping if present
        let key = String(schoolName||'').trim();
        key = resolveSchoolOverride(key) || key;
        const normKey = normalizeSchool(key, true);
        const rawLower = String(key||'').trim().toLowerCase();

        // Determine target school level token (초등/중등/고등) to avoid cross-level matches
        const targetLevel = (function(){
          try{
            // prefer authoritative level from salesStaffMap or SCHOOLS_CSV_MAP if available
            try{
              if(window.salesStaffMap){ const sEntry = salesStaffMap.get(String(key||'').trim().toLowerCase()) || salesStaffMap.get(normalizeSchool(key, true)) || salesStaffMap.get(normalizeSchool(key)); if(sEntry && sEntry.schoolLevel) return mapSchoolLevelToKorean(sEntry.schoolLevel); }
            }catch(e){}
            try{ if(SCHOOLS_CSV_MAP && SCHOOLS_CSV_MAP.has(normalizeSchool(key))){ const s = SCHOOLS_CSV_MAP.get(normalizeSchool(key)); if(s && s.schoolLevel) return mapSchoolLevelToKorean(s.schoolLevel); } }catch(e){}
            // fallback: detect from the provided schoolName string
            return detectSchoolLevel(key) || '';
          }catch(e){ return ''; }
        })();

        // Determine authoritative school code for the target school (if available)
        // Prefer explicit code from schools CSV/metadata or salesStaff entries.
        let targetCode = '';
        try{
          const preserved = normalizeSchool(key, true);
          if(preserved && SCHOOLS_CSV_MAP && SCHOOLS_CSV_MAP.has(preserved)){
            const s = SCHOOLS_CSV_MAP.get(preserved);
            if(s && (s.infoCode || s.schoolCode)) targetCode = String(s.infoCode || s.schoolCode || '').trim();
          }
        }catch(e){}
        try{
          if(!targetCode && normKey && SCHOOLS_CSV_MAP && SCHOOLS_CSV_MAP.has(normKey)){
            const s = SCHOOLS_CSV_MAP.get(normKey);
            if(s && (s.infoCode || s.schoolCode)) targetCode = String(s.infoCode || s.schoolCode || '').trim();
          }
        }catch(e){}
        try{
          if(!targetCode && window.salesStaffMap){
            const byRaw = salesStaffMap.get(String(key||'').trim().toLowerCase()) || salesStaffMap.get(normKey) || salesStaffMap.get(normalizeSchool(key, true));
            if(byRaw && (byRaw.infoCode || byRaw.schoolCode)) targetCode = String(byRaw.infoCode || byRaw.schoolCode || '').trim();
          }
        }catch(e){}

        // If we have a targetCode and there are orders keyed by code, prefer and return those immediately.
        try{ if(targetCode && window.ORDER_SCHOOL_CODE_MAP && ORDER_SCHOOL_CODE_MAP.has(targetCode)) return ORDER_SCHOOL_CODE_MAP.get(targetCode) || []; }catch(e){}

        // prefer precomputed ORDER maps when available (but filter by targetCode when present)
        try{ if(window.ORDER_SCHOOL_MAP && ORDER_SCHOOL_MAP.has(normKey)){
            const list = ORDER_SCHOOL_MAP.get(normKey) || [];
            console.debug && console.debug('[getOrdersForSchool] ORDER_SCHOOL_MAP lookup', { normKey, listCount: list.length, targetCode, targetLevel });
            if(targetCode){
              // when we have an authoritative code, only return items that either lack a code or match it
              return list.filter(o => !o.schoolCode || String(o.schoolCode).trim() === targetCode);
            }
            if(targetLevel){
              // prefer same-level candidates
              const filtered = list.filter(o => mapSchoolLevelToKorean(o.schoolLevel || o.level || o.schoolRaw || o.school || o.schoolFormula) === targetLevel);
              if(filtered.length) return filtered;
              // enforce strict same-level requirement: if no same-level candidates, avoid returning mixed-level list
              const strict = list.filter(o => {
                const candidateLevel = mapSchoolLevelToKorean(o.schoolLevel || o.level || o.schoolRaw || o.school || o.schoolFormula);
                return candidateLevel === targetLevel;
              });
              if(strict.length) return strict;
              return [];
            }
            return list;
          } }catch(e){}
        try{ if(window.ORDER_SCHOOL_RAW_MAP && ORDER_SCHOOL_RAW_MAP.has(rawLower)){
            const list = ORDER_SCHOOL_RAW_MAP.get(rawLower) || [];
            console.debug && console.debug('[getOrdersForSchool] ORDER_SCHOOL_RAW_MAP lookup', { rawLower, listCount: list.length, targetCode, targetLevel });
            if(targetCode){
              return list.filter(o => !o.schoolCode || String(o.schoolCode).trim() === targetCode);
            }
            if(targetLevel){
              const filtered = list.filter(o => mapSchoolLevelToKorean(o.schoolLevel || o.level || o.schoolRaw || o.school || o.schoolFormula) === targetLevel);
              if(filtered.length) return filtered;
              const strict = list.filter(o => {
                const candidateLevel = mapSchoolLevelToKorean(o.schoolLevel || o.level || o.schoolRaw || o.school || o.schoolFormula);
                return candidateLevel === targetLevel;
              });
              if(strict.length) return strict;
              return [];
            }
            return list;
          } }catch(e){}

        // fallback: scan TEXTBOOK_ORDERS for matches (normalize and compare)
        // We'll prioritize candidates that match both name and schoolLevel when possible.
        const exactMatches = [];
        const partialMatches = [];
        for(const o of TEXTBOOK_ORDERS){
          try{
            const oNorm = o.schoolNorm || normalizeSchool(o.school || o.schoolFormula || o.schoolRaw || '', true);
            const oRaw = String(o.schoolRaw || o.school || o.schoolFormula || '').trim().toLowerCase();
            // exact normalized match
            // If targetCode is known, skip candidates with a different explicit schoolCode
            if(targetCode && o.schoolCode && String(o.schoolCode).trim() && String(o.schoolCode).trim() !== targetCode){ continue; }
            // exact normalized match
            if(oNorm && normKey && oNorm === normKey){ exactMatches.push(o); continue; }
            // exact raw match
            if(oRaw && rawLower && oRaw === rawLower){ exactMatches.push(o); continue; }
            // code match (match when candidate has same code)
            if(o.schoolCode && targetCode && String(o.schoolCode).trim() === targetCode){ exactMatches.push(o); continue; }

            // for partial matches, consider level-aware filtering
            const candidateLevel = mapSchoolLevelToKorean(o.schoolLevel || o.level || (o.school||o.schoolFormula||o.schoolRaw||'') );
            const nameContains = (String(o.school || o.schoolFormula || o.schoolRaw || '').toLowerCase().indexOf(String(key||'').toLowerCase()) !== -1);
            if(nameContains){
              // If targetCode is known, and candidate has a different explicit code, skip
              if(targetCode && o.schoolCode && String(o.schoolCode).trim() && String(o.schoolCode).trim() !== targetCode) { continue; }
              // if we have a targetLevel and candidateLevel, prefer same-level
              if(targetLevel && candidateLevel){ if(targetLevel === candidateLevel) partialMatches.push(o); else { /* different level - skip for now */ } }
              else { partialMatches.push(o); }
            }
          }catch(e){ /* per-entry ignore */ }
        }

        if(exactMatches.length){
          if(targetLevel){
            const fm = exactMatches.filter(o => mapSchoolLevelToKorean(o.schoolLevel || o.level || o.schoolRaw || o.school || o.schoolFormula) === targetLevel);
            if(fm.length) return fm;
            // strict: do not return cross-level exact matches
            return [];
          }
          return exactMatches;
        }
        if(partialMatches.length){
          if(targetLevel){
            const fm = partialMatches.filter(o => mapSchoolLevelToKorean(o.schoolLevel || o.level || o.schoolRaw || o.school || o.schoolFormula) === targetLevel);
            if(fm.length) return fm;
            // strict fallback: don't return partial matches from other levels
            return [];
          }
          return partialMatches;
        }

        // final fallback: return empty array to avoid cross-school pollution
        return [];
      }catch(e){ return []; }
    }

    // Enrich salesStaffMap entries (especially those created from orders) using
    // SCHOOLS_CSV_MAP / SCHOOLS_RAW_MAP / SCHOOLS_CODE_MAP and existing

    async function enrichSalesStaffFromSchools(){

        const normIndex = new Map();
        for(const [k,v] of salesStaffMap.entries()){

            const hasTotals = (entry.totalStudents && Number(entry.totalStudents) > 0) || (entry.grade1 || entry.grade2 || entry.grade3);
            if(hasTotals) continue;

            const schoolName = entry.school || entry.name || k || '';
            const norm = normalizeSchool(schoolName);
            const preserved = normalizeSchool(schoolName, true);

            // attempt 1: schools CSV map (normalized)
            let found = null;
            try{ if(norm && SCHOOLS_CSV_MAP && SCHOOLS_CSV_MAP.has(norm)) found = SCHOOLS_CSV_MAP.get(norm); }catch(e){}
            try{ if(!found && preserved && SCHOOLS_CSV_MAP && SCHOOLS_CSV_MAP.has(preserved)) found = SCHOOLS_CSV_MAP.get(preserved); }catch(e){}
            // attempt 2: raw map
            try{ if(!found && SCHOOLS_RAW_MAP && SCHOOLS_RAW_MAP.has(String(schoolName||'').trim().toLowerCase())) found = SCHOOLS_RAW_MAP.get(String(schoolName||'').trim().toLowerCase()); }catch(e){}
            // attempt 3: code map when entry has schoolCode
            try{ if(!found && entry.schoolCode && SCHOOLS_CODE_MAP && SCHOOLS_CODE_MAP.has(String(entry.schoolCode).trim())) found = SCHOOLS_CODE_MAP.get(String(entry.schoolCode).trim()); }catch(e){}
            // attempt 4: match against normalized salesStaffMap entries
            try{
              if(!found){
                // look for any indexed normalized entry containing our norm token
                for(const [nk, nv] of normIndex.entries()){
                  if(!nk) continue;
                  if(norm && nk.indexOf(norm) !== -1){ found = nv; break; }
                  if(preserved && nk.indexOf(preserved) !== -1){ found = nv; break; }
                }
              }
            }catch(e){}

            if(found){
              // merge useful fields into existing entry (do not overwrite explicit values)
              try{
                entry.totalStudents = entry.totalStudents || found.totalStudents || found['총학생수'] || found.total || entry.totalStudents || 0;
                // prefer CSV-provided total classes when present (학급수계)
                entry.totalClasses = entry.totalClasses || found.totalClasses || found['학급수계'] || found.totalClasses || entry.totalClasses || 0;
                entry.grade1 = entry.grade1 || found.grade1 || found['1학년'] || '';
                entry.grade2 = entry.grade2 || found.grade2 || found['2학년'] || '';
                entry.grade3 = entry.grade3 || found.grade3 || found['3학년'] || '';
                entry.establishment = entry.establishment || found.establishment || found.type || found['설립구분'] || '';
                entry.schoolLevel = entry.schoolLevel || found.schoolLevel || found.level || '';

                salesStaffMap.set(k, entry);
              }catch(e){}

            // fallback: if still no totals, try to parse numeric tokens from the raw CSV row
            try{ if((!entry.totalStudents || Number(entry.totalStudents) === 0) && entry.raw && Array.isArray(entry.raw) && entry.raw.length){

            } }catch(e){}
          }catch(e){ /* per-key ignore */ }
        }
        // post-process: ensure totals reflect per-grade stats when available
        try{
          for(const [k, entry] of salesStaffMap.entries()){
            try{
              const p = (v)=>{ try{ if(v===undefined||v===null) return 0; if(typeof v === 'number') return v; const s = String(v||'').replace(/[,\s\u00A0]/g,''); const m = s.match(/-?\d+/); return m ? Number(m[0]) : 0; }catch(e){return 0;} };
              const g1 = p(entry.grade1 || entry['1학년'] || entry['1학년학생수'] || entry.grade1_students || entry['grade1']);
              const g2 = p(entry.grade2 || entry['2학년'] || entry['2학년학생수'] || entry.grade2_students || entry['grade2']);
              const g3 = p(entry.grade3 || entry['3학년'] || entry['3학년학생수'] || entry.grade3_students || entry['grade3']);
              const c1 = p(entry.grade1_classes || entry['1학년학급수'] || entry.grade1class || entry.g1_classes);
              const c2 = p(entry.grade2_classes || entry['2학년학급수'] || entry.grade2class || entry.g2_classes);
              const c3 = p(entry.grade3_classes || entry['3학년학급수'] || entry.grade3class || entry.g3_classes);
              const studentSum = (g1||0) + (g2||0) + (g3||0);
              const classSum = (c1||0) + (c2||0) + (c3||0);
              if(studentSum && (!entry.totalStudents || Number(entry.totalStudents) !== studentSum)) entry.totalStudents = studentSum;
              if(classSum && (!entry.totalClasses || Number(entry.totalClasses) !== classSum)) entry.totalClasses = classSum;
              salesStaffMap.set(k, entry);
            }catch(e){}
          }
        }catch(e){}

      }catch(e){ console.warn('enrichSalesStaffFromSchools failed', e); }

    // Heuristic: examine CSV raw row array to find numeric tokens that look like
    // student totals or per-grade student counts and populate entry fields.
    function fillTotalsFromRaw(entry){
      try{
        if(!entry || !entry.raw || !Array.isArray(entry.raw)) return false;
        const raw = entry.raw.map(r => String(r||'').replace(/\uFEFF/g,'').trim());
        // collect integer tokens (remove commas) and floats as numbers
        const nums = [];
        for(const cell of raw){
          if(!cell) continue;
          // match numbers like 1,234 or 1234 or 31.1
          const matches = cell.match(/\d{1,3}(?:[\,\d]{0,})?(?:\.\d+)?/g);
          if(!matches) continue;
          for(const m of matches){
            const cleaned = m.replace(/,/g,'');
            const n = Number(cleaned);
            if(!isNaN(n)) nums.push(n);
          }
        }
        if(!nums.length) return false;
        // Candidate student-like numbers: prefer integers >= 20
        const studentCandidates = nums.filter(n => Number.isFinite(n) && Math.round(n) >= 20);
        if(studentCandidates.length){
          // If there are at least 3 candidates, choose a run of three similar values as grades
          // Find any sequence of three values in original order that are all >=20 and <= 2000
          const grades = [];
          for(let i=0;i<nums.length;i++){
            const a = nums[i]; if(!(Number.isFinite(a) && Math.round(a) >=20 && a <= 5000)) continue;
            const b = nums[i+1]; const c = nums[i+2];
            if(b!==undefined && c!==undefined && Number.isFinite(b) && Number.isFinite(c) && Math.round(b) >=20 && Math.round(c) >=20){
              // plausible grade triple found
              grades.push(Math.round(a)); grades.push(Math.round(b)); grades.push(Math.round(c));
              break;
            }
          }
          if(grades.length === 3){ entry.grade1 = entry.grade1 || grades[0]; entry.grade2 = entry.grade2 || grades[1]; entry.grade3 = entry.grade3 || grades[2]; }
          // totalStudents: prefer an explicit large candidate (>= sum of grades) or sum of grades
          const possibleTotals = studentCandidates.filter(n=> n >= 30).map(n=>Math.round(n));
          let total = entry.totalStudents && Number(entry.totalStudents) ? Number(entry.totalStudents) : 0;
          if(!total){
            // try to pick the largest candidate that is >= sum(grades)
            const gradeSum = (entry.grade1||0) + (entry.grade2||0) + (entry.grade3||0);
            const bySize = possibleTotals.sort((a,b)=> b-a);
            if(bySize.length){
              if(gradeSum && bySize[0] >= gradeSum) total = bySize[0];
              else total = gradeSum || bySize[0];
            } else if(gradeSum) total = gradeSum;
          }
          if(total) entry.totalStudents = Number(total);
          return Boolean(entry.totalStudents || entry.grade1 || entry.grade2 || entry.grade3);
        }
        return false;
      }catch(e){ return false; }
    }

    // visitDate -> show in badge

      if(rc === '좋음') return `<span style="display:inline-block;padding:4px 8px;border-radius:999px;background:#ecfccb;color:#365314;font-size:12px;font-weight:600">좋음</span>`;

    // Normalize various possible reaction field values into Korean buckets
    // so the UI displays consistent badges regardless of source field name or value.
    function normalizeReaction(raw){
      try{
        if(raw === undefined || raw === null) return '';
        const s = String(raw).trim().toLowerCase();
        if(!s) return '';
        // explicit mapping for common variants
        const map = {
          '좋음':'좋음','좋':'좋음','good':'좋음','positive':'좋음','favor':'좋음','fav':'좋음','추천':'좋음','1':'좋음','true':'좋음',
          '보통':'보통','normal':'보통','neutral':'보통','중립':'보통','0':'보통',
          '나쁨':'나쁨','bad':'나쁨','negative':'나쁨','싫음':'나쁨','-1':'나쁨','false':'나쁨'
        };
        if(map[s]) return map[s];
        // handle cases where the token contains a keyword
        if(/좋|fav|recommend|추천/.test(s)) return '좋음';
        if(/보통|normal|neutral|중립/.test(s)) return '보통';
        if(/나쁨|bad|negative|싫음/.test(s)) return '나쁨';
        // if already a Korean bucket-like token (possibly lowercase), normalize to canonical form
        if(/^(좋음|보통|나쁨)$/.test(s)) return s;
        // fallback: return original trimmed string
        return String(raw).trim();
      }catch(e){ return String(raw||''); }
    }

    // normalize/format region strings like "경기도성남시분당구" -> "경기도 성남시 분당구"
    function formatRegion(region){
      if(!region) return '';
      const s = String(region).trim();
      // insert a space after common administrative unit suffixes when immediately followed by another Korean character
      // order longer tokens first to avoid partial matches
      return s.replace(/(특별자치도|특별자치시|광역시|특별시|도|시|군|구)(?=[가-힣])/g, '$1 ').replace(/\s+/g,' ').trim();
    }

    // detect school level (returns '초등'|'중등'|'고등' or empty string)
    function detectSchoolLevel(s){
      if(!s) return '';
      const str = String(s).toLowerCase();
      // check longer tokens first
      if(/(초등학교|초등)/.test(str)) return '초등';
      if(/(중학교|중등|중)/.test(str)) return '중등';
      if(/(고등학교|고등|고)/.test(str)) return '고등';
      return '';
    }

    // normalize school names (delegate to csv-utils when available)
    // Note: we separately detect school level with `detectSchoolLevel` so
    // we can avoid mapping across different school levels (예: 중 vs 고).
    // normalize school names. If `preserveSuffix` is true, do not strip
    // trailing tokens like '중학교'/'고등학교' — useful when the caller
    // needs the full displayed name preserved for exact-key lookups.
    function normalizeSchool(s, preserveSuffix){
      try{ if(window.csvUtils && window.csvUtils.normalizeSchool) return window.csvUtils.normalizeSchool(s); }catch(e){}
      if(!s) return '__unknown__';
      let t = String(s).trim().toLowerCase();
      // remove internal whitespace and harmless punctuation
      t = t.replace(/\s+/g,'');
      t = t.replace(/["'`\.,\-\/\\()\[\]]+/g,'');
      if(!preserveSuffix){
        // remove common long-form suffixes like '초등학교','중학교','고등학교','학교'
        t = t.replace(/(초등학교|초등|중학교|중등학교|중등|고등학교|고등|학교|학교명)$/g,'');
        // also remove trailing single-character suffixes only after we've
        // captured the level via detectSchoolLevel where necessary elsewhere.
        t = t.replace(/(학|교)$/g,'');
      }
      return t || '__unknown__';
    }

    // Subject priority ordering for visit tables. Entries with subjects
    // earlier in this array will appear before later ones. Unlisted
    // subjects are treated as lowest priority.
    const SUBJECT_PRIORITY = ['정보','진로','보건','미술','체육','도서관사서','학년부장','특성화','기타'];
    function subjectPriorityIndex(subject){
      try{
        if(!subject) return SUBJECT_PRIORITY.length;
        const s = String(subject||'').trim();
        for(let i=0;i<SUBJECT_PRIORITY.length;i++){
          if(s.indexOf(SUBJECT_PRIORITY[i]) !== -1) return i;
        }
        return SUBJECT_PRIORITY.length;
      }catch(e){ return SUBJECT_PRIORITY.length; }
    }
    function compareVisitsBySubjectThenDate(a,b){
      try{
        const pa = subjectPriorityIndex(a.subject || a.activity || '');
        const pb = subjectPriorityIndex(b.subject || b.activity || '');
        if(pa !== pb) return pa - pb;
        const da = new Date(a.date||'1970-01-01');
        const db = new Date(b.date||'1970-01-01');
        return da - db;
      }catch(e){ return 0; }
    }

    // return a lightweight school info object for a given school name.
    // IMPORTANT: prefer metadata from `sales_staff.csv` (salesStaffMap) only.
    function getSchoolInfoFor(schoolName, rows){
      const name = String(schoolName||'').trim();
      try{
        if(name && salesStaffLoaded && salesStaffMap && salesStaffMap.size){
          // try exact raw-lower key first
          const rawKey = String(name||'').trim().toLowerCase();
          let m = salesStaffMap.get(rawKey);
          // then try preserved normalized full-name key
          if(!m){ try{ const p = normalizeSchool(name, true); if(p) m = salesStaffMap.get(p); }catch(e){} }
          // also allow lookup by normalized key without suffix if present (least preferred)
          if(!m){ try{ const n = normalizeSchool(name); if(n) m = salesStaffMap.get(n); }catch(e){} }
          if(m){
            // Build a minimal schoolInfo shape from sales_staff entry
            const makeGrade = (n) => ({ grade: `${n}학년`, classes: m[`grade${n}_classes`] || m[`grade${n}classes`] || '', students: m[`grade${n}`] || m[`grade${n}_students`] || m[`grade${n}students`] || '' });
            const regionFromRows = (rows && rows[0] && rows[0].region) ? rows[0].region : (m.region || '');
            return {
              name: m.school || m.name || name,
              region: regionFromRows || m.region || '',
              type: m.establishment || m.type || '',
              level: m.schoolLevel || m.level || '',
              feature: m.features || m.feature || '',
              totalStudents: m.totalStudents || '',
              gradeStats: [ makeGrade(1), makeGrade(2), makeGrade(3) ],
              _matchedBy: 'sales_staff'
            };
          }
        }
      }catch(e){ /* ignore */ }
      // If no sales_staff match, return minimal info derived from rows (do not consult orders)
      const region = (rows && rows[0] && rows[0].region) ? rows[0].region : '';
      return { name, region, type: '', level: '', feature: '', totalStudents: '', gradeStats: [] };
    }

    // Fallback helper: try to enrich a schoolInfo object from salesStaffMap or raw row data
    function enrichSchoolInfoFromSalesEntry(schoolInfo, schoolName){
      try{
        if(!schoolName) return schoolInfo;
        if(!schoolInfo) schoolInfo = { name: schoolName, region: '', type: '', level: '', feature: '', totalStudents: '', gradeStats: [] };
        // if already has totals/gradeStats, nothing to do
        const hasTotals = (schoolInfo.totalStudents && Number(schoolInfo.totalStudents)) || (Array.isArray(schoolInfo.gradeStats) && schoolInfo.gradeStats.length && schoolInfo.gradeStats.some(g=>g.students));
        if(hasTotals) return schoolInfo;

        // Try salesStaffMap helper if available
        let sEntry = undefined;
        try{ if(typeof window.__findSalesStaff === 'function') sEntry = window.__findSalesStaff(schoolName); }catch(e){}
        try{ if(!sEntry && typeof salesStaffMap !== 'undefined'){ sEntry = salesStaffMap.get(String(schoolName||'').trim().toLowerCase()) || salesStaffMap.get(normalizeSchool(schoolName)) || salesStaffMap.get(normalizeSchool(schoolName, true)); } }catch(e){}

        const getNum = (obj, keys)=>{
          if(!obj) return 0;
          const probe = (k)=>{
            if(k === undefined || k === null) return undefined;
            try{ if(obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') return Number(String(obj[k]).replace(/[^0-9]/g,'')) || 0; }catch(e){}
            try{ if(obj.raw && obj.raw[k] !== undefined && obj.raw[k] !== null && String(obj.raw[k]).trim() !== '') return Number(String(obj.raw[k]).replace(/[^0-9]/g,'')) || 0; }catch(e){}
            try{ if(obj.row && obj.row[k] !== undefined && obj.row[k] !== null && String(obj.row[k]).trim() !== '') return Number(String(obj.row[k]).replace(/[^0-9]/g,'')) || 0; }catch(e){}
            return undefined;
          };
          for(const k of keys){ const v = probe(k); if(v !== undefined) return v; }
          // last resort: scan any string values in obj/raw/row for a reasonable number >=20
          try{
            const candidates = [];
            const scanObj = (o)=>{ if(!o) return; for(const p in o){ try{ const s = String(o[p]||''); const m = s.match(/\d{1,4}(?:[,\d]{0,})?(?:\.\d+)?/g); if(m){ for(const mm of m){ const n = Number(String(mm).replace(/,/g,'')); if(!isNaN(n)) candidates.push(n); } } }catch(e){} } };
            scanObj(obj); scanObj(obj.raw); scanObj(obj.row);
            candidates.sort((a,b)=> b-a);
            for(const c of candidates){ if(Number.isFinite(c) && Math.round(c) >= 20) return Math.round(c); }
          }catch(e){}
          return 0;
        };

        if(sEntry){
          // map common fields
          const total = getNum(sEntry, ['totalStudents','학생수계','학생수','total','students','학생수합계']);
          const g1 = getNum(sEntry, ['grade1','1학년학생수','1학년 학생수','1학년','grade_1_students']);
          const g2 = getNum(sEntry, ['grade2','2학년학생수','2학년 학생수','2학년','grade_2_students']);
          const g3 = getNum(sEntry, ['grade3','3학년학생수','3학년 학생수','3학년','grade_3_students']);
          if(total) schoolInfo.totalStudents = schoolInfo.totalStudents || total;
          if(g1||g2||g3){
            schoolInfo.gradeStats = schoolInfo.gradeStats && schoolInfo.gradeStats.length ? schoolInfo.gradeStats : [];
            // ensure three entries
            while(schoolInfo.gradeStats.length < 3) schoolInfo.gradeStats.push({ grade: `${schoolInfo.gradeStats.length+1}학년`, classes: '', students: '' });

            if(g3) schoolInfo.gradeStats[2].students = schoolInfo.gradeStats[2].students || g3;
          }
        }
        return schoolInfo;
      }catch(e){ return schoolInfo; }
    }

    // Map various schoolLevel encodings (numbers or short tokens) to readable Korean
    function mapSchoolLevelToKorean(level){
      if(level === undefined || level === null) return '';
      const s = String(level).trim();
      if(!s) return '';
      // numeric codes commonly used: 1=초등,2=중등,3=고등
      if(/^\d+$/.test(s)){
        const n = Number(s);
        // CSV may encode levels with numeric codes where 3 typically means '중등' and 4 means '고등'.
        if(n === 1) return '초등';
        if(n === 2) return '중등';
        if(n === 3) return '중등';
        if(n === 4) return '고등';
      }
      // textual hints
      if(/초/.test(s)) return '초등';
      if(/중/.test(s)) return '중등';
      if(/고/.test(s)) return '고등';
      // fallback: return original
      return s;
    }

    function resolveStaffDisplay(raw){

      for(const key of Object.keys(STAFF_SLUG_MAP)){

    // simple CSV parser that supports quoted fields (delegates to csvUtils when available)
    function parseCSV(text){
      try{
        if(window.csvUtils && window.csvUtils.parseCsvText){
          const p = window.csvUtils.parseCsvText(text);
          const hdr = p.header || [];
          const rows = p.rows || [];
          const out = [];
          if(hdr && hdr.length) out.push(hdr.slice());
          for(const r of rows) out.push(Object.values(r));
          return out.map(r=> r.map(c=> (c||'').trim()));
        }
      }catch(e){ /* fallthrough to local parser below */ }
      const rows = [];
      let cur = '';
      let row = [];
      let inQuotes = false;
      for(let i=0;i<text.length;i++){
        const ch = text[i];
        if(ch === '"'){
          if(inQuotes && text[i+1] === '"'){ cur += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if(ch === ',' && !inQuotes){ row.push(cur); cur = ''; }
        else if((ch === '\n' || ch === '\r') && !inQuotes){
          if(ch === '\r' && text[i+1] === '\n') continue;
          row.push(cur); rows.push(row); row = []; cur = ''; }
        else { cur += ch; }
      }
      if(cur !== '' || row.length) { row.push(cur); rows.push(row); }
      return rows.map(r=> r.map(c=> (c||'').trim()));
    }

      // fallback: fetch as text and try to parse via csvUtils.parseCsvText if present
      const resp = await fetch(url);
      if(!resp.ok) throw new Error('fetch failed');
      const txt = await resp.text();
      if(window.csvUtils && window.csvUtils.parseCsvText){
        return window.csvUtils.parseCsvText(txt);
      }
      // minimal fallback: split lines into header + rows
      const lines = String(txt || '').split(/\r?\n/).filter(Boolean);
      if(!lines.length) return { header: [], rows: [] };
      const header = lines[0].split(',').map(h=>h.replace(/^\s+|\s+$/g,''));
      const rowsObj = [];
      for(let i=1;i<lines.length;i++){
        const cols = lines[i].split(',');
        const obj = {};
        for(let j=0;j<header.length;j++) obj[header[j]||('c'+j)] = (cols[j]||'').trim();
        rowsObj.push(obj);

      return { header, rows: rowsObj };

        const toNumber = (v)=>{ if(v === undefined || v === null) return 0; const s = String(v||'').replace(/[^0-9\-]/g,''); if(s==='') return 0; return Number(s) || 0; };

      try{

          return '<h3 style="font-size:16px;font-weight:800;margin:0 0 8px 0">교과서 주문 현황</h3><div style="padding:8px" class="muted">주문 데이터가 없습니다.</div>';
        }
        const years = [];
        // build years in descending order so table shows newest year first
        for(let y = endYear; y >= startYear; y--) years.push(y);
        // aggregate by group + subject
        const map = new Map();
        for(const o of orders){
          try{
            const group = String(o.group || '').trim();
            const subject = String(o.subject || '').trim();
            const key = group + '||' + subject;
            if(!map.has(key)) map.set(key, { group, subject, counts: {}, total: 0 });
            const entry = map.get(key);
            const y = Number(o.year) || 0;
            const cnt = Number(o.count) || 0;
            if(y) entry.counts[y] = (entry.counts[y] || 0) + cnt;
            entry.total = (entry.total || 0) + cnt;
          }catch(e){ /* per-row ignore */ }
        }
        let html = '<h3 style="font-size:16px;font-weight:800;margin:0 0 8px 0">교과서 주문 현황</h3><div style="overflow-x:auto"><table style="width:1000px;min-width:1000px;font-size:13px;border-collapse:collapse"><thead><tr class="bg-slate-50"><th style="padding:8px;text-align:left; width:180px">교과군</th><th style="padding:8px;text-align:left; width:320px">과목명</th>';
        years.forEach(y=> html += `<th style="padding:8px;text-align:right">${y}년</th>`);
        html += '<th style="padding:8px;text-align:right">합계</th></tr></thead><tbody>';
        for(const [k, entry] of map){
          html += `<tr><td style="padding:8px; width:180px">${escapeHtml(entry.group)}</td><td style="padding:8px;font-weight:700; width:320px">${escapeHtml(entry.subject)}</td>`;
          years.forEach(y=>{
            const v = entry.counts[y] || 0;
            html += `<td style="padding:8px;text-align:right;font-weight:700;color:#0b63d6; width:120px">${v? Number(v).toLocaleString() : ''}</td>`;
          });
          html += `<td style="padding:8px;text-align:right;font-weight:700;color:#0b63d6; width:120px">${entry.total? Number(entry.total).toLocaleString() : ''}</td></tr>`;
        }
        html += '</tbody></table></div>';
        return html;
      }catch(e){ return '<div class="muted">주문 데이터 렌더링 중 오류</div>'; }
    }
    function renderSchoolInfo(){
      try{
        const elName = document.getElementById('schoolName');
        const elMeta = document.getElementById('schoolMeta');
        const elCount = document.getElementById('studentCount');
        const elGrade = document.getElementById('gradeList');
        // Build display parts. Prefer authoritative data from `sales_staff.csv` when available.
        const pageInfo = Object.assign({}, SCHOOL_INFO || {});
        // attempt to enrich pageInfo with any available data from sales_staff or schools CSV
        try{ if(typeof enrichSchoolInfoFromSalesEntry === 'function') enrichSchoolInfoFromSalesEntry(pageInfo, pageInfo.name || SCHOOL_INFO.name || ''); }catch(e){}
        // --- Authoritative sales_staff.csv override ---
        // If salesStaffMap contains a matching entry, prefer its values for totals/gradeStats
        try{
          if(window.salesStaffMap && salesStaffMap.size){
            const probe = [];
            if(pageInfo && pageInfo.name) probe.push(pageInfo.name);
            try{ if(Array.isArray(window.RAW_DATA) && window.RAW_DATA.length && window.RAW_DATA[0] && window.RAW_DATA[0].school) probe.push(window.RAW_DATA[0].school); }catch(e){}
            let matched = null;
            for(const nm of probe){
              if(!nm) continue;
              const rawKey = String(nm||'').trim().toLowerCase();
              matched = salesStaffMap.get(rawKey) || salesStaffMap.get(normalizeSchool(nm, true)) || salesStaffMap.get(normalizeSchool(nm));
              if(matched) break;
            }
            if(matched){
              // merge authoritative fields
              pageInfo._matchedBy = 'sales_staff';
              pageInfo.region = matched.region || pageInfo.region;
              pageInfo.establishment = matched.establishment || pageInfo.establishment;
              pageInfo.schoolLevel = matched.schoolLevel || matched.level || pageInfo.schoolLevel || pageInfo.level;
              pageInfo.features = matched.features || matched.feature || pageInfo.features;
              if(matched.totalStudents !== undefined && matched.totalStudents !== null) pageInfo.totalStudents = matched.totalStudents;
              if(matched.totalClasses !== undefined && matched.totalClasses !== null) pageInfo.totalClasses = matched.totalClasses;
              if(matched.grade1 || matched.grade2 || matched.grade3 || matched.grade1_classes || matched.grade2_classes || matched.grade3_classes){
                pageInfo.gradeStats = [
                  { grade:'1학년', classes: matched.grade1_classes || matched['1학년학급수'] || '', students: matched.grade1 || matched['1학년학생수'] || '' },
                  { grade:'2학년', classes: matched.grade2_classes || matched['2학년학급수'] || '', students: matched.grade2 || matched['2학년학생수'] || '' },
                  { grade:'3학년', classes: matched.grade3_classes || matched['3학년학급수'] || '', students: matched.grade3 || matched['3학년학생수'] || '' }
                ];
              }
              if(matched.school) { pageInfo.name = matched.school; SCHOOL_INFO.name = matched.school; }
              // Ensure totals reflect per-grade sums when gradeStats are present
              try{
                if(Array.isArray(pageInfo.gradeStats) && pageInfo.gradeStats.length){
                  const sumParse = v => { try{ if(v === undefined || v === null) return 0; if(typeof v === 'number') return v; const s = String(v||'').replace(/[,\s]/g,''); const m = s.match(/-?\d+/); if(!m) return 0; return Number(m[0])||0; }catch(e){return 0;} };
                  let tc = 0, ts = 0;
                  pageInfo.gradeStats.forEach(g => { tc += sumParse(g.classes); ts += sumParse(g.students); });
                  if(tc) pageInfo.totalClasses = tc;
                  if(ts) pageInfo.totalStudents = ts;
                }
              }catch(e){ /* ignore total-sum errors */ }
            }
          }
        }catch(e){ /* ignore */ }
        // Authoritative override: prefer `sales_staff.csv` entry whenever possible.
        // If salesStaffMap contains a matching entry (by pageInfo.name or first RAW_DATA school),
        // use that entry's totals and display name as the source of truth for the top card.
        try{
          if(window.salesStaffMap && typeof window.salesStaffLoaded !== 'undefined' && window.salesStaffLoaded){
            let matched = null;
            const probeNames = [];
            if(pageInfo && pageInfo.name) probeNames.push(pageInfo.name);
            try{ if(Array.isArray(window.RAW_DATA) && window.RAW_DATA.length && window.RAW_DATA[0] && window.RAW_DATA[0].school) probeNames.push(window.RAW_DATA[0].school); }catch(e){}
            for(const nm of probeNames){
              if(!nm) continue;
              const rawKey = String(nm||'').trim().toLowerCase();
              matched = window.salesStaffMap.get(rawKey) || window.salesStaffMap.get(normalizeSchool(nm, true)) || window.salesStaffMap.get(normalizeSchool(nm));
              if(matched) break;
            }
            // If we found a matched sales staff entry, merge authoritative fields
            if(matched){
              try{
                // copy safe fields into pageInfo but do not remove existing other metadata
                pageInfo._matchedBy = 'sales_staff';
                pageInfo.region = matched.region || pageInfo.region;
                pageInfo.establishment = matched.establishment || pageInfo.establishment;
                pageInfo.schoolLevel = matched.schoolLevel || matched.level || pageInfo.schoolLevel || pageInfo.level;
                pageInfo.features = matched.features || matched.feature || pageInfo.features;
                // prefer CSV-provided totalStudents and per-grade values
                if(matched.totalStudents !== undefined && matched.totalStudents !== null) pageInfo.totalStudents = matched.totalStudents;
                if(matched.grade1 || matched.grade2 || matched.grade3 || matched.grade1_classes || matched.grade2_classes || matched.grade3_classes){
                  pageInfo.gradeStats = [
                    { grade: '1학년', classes: matched.grade1_classes || matched['1학년학급수'] || '', students: matched.grade1 || matched['1학년학생수'] || '' },
                    { grade: '2학년', classes: matched.grade2_classes || matched['2학년학급수'] || '', students: matched.grade2 || matched['2학년학생수'] || '' },
                    { grade: '3학년', classes: matched.grade3_classes || matched['3학년학급수'] || '', students: matched.grade3 || matched['3학년학생수'] || '' }
                  ];
                }
                // Use CSV school name as authoritative display name when present
                if(matched.school) { pageInfo.name = matched.school; SCHOOL_INFO.name = matched.school; }
              }catch(e){ /* ignore merge errors */ }
            }
          }
        }catch(e){ /* ignore salesStaffMap probe errors */ }
        try{
          if(salesStaffLoaded && window.salesStaffMap && pageInfo && pageInfo.name){
            try{
              const key = String(pageInfo.name||'').trim().toLowerCase();
              let m = window.salesStaffMap.get(key);
              if(!m){ try{ const p = normalizeSchool(pageInfo.name, true); if(p) m = window.salesStaffMap.get(p); }catch(e){} }
              if(!m){ try{ const n = normalizeSchool(pageInfo.name); if(n) m = window.salesStaffMap.get(n); }catch(e){} }
              if(m){
                // Prefer CSV-provided authoritative fields when present (CSV wins)
                pageInfo.region = m.region || pageInfo.region;
                pageInfo.establishment = m.establishment || pageInfo.establishment;
                // prefer CSV schoolLevel/level over page value
                pageInfo.schoolLevel = m.schoolLevel || m.level || pageInfo.schoolLevel || pageInfo.level;
                pageInfo.features = m.features || m.feature || pageInfo.features;
                pageInfo.totalStudents = (m.totalStudents !== undefined && m.totalStudents !== null) ? m.totalStudents : pageInfo.totalStudents;
                // if CSV contains explicit grade counts, override pageInfo.gradeStats
                if((m.grade1 || m.grade2 || m.grade3 || m.grade1_classes || m.grade2_classes || m.grade3_classes)){
                  pageInfo.gradeStats = [ {grade:'1학년',classes:m.grade1_classes||'',students:m.grade1||''},{grade:'2학년',classes:m.grade2_classes||'',students:m.grade2||''},{grade:'3학년',classes:m.grade3_classes||'',students:m.grade3||''} ];
                }
                // keep page staff if present; otherwise use CSV staff
                pageInfo.staff = pageInfo.staff || m.staff || pageInfo.staff;
              }
            }catch(e){}
          }
        }catch(e){}

        const staff = (pageInfo && (pageInfo.staff || pageInfo.manager || pageInfo['담당자'] || '')) || '';
        const schoolName = pageInfo.name || '';
        const region = formatRegion(pageInfo.region || pageInfo.regionName || '');
        const establishment = pageInfo.establishment || pageInfo.type || '';
        const schoolLevel = pageInfo.schoolLevel || pageInfo.level || '';
        const levelDisplay = mapSchoolLevelToKorean(schoolLevel || '');
        const features = pageInfo.features || pageInfo.feature || pageInfo['학교특성'] || '';

        // compute per-grade class/student counts -- prefer pageInfo (CSV-enriched), fall back to SCHOOL_INFO
        let g1c = ''; let g2c = ''; let g3c = '';
        let g1s = ''; let g2s = ''; let g3s = '';
        const preferredStats = (Array.isArray(pageInfo.gradeStats) && pageInfo.gradeStats.length) ? pageInfo.gradeStats : ((Array.isArray(SCHOOL_INFO.gradeStats) && SCHOOL_INFO.gradeStats.length) ? SCHOOL_INFO.gradeStats : null);
        if(preferredStats){
          const s = preferredStats;
          if(s[0]){ g1c = s[0].classes || s[0].class || s[0].학급 || ''; g1s = s[0].students || s[0].students || s[0].학생수 || ''; }
          if(s[1]){ g2c = s[1].classes || s[1].class || s[1].학급 || ''; g2s = s[1].students || s[1].students || s[1].학생수 || ''; }
          if(s[2]){ g3c = s[2].classes || s[2].class || s[2].학급 || ''; g3s = s[2].students || s[2].students || s[2].학생수 || ''; }
        } else {
          // fallback to explicit per-grade fields from pageInfo, then SCHOOL_INFO
          g1c = pageInfo.grade1_classes || pageInfo['1학년학급수'] || pageInfo.grade1class || SCHOOL_INFO.grade1_classes || SCHOOL_INFO['1학년학급수'] || SCHOOL_INFO.grade1class || '';
          g2c = pageInfo.grade2_classes || pageInfo['2학년학급수'] || pageInfo.grade2class || SCHOOL_INFO.grade2_classes || SCHOOL_INFO['2학년학급수'] || SCHOOL_INFO.grade2class || '';
          g3c = pageInfo.grade3_classes || pageInfo['3학년학급수'] || pageInfo.grade3class || SCHOOL_INFO.grade3_classes || SCHOOL_INFO['3학년학급수'] || SCHOOL_INFO.grade3class || '';
          g1s = pageInfo.grade1 || pageInfo['1학년학생수'] || pageInfo.grade1_students || SCHOOL_INFO.grade1 || SCHOOL_INFO['1학년학생수'] || SCHOOL_INFO.grade1_students || '';
          g2s = pageInfo.grade2 || pageInfo['2학년학생수'] || pageInfo.grade2_students || SCHOOL_INFO.grade2 || SCHOOL_INFO['2학년학생수'] || SCHOOL_INFO.grade2_students || '';
          g3s = pageInfo.grade3 || pageInfo['3학년학생수'] || pageInfo.grade3_students || SCHOOL_INFO.grade3 || SCHOOL_INFO['3학년학생수'] || SCHOOL_INFO.grade3_students || '';
        }

        // robust numeric parsing helper: extract first reasonable integer from a string
        const parseIntSafe = (v) => { try{ if(v === undefined || v === null) return 0; const s = String(v||'').replace(/[,\s]/g,''); const m = s.match(/-?\d+/); if(!m) return 0; const n = Number(m[0]); return Number.isFinite(n) ? n : 0; }catch(e){ return 0; } };
        const g1c_n = parseIntSafe(g1c); const g2c_n = parseIntSafe(g2c); const g3c_n = parseIntSafe(g3c);
        const g1s_n = parseIntSafe(g1s); const g2s_n = parseIntSafe(g2s); const g3s_n = parseIntSafe(g3s);
        // compute totals from available per-grade stats first, then fall back to pageInfo / SCHOOL_INFO
        let totalClasses = (g1c_n + g2c_n + g3c_n);
        if(!totalClasses){ totalClasses = parseIntSafe(pageInfo.totalClasses) || parseIntSafe(SCHOOL_INFO.totalClasses) || 0; }
        let totalStudents = (g1s_n + g2s_n + g3s_n);
        if(!totalStudents){ totalStudents = parseIntSafe(pageInfo.totalStudents) || parseIntSafe(SCHOOL_INFO.totalStudents) || 0; }

        // Fill DOM elements in requested format
        if(elName){
          elName.innerHTML = `<div style="font-weight:700">${escapeHtml(String(staff || ''))}</div><div style="font-size:18px;font-weight:800">${escapeHtml(String(schoolName||''))}</div>`;
        }
        if(elMeta){
          const parts = [];
          if(establishment) parts.push(establishment);
          if(levelDisplay) parts.push(levelDisplay);
          if(features) parts.push(features);
          elMeta.textContent = parts.join(' · ');
        }
        if(elCount){
          const displayTotalClasses = totalClasses || 0;
          const displayTotalStudents = totalStudents || 0;
          // always show a placeholder dash when missing rather than an empty string
          const classesLabel = displayTotalClasses ? `${displayTotalClasses}학급` : '-';
          const studentsLabel = displayTotalStudents ? `${Number(displayTotalStudents).toLocaleString()}명` : '-';
          elCount.textContent = `학급수계: ${classesLabel} · 학생수계: ${studentsLabel}`;
        }
        if(elGrade){
          // display region as a separate small line and then the grade summary single-line
          elGrade.innerHTML = '';
          if(region){ const rdiv = document.createElement('div'); rdiv.className = 'muted'; rdiv.style.marginBottom = '6px'; rdiv.textContent = region; elGrade.appendChild(rdiv); }
          const gradesLine = document.createElement('div');
          const p1 = `1학년: ${g1c_n? g1c_n+'학급' : '-'}${'/'}` + `${g1s_n? Number(g1s_n).toLocaleString()+'명' : '-'}`;
          const p2 = `2학년: ${g2c_n? g2c_n+'학급' : '-'}${'/'}` + `${g2s_n? Number(g2s_n).toLocaleString()+'명' : '-'}`;
          const p3 = `3학년: ${g3c_n? g3c_n+'학급' : '-'}${'/'}` + `${g3s_n? Number(g3s_n).toLocaleString()+'명' : '-'}`;
          // Display per-grade summary and append overall totals (전체)
          try{
            const overallClassesLabel = totalClasses ? `${totalClasses}학급` : '-';
            const overallStudentsLabel = totalStudents ? `${Number(totalStudents).toLocaleString()}명` : '-';
            const overall = `<strong>${escapeHtml('전체: ' + overallClassesLabel + '/' + overallStudentsLabel)}</strong>`;
            gradesLine.innerHTML = `${escapeHtml(p1)} ${escapeHtml(p2)} ${escapeHtml(p3)} ${overall}`;
          }catch(e){
            gradesLine.textContent = `${p1} ${p2} ${p3}`;
          }
          elGrade.appendChild(gradesLine);
        }
      }catch(e){ console.warn('renderSchoolInfo failed', e); }
    }

    function renderOrders(){
      try{
        const tbody = document.getElementById('ordersBody');
        if(!tbody) return;
        // replace the whole wrapper containing the table with aggregated table HTML
        const tableEl = tbody.parentElement;
        const wrapper = tableEl && tableEl.parentElement ? tableEl.parentElement : tableEl;
        try{
          const aggHtml = buildAggregatedOrdersHtml(TEXTBOOK_ORDERS, 2021, 2026);
          if(wrapper) wrapper.innerHTML = aggHtml;
        }catch(e){
          // fallback: render simple rows into tbody
          tbody.innerHTML = '';
          if(!Array.isArray(TEXTBOOK_ORDERS) || !TEXTBOOK_ORDERS.length){ const tr = document.createElement('tr'); tr.innerHTML = `<td colspan="4" style="padding:12px" class="muted">주문 데이터가 없습니다.</td>`; tbody.appendChild(tr); return; }
          TEXTBOOK_ORDERS.forEach(o=>{ const tr = document.createElement('tr'); tr.innerHTML = `<td class="px-4 py-3">${o.year || ''}</td><td class="px-4 py-3">${o.group || ''}</td><td class="px-4 py-3">${o.subject || ''}</td><td class="px-4 py-3" style="text-align:right">${o.count? Number(o.count).toLocaleString() : ''}</td>`; tbody.appendChild(tr); });
        }
      }catch(e){ console.warn('renderOrders failed', e); }
    }
    (async function initData(){
      // ensure sales staff CSV is loaded before other CSV-dependent rendering
      try{ await loadSalesStaffCsv(); }catch(e){ console.warn('loadSalesStaffCsv (await) failed', e); }
      await tryLoadCSVs();
      // after orders/schools CSVs loaded, attempt to enrich any merged-order entries
      try{ if(typeof enrichSalesStaffFromSchools === 'function') await enrichSalesStaffFromSchools(); }catch(e){ console.warn('enrichSalesStaffFromSchools failed', e); }
      // try backend school metadata first (merge into SCHOOLS_CSV_MAP)
      try{ await tryLoadSchoolMetadataFromFirestore(); }catch(e){}
      await tryLoadFirestoreVisits();
      // If the page did not provide `SCHOOL_INFO.name`, try to derive a sensible
      // default from the first loaded visit row so the top card isn't empty.
      // This only provides a visible fallback for single-school pages; CSV/Firestore
      // metadata (sales_staff.csv / schools.csv) remain authoritative when present.
      try{
        if((!SCHOOL_INFO || !SCHOOL_INFO.name || String(SCHOOL_INFO.name).trim() === '') && Array.isArray(RAW_DATA) && RAW_DATA.length){
          const first = RAW_DATA[0];
          const candidate = first && (first.school || first.schoolName || first.School) ? (first.school || first.schoolName || first.School) : '';
          if(candidate) {
            SCHOOL_INFO.name = String(candidate).trim();
            console.info('[initData] SCHOOL_INFO.name auto-filled from RAW_DATA:', SCHOOL_INFO.name);
          }
        }
      }catch(e){ /* ignore fallback failure */ }

      // Expose convenient debug handles so console checks are straightforward
      // (these are read-only helpers for debugging and won't change runtime logic).
      try{ window._TEXTBOOK_ORDERS = (typeof TEXTBOOK_ORDERS !== 'undefined') ? TEXTBOOK_ORDERS : null; }catch(e){}
      try{ window.salesStaffLoaded = (typeof salesStaffLoaded !== 'undefined') ? salesStaffLoaded : (window.salesStaffLoaded || false); }catch(e){}
      try{ window.salesStaffMap = window.salesStaffMap || (typeof salesStaffMap !== 'undefined' ? salesStaffMap : window.salesStaffMap); }catch(e){}

      renderSchoolInfo();
      renderOrders();
      // show simple diagnostics about backend loads
      try{
        const ds = document.getElementById('dataStatus');
        let msg = '';
        if(window.__db){ msg += 'Firestore: available. '; } else { msg += 'Firestore: not initialized. '; }
        msg += `Visits rows: ${RAW_DATA.length || 0}. `;
        // orders CSV diagnostics
        try{
          const oDiag = window.__ordersCsvDiagnostic || {};
          if(oDiag && oDiag.used){ msg += ` orders: loaded from ${oDiag.used} (${oDiag.parsedRowsCount} rows).`; }
          else if(oDiag && Array.isArray(oDiag.attempted) && oDiag.attempted.length){ msg += ` orders: not found (attempted ${oDiag.attempted.length} paths).`; }
          else { msg += ' orders: unknown.'; }
          msg += ` TEXTBOOK_ORDERS: ${TEXTBOOK_ORDERS.length || 0}`;
        }catch(e){ /* ignore */ }
        if(ds) ds.textContent = msg;
        console.info('schoolreport initData:', msg, { db: !!window.__db, rawCount: RAW_DATA.length, salesLoaded: salesStaffLoaded });
      }catch(e){ console.warn(e); }
      // refresh staff list (may have changed with new data)
      populateStaffs();
      currentVisible = renderVisits({ search: searchInput ? searchInput.value : '', staff: staffSelect ? staffSelect.value : '', startDate: startDateInput ? startDateInput.value : '', endDate: endDateInput ? endDateInput.value : '' });
      renderSchoolSummary();
      updateMetrics();
      // expose a deployment timestamp for quick verification in console
      try{ window.__SCHOOLREPORT_DEPLOY = new Date().toISOString(); console.info('[schoolreport] deploy timestamp', window.__SCHOOLREPORT_DEPLOY); }catch(e){}
      // hide loading overlay after initial data and rendering complete
      try{ const lo = document.getElementById('loadingOverlay'); if(lo) lo.style.display = 'none'; }catch(e){}
    })();
  </script>
