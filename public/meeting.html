                  others.forEach(b=>{ if (b !== btn){ b.classList.remove('active'); b.setAttribute('aria-pressed','false'); } });
                  if (btn.classList.contains('active')){ btn.classList.remove('active'); btn.setAttribute('aria-pressed','false'); }
                  else { btn.classList.add('active'); btn.setAttribute('aria-pressed','true'); }
                }catch(e){}
              }, true);
            }
          }catch(e){}
        }catch(e){}
      }, { once:true });
    })();
  </script>
  <script>
    // Ensure computeEndTime is available as window.computeEndTime for external callers.
    // Some internal code exposes it as window._cmass_computeEndTime; normalize here.
    (function(){
      try{
        if (typeof window.computeEndTime !== 'function'){
          if (typeof window._cmass_computeEndTime === 'function'){ window.computeEndTime = window._cmass_computeEndTime; }
          else if (typeof computeEndTime === 'function'){ window.computeEndTime = computeEndTime; }
        }
        // Defensive: if gatherForm/saveReport were attached earlier they should already exist, but log status for diagnostics
        try{ console.debug('[meeting] global-expose', { computeEndTime: typeof window.computeEndTime, gatherForm: typeof window.gatherForm, saveReport: typeof window.saveReport }); }catch(e){}
      }catch(e){ try{ console.warn('[meeting] global-expose error', e); }catch(_){} }
    })();
  </script>
  <script>
    // Display selected school name in the header and append (s-code) if available.
    // Avoid double-showing codes when option text already contains a parenthetical code.
    (function(){
      function getScode(){ try{ return window._cmass_currentScode || (window.sessionStorage && sessionStorage.getItem('cmass:next_scode')) || ''; }catch(e){ return ''; } }
      function getSelectedOption(){ try{ const s = document.getElementById('schoolSelect'); if (!s) return null; return (s.options && s.selectedIndex >= 0) ? s.options[s.selectedIndex] : null; }catch(e){ return null; } }
      function getSchoolName(){
        try{
          const opt = getSelectedOption();
          if (opt) return (opt.text || opt.value) || '';
          if (window.selectedSchool) return window.selectedSchool;
          const s = document.getElementById('schoolSelect');
          return s ? (s.value || '') : '';
        }catch(e){ return ''; }
      }

      function stripTrailingParen(text){ try{ return (text||'').replace(/\s*\([^\)]*\)\s*$/,'').trim(); }catch(e){ return text || ''; } }

      function updateHeader(){
        try{
          const el = document.getElementById('schoolDisplay'); if (!el) return;
          const opt = getSelectedOption();
          let name = '';
          let code = '';

          if (opt) {
            // prefer explicit dataset.scode on the option (this corresponds to the option the user actually selected)
            code = (opt.dataset && opt.dataset.scode) ? opt.dataset.scode : getScode();
            // display the option text but remove any trailing parenthetical code to avoid duplication
            name = stripTrailingParen(opt.text || opt.value || '');
          } else {
            name = stripTrailingParen(getSchoolName());
            code = getScode();
          }

          if (name && code) el.textContent = name + ' (' + code + ')';
          else if (name) el.textContent = name;
          else el.textContent = '';
        }catch(e){}
      }

      document.addEventListener('DOMContentLoaded', function(){
        try{
          const sel = document.getElementById('schoolSelect');
          if (sel){ sel.addEventListener('change', updateHeader, false); sel.addEventListener('input', updateHeader, false); }
          // Listen for scode updates dispatched by selection or CSV meta loaders and update the header.
          window.addEventListener('cmass:scode-updated', function(ev){ try{ updateHeader(); }catch(e){} }, false);
          // initial sync after other initializers run
          setTimeout(updateHeader, 120);
        }catch(e){}
      }, { once:true });
    })();
  </script>
