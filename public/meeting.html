<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meeting - 영업일지</title>
  <link rel="manifest" href="/manifest.json">
  <script src="js/silence-console.js"></script>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif;margin:18px;color:#072042}
    header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    /* place the Back button at the far right */
    #btnBack{margin-left:auto}
    .topline{font-weight:800}
    label{display:block;margin-top:10px;font-weight:700}
    input,select,textarea,button{font-size:14px;padding:8px;border:1px solid #d6dbe8;border-radius:8px}
    .row{display:flex;gap:8px;align-items:center}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
    .subject-btn{padding:8px 12px;border-radius:10px;border:1px solid #d6dbe8;background:#fff;cursor:pointer}
    /* Unified active style for subject/activity/favor buttons */
    .subject-btn.active, .favor-btn.active, .dur-btn.active{background:linear-gradient(135deg,#1b63b8,#2e95e6);color:#fff;border-color:#174b8f}
    /* Sky-blue variant for certain activity buttons */
    .subject-btn.subject-sky{ background: linear-gradient(180deg, #e9f6ff, #f3fbff); border-color: #bfe6ff; color: #073c57 }
    .subject-btn.subject-sky:hover{ background: linear-gradient(180deg, #d7f0ff, #ecfbff); }
    .subject-btn.subject-sky.active{ background: linear-gradient(135deg,#56b6f2,#2e95e6); color: #fff; border-color:#2e95e6 }
    /* Red variant for negative statuses */
    .subject-btn.subject-danger{ background: linear-gradient(180deg, #fff2f2, #fff7f7); border-color: #f5c6c6; color: #6a1a1a }
    .subject-btn.subject-danger:hover{ background: linear-gradient(180deg, #ffe6e6, #fff3f3); }
    .subject-btn.subject-danger.active{ background: linear-gradient(135deg,#e05252,#c62828); color:#fff; border-color:#a21f1f }
    .dur-btn{padding:6px 10px;border-radius:8px;border:1px solid #d6dbe8;background:#fff;cursor:pointer;font-weight:700}
    .dur-btn.active{background:#1e3c72;color:#fff;border-color:#123}
    /* favor buttons (우호도) - match subject button visuals */
    .favor-btn{padding:8px 12px;border-radius:10px;border:1px solid #d6dbe8;background:#fff;cursor:pointer}
    /* Fixed color variants for specific subject buttons (explicit assignments) */
    .subject-btn.subject-lib{ background: linear-gradient(180deg,#fff9f1,#fff3e6); border-color:#ffd9b3; color:#5a2b00 }
    .subject-btn.subject-lib:hover{ background: linear-gradient(180deg,#fff2e0,#fff0d4); }
    .subject-btn.subject-lib.active{ background: linear-gradient(135deg,#ffb366,#ff8a33); color:#fff; border-color:#cc6b2a }

    .subject-btn.subject-grade{ background: linear-gradient(180deg,#f2f9ff,#e8f6ff); border-color:#cfeefe; color:#073c57 }
    .subject-btn.subject-grade:hover{ background: linear-gradient(180deg,#e6f4ff,#dff2ff); }
    .subject-btn.subject-grade.active{ background: linear-gradient(135deg,#5cc1ff,#2e95e6); color:#fff; border-color:#2e95e6 }

    .subject-btn.subject-special{ background: linear-gradient(180deg,#f7fff4,#e9ffe8); border-color:#cdf3ce; color:#0b4d19 }
    .subject-btn.subject-special:hover{ background: linear-gradient(180deg,#e9ffeb,#e0ffe2); }
    .subject-btn.subject-special.active{ background: linear-gradient(135deg,#7be08a,#3ec058); color:#fff; border-color:#2fa044 }

    .subject-btn.subject-other{ background: linear-gradient(180deg,#f6f5ff,#efeaff); border-color:#ddd5ff; color:#2e1a66 }
    .subject-btn.subject-other:hover{ background: linear-gradient(180deg,#efeaff,#e6e0ff); }
    .subject-btn.subject-other.active{ background: linear-gradient(135deg,#a88cff,#7a59ff); color:#fff; border-color:#6940e6 }
    /* Purple variant for 자료전달 activity button */
    .subject-btn.subject-purple{ background: linear-gradient(180deg,#f6efff,#efe6ff); border-color:#d6c0ff; color:#3a1a66 }
    .subject-btn.subject-purple:hover{ background: linear-gradient(180deg,#eadcff,#dfc9ff); }
    .subject-btn.subject-purple.active{ background: linear-gradient(135deg,#8e5cff,#5b2eff); color:#fff; border-color:#3f1f9a }
   /* Ensure button grids and time selectors sit above transient overlays and accept pointer events.
     Bump z-index and explicitly enable pointer-events for duration buttons and selects so they
     remain interactive even if a transient element overlays the page. If another element still
     covers them, use the inspector to find that element (it will have a higher z-index). */
   .btn-row, #subjects, #activities, .entry-subjects, .entry-activities, #durationBtns, #schoolVisitsTableContainer { position: relative; z-index: 9999; pointer-events: auto; }
   .subject-btn, .entry-subject-btn, .entry-activity-btn, .dur-btn, .favor-btn { pointer-events: auto; position: relative; z-index: 10000; }
   /* Make select inputs for time appear above overlays too */
   #startHour, #startMinute, #duration, #endTime { position: relative; z-index: 10001; pointer-events: auto; }
    .actions{display:flex;gap:8px;margin-top:14px}
    .muted{color:#556}
  .invalid{outline:2px solid #f2c6c6 !important; box-shadow:0 0 0 3px rgba(242,198,198,0.25);}
    .small{font-size:13px}
    .form-section{margin-bottom:12px;padding:10px;border:1px solid #eef6fb;border-radius:8px;background:#fbfeff}
    .section-title{margin:0 0 8px 0;font-size:15px;font-weight:800;color:#123}
  /* make the 기본정보 section constrained to 520px for better layout */
  #basicInfo{max-width:520px;width:100%;box-sizing:border-box}
  /* Center all form sections and constrain width to match design */
  .form-section{ max-width:520px; margin:0 auto 12px; box-sizing:border-box }
  /* Make inputs/selects/textarea inside sections use full width for clean layout */
  .form-section input, .form-section select, .form-section textarea { width:100%; box-sizing:border-box }
  /* Keep small time selectors compact */
  .form-section #startHour, .form-section #startMinute, .form-section #duration, .form-section #endTime { width:auto; max-width:140px }
  /* start/end time layout helpers */
  .start-time-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .start-time-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .start-time-group select {
    width: 80px;
    min-width: 48px;
    max-width: 120px;
    display: inline-block;
  }
  .end-time-wrap{margin-left:8px;min-width:120px;flex:1;display:flex;flex-direction:column}
  .end-time-wrap input{width:100%}
  /* Stack action buttons and make them full-width like screenshot */
  .actions{ display:block; max-width:520px; margin:12px auto }
  .actions button{ width:100%; display:block; margin-top:8px; padding:10px; border-radius:8px }
  .btn-row{ gap:8px; }
    @media (max-width:530px){
      body{margin:12px;font-size:14px}
      header{gap:8px}
      #schoolDisplay{font-size:15px}
      .topline{font-weight:800;font-size:14px}
      input, select, textarea, button{font-size:13px;padding:6px;border-radius:8px}
      input, select, textarea{min-width:0}
      .row{flex-direction:column;align-items:flex-start;gap:8px}

      /* Make form sections take full available width on narrow screens */
      .form-section, #basicInfo { max-width:520px; width:100%; padding-left:10px; padding-right:10px; box-sizing:border-box }

      /* Let inputs and selects expand to the container width on small screens.
         Use !important to override inline width attributes where necessary. */
      .form-section input, .form-section select, .form-section textarea { width:100% !important; box-sizing:border-box }

  /* Keep time selectors compact but responsive */
  .form-section #startHour, .form-section #startMinute, .form-section #duration, .form-section #endTime { width:auto; max-width:140px }

  /* small-screen: stack start time controls and make them expand */
  .start-time-group{display:flex;gap:6px;flex-wrap:wrap}
  .start-time-group select{width:48% !important;min-width:0}
  .end-time-wrap{margin-left:0;min-width:0;width:100%}
  .end-time-wrap input{width:100%}

      /* Preserve the explicit design decision: visitDate remains visually compact. */
      #visitDate { width:50% !important }

      /* Ensure the two columns in 기본정보 stack cleanly and occupy full width */
      #basicInfo .row > div { width:100% !important; flex:unset }

      /* Keep button grids wrapping nicely */
      .btn-row{ display:flex; flex-wrap:wrap; gap:8px }

      /* Actions remain full-width stacked buttons */
      .actions{ display:block; max-width:520px; margin:12px auto }
      .actions button{ width:100%; display:block; margin-top:8px; padding:10px; border-radius:8px }
    }
  </style>
  <style>
    /* s-code mapping status badge */
    .scode-badge { display:inline-block; margin-left:8px; padding:4px 8px; border-radius:999px; font-weight:800; font-size:12px; vertical-align:middle }
    .scode-success { background:#e6fff3; color:#006644; border:1px solid #a6e6c9 }
    .scode-ambiguous { background:#fff7e6; color:#7a5200; border:1px solid #f0d7a8 }
    .scode-unmatched { background:#fff0f0; color:#8a1f1f; border:1px solid #f1c6c6 }
  </style>
  <script>
    // Fixed-color classes are applied via CSS above for specific buttons.
    // The previous dynamic random-color JS has been removed to provide
    // deterministic, accessible styling for the four designated buttons.
    // Gather form helpers and save/report wiring
      document.addEventListener('DOMContentLoaded', () => {
    // input.html에서 선택한 지역/학교를 sessionStorage에서 읽어 select에 반영
    try {
      const nextRegion = sessionStorage.getItem('cmass:next_region');
      const nextSchoolDisplay = sessionStorage.getItem('cmass:next_school_display') || '';
      const nextSchoolCode = sessionStorage.getItem('cmass:next_school_scode') || '';
      const nextSchool = nextSchoolDisplay || sessionStorage.getItem('cmass:next_school');
      if (nextRegion) {
        const regionSelect = document.getElementById('regionSelect');
        if (regionSelect) regionSelect.value = nextRegion;
      }
      if (nextSchool) {
        const schoolSelect = document.getElementById('schoolSelect');
        if (schoolSelect){
          const opt = Array.from(schoolSelect.options).find(o => (o.value === nextSchool) || ((o.text||'') === nextSchool) || ((o.dataset && o.dataset.scode) === nextSchoolCode));
          if (opt) schoolSelect.value = opt.value; else schoolSelect.value = nextSchool;
        }
      }
    } catch(e) {}
    // 방문일 기준 입력리스트(historyList) 표시 함수
    function renderHistoryList() {
      try {
        const visitDate = (document.getElementById('visitDate') && document.getElementById('visitDate').value) || '';
        const school = (document.getElementById('schoolSelect') && document.getElementById('schoolSelect').value) || '';
        const arr = JSON.parse(localStorage.getItem('cmass_reports') || '[]') || [];
        let filtered = arr.filter(it => String(it.visitDate || '') === String(visitDate));
        const container = document.getElementById('historyList');
        if (school) {
          filtered = filtered.filter(it => String(it.school || '') === String(school));
        }
        // update scode badge (in-scope so it can reference scodeEl)
        function updateScodeBadge(){
          try{
            const b = document.getElementById('scodeBadge');
            if (!b) return;
            const scode = (window._cmass_currentScode || (window.sessionStorage && sessionStorage.getItem('cmass:next_scode')) || '');
            const ambiguous = !!(window._cmass_lastMappingCandidates && Array.isArray(window._cmass_lastMappingCandidates) && window._cmass_lastMappingCandidates.length > 1) || !!window._cmass_lastMappingAmbiguous;
            b.classList.remove('scode-success','scode-ambiguous','scode-unmatched');
            if (scode){
              if (ambiguous){ b.classList.add('scode-ambiguous'); b.textContent = '모호'; b.title = '여러 후보가 있어 모호합니다'; }
              else { b.classList.add('scode-success'); b.textContent = '성공'; b.title = 's-code 매핑 성공'; }
            } else { b.classList.add('scode-unmatched'); b.textContent = '미일치'; b.title = 's-code를 찾지 못했습니다'; }

            try{
              if (sessionStorage){
                // persist canonical code and also keep display in sync
                sessionStorage.setItem('cmass:next_scode', scode);
                sessionStorage.setItem('cmass:next_school_scode', scode);
                // also persist the visible label for convenience
                try{
                  const opt = (schoolEl && schoolEl.options && schoolEl.selectedIndex >= 0) ? schoolEl.options[schoolEl.selectedIndex] : null;
                  const disp = opt ? (opt.text || schoolName) : schoolName;
                  if (disp) sessionStorage.setItem('cmass:next_school_display', String(disp));
                  if (opt && opt.value) sessionStorage.setItem('cmass:next_school', String(opt.value));
                  try{ window.selectedSchool = disp; }catch(e){}
                }catch(e){}
              }
            }catch(e){}

            window._cmass_currentScode = scode;
            if (typeof scodeEl !== 'undefined' && scodeEl) scodeEl.textContent = '학교코드: ' + scode;
            try{ window.dispatchEvent(new CustomEvent('cmass:scode-updated', { detail: { scode: scode } })); }catch(e){}
          }catch(e){}
        }
        container.innerHTML = '';
        if (!filtered.length) {
          container.innerHTML = '<div style="color:#888;font-size:13px;">해당 조건에 맞는 입력이 없습니다.</div>';
              try{
                if (sessionStorage){ sessionStorage.removeItem('cmass:next_school_scode'); sessionStorage.removeItem('cmass:next_scode'); }
              }catch(e){}
              try{ window.dispatchEvent(new CustomEvent('cmass:scode-updated', { detail: { scode: '' } })); }catch(e){}
        }
        filtered.forEach(entry => {
          const subjects = Array.isArray(entry.subject) ? entry.subject.join(', ') : (Array.isArray(entry.subjects) ? entry.subjects.join(', ') : (entry.subject || entry.subjects || ''));
          const teacher = entry.teacherName || '';
          const favor = entry.favor || '';

          // 방문시간 표시: 가능한 정보(startHour/startMinute, endTime, duration)를 조합해서 표시
          try{
            const pad = v => (String(v||'').length === 1 ? ('0' + String(v||'')) : String(v||''));
            const sh = entry.startHour || '';
            const sm = entry.startMinute || '';
            const end = entry.endTime || '';
            const dur = entry.duration || '';
            let timeStr = '';
            if (sh || sm){
              const s = (sh || sm) ? (pad(sh) + ':' + pad(sm)) : '';
              if (end){ timeStr = s + ' - ' + String(end); }
              else if (dur){ timeStr = s + ' · ' + String(dur) + '분'; }
              else { timeStr = s; }
            } else if (dur){
              timeStr = String(dur) + '분';
            } else if (end){
              timeStr = String(end);
            }

            const lineParts = [subjects, teacher, favor].filter(Boolean);
            if (timeStr) lineParts.push('방문시간: ' + timeStr);
            const line = lineParts.join(' - ');

            const div = document.createElement('div');
            div.textContent = line;
            div.style.padding = '6px 10px';
            div.style.background = '#f7f8ff';
            div.style.borderRadius = '6px';
            div.style.fontSize = '14px';
            container.appendChild(div);
          }catch(e){
            // fallback to previous simple line if any error
            const line = `${subjects} - ${teacher} - ${favor}`;
            const div = document.createElement('div');
            div.textContent = line;
            div.style.padding = '6px 10px';
            div.style.background = '#f7f8ff';
            div.style.borderRadius = '6px';
            div.style.fontSize = '14px';
            container.appendChild(div);
          }
        });
      } catch(e) { /* tolerate */ }
    }

        function qs(id){ return document.getElementById(id); }
        function collectActiveText(containerSelector, btnClass){
          try{ const container = document.querySelector(containerSelector); if(!container) return []; return Array.from(container.querySelectorAll('button.'+btnClass+'.active')).map(b=>b.textContent.trim()); }catch(e){ return []; }
        }
        function getSingleActive(containerSelector, btnClass){
          try{ const container = document.querySelector(containerSelector); if(!container) return ''; const b = container.querySelector('button.'+btnClass+'.active'); return b ? b.textContent.trim() : ''; }catch(e){ return ''; }
        }

        function gatherForm(){
          try{
            const obj = {};
            obj._savedAt = (new Date()).toISOString();
            obj.staff = (qs('staff') && qs('staff').value) || '';
            obj.staffLabel = (qs('staff') && qs('staff').options && qs('staff').selectedIndex>=0) ? qs('staff').options[qs('staff').selectedIndex].text : '';
            obj.visitDate = (qs('visitDate') && qs('visitDate').value) || '';
            obj.region = (qs('regionSelect') && qs('regionSelect').value) || '';
            try{ const selVal = (qs('schoolSelect') && qs('schoolSelect').value) || ''; obj.school = selVal || (window.selectedSchool || ''); }catch(e){ obj.school = (qs('schoolSelect') && qs('schoolSelect').value) || (window.selectedSchool || ''); }
            obj.startHour = (qs('startHour') && qs('startHour').value) || '';
            obj.startMinute = (qs('startMinute') && qs('startMinute').value) || '';
            obj.duration = (qs('duration') && qs('duration').value) || '';
            obj.endTime = (qs('endTime') && qs('endTime').value) || '';
            obj.subjects = collectActiveText('#subjects','subject-btn');
            // Also store canonical single-key 'subject' (array-normalized) for unified schema
            try{ obj.subject = Array.isArray(obj.subjects) ? obj.subjects.slice() : (obj.subjects ? [obj.subjects] : []); }catch(e){ obj.subject = (obj.subjects || []); }
            obj.activities = collectActiveText('#activities','subject-btn');
            obj.materials = collectActiveText('#materials','subject-btn');
            obj.favor = getSingleActive('#favorBtns','favor-btn');
            obj.teacherName = (qs('teacherName') && qs('teacherName').value) || '';
            obj.publisher = (qs('publisher') && qs('publisher').value) || '';
            obj.phone = (qs('phone') && qs('phone').value) || '';
            obj.email = (qs('email') && qs('email').value) || '';
            try{ obj.meta = (window.schoolMetaMap && window.schoolMetaMap[obj.school]) ? window.schoolMetaMap[obj.school] : ''; }catch(e){ obj.meta = ''; }
            // Attach resolved s-code sourced from sessionStorage or previous mapping
            try{ obj.scode = (sessionStorage && sessionStorage.getItem('cmass:next_scode')) || window._cmass_currentScode || ''; }catch(e){ obj.scode = window._cmass_currentScode || ''; }
            // Also store canonical key form used elsewhere ('s-code') so report rendering can read it directly
            try{ obj['s-code'] = obj.scode || (sessionStorage && sessionStorage.getItem('cmass:next_school_scode')) || ''; }catch(e){ obj['s-code'] = obj.scode || ''; }
            // Unified field names: request, conversation, issue, delivery, gift, followup
            // Legacy fields (requests/deliveries/gifts/followUp) are consolidated into 'issue'
            obj.request = (qs('requests') && qs('requests').value) || '';
            obj.delivery = (qs('deliveries') && qs('deliveries').value) || '';
            obj.gift = (qs('gifts') && qs('gifts').value) || '';
            obj.followup = (qs('followUp') && qs('followUp').value) || '';
            obj.conversation = (qs('conversation') && qs('conversation').value) || '';
            obj.issue = (qs('issue') && qs('issue').value) || '';

            try{
              const parts = [];
              if (obj.request) parts.push('요청사항: ' + obj.request);
              if (obj.delivery) parts.push('납품사항: ' + obj.delivery);
              if (obj.gift) parts.push('증정사항: ' + obj.gift);
              if (obj.followup) parts.push('후속조치: ' + obj.followup);
              if (parts.length){
                obj.issue = (obj.issue ? (String(obj.issue).trim() + ' | ') : '') + parts.join(' | ');
              }
              // clear legacy keys so backend receives consolidated data primarily via 'issue'
              obj.request = '';
              obj.delivery = '';
              obj.gift = '';
              obj.followup = '';
            }catch(e){}
            return obj;
          }catch(e){ return null; }
        }

        function validateForm(){
          try{
            const errors = [];
            const qsEl = id => (document.getElementById(id) || null);
            const staff = qsEl('staff') && qsEl('staff').value;
            const visitDate = qsEl('visitDate') && qsEl('visitDate').value;
            const region = qsEl('regionSelect') && qsEl('regionSelect').value;
            const school = qsEl('schoolSelect') && qsEl('schoolSelect').value;
            const startHour = qsEl('startHour') && qsEl('startHour').value;
            const startMinute = qsEl('startMinute') && qsEl('startMinute').value;
            const duration = qsEl('duration') && qsEl('duration').value;
            const subjects = collectActiveText('#subjects','subject-btn');
            const teacher = (qsEl('teacherName') && qsEl('teacherName').value) || '';

            // reset previous invalid styles
            ['staff','visitDate','regionSelect','schoolSelect','startHour','startMinute','duration','teacherName'].forEach(id=>{ try{ const el = document.getElementById(id); if (el) el.classList.remove('invalid'); }catch(e){} });

            if (!staff) errors.push({ field: 'staff', msg: '담당자를 선택해 주세요.' });
            if (!visitDate) errors.push({ field: 'visitDate', msg: '방문일을 선택해 주세요.' });
            if (!region) errors.push({ field: 'regionSelect', msg: '지역을 선택해 주세요.' });
            if (!school) errors.push({ field: 'schoolSelect', msg: '학교를 선택해 주세요.' });
            if (!startHour || startHour === '') errors.push({ field: 'startHour', msg: '시작 시간을 선택해 주세요.' });
            if (!startMinute || startMinute === '') errors.push({ field: 'startMinute', msg: '시작 분을 선택해 주세요.' });
            if (!duration || String(duration).trim() === '') errors.push({ field: 'duration', msg: '총 방문시간을 선택해 주세요.' });
            if (!Array.isArray(subjects) || subjects.length === 0) errors.push({ field: 'subjects', msg: '적어도 하나의 과목을 선택해 주세요.' });
            if (!teacher || teacher.trim() === '') errors.push({ field: 'teacherName', msg: '선생님 이름을 입력해 주세요.' });

            return { ok: errors.length === 0, errors };
          }catch(e){ return { ok: false, errors: [{ field:'', msg: '검증 중 예외가 발생했습니다.' }] }; }
        }

        function saveReport(entry){
          try{
            if (!entry) return false;
            // Ensure visitStart / visitEnd and normalized startHour/startMinute are present
            try{
              // normalize startHour/startMinute from visitStart if needed
              if ((entry.startHour === undefined || entry.startHour === '') && entry.visitStart){
                try{
                  const parts = (''+entry.visitStart).split(':');
                  if (parts && parts.length >= 1) entry.startHour = String(parts[0]).padStart(2,'0');
                  if (parts && parts.length >= 2) entry.startMinute = String(parts[1]).padStart(2,'0');
                }catch(e){}
              }

              // build visitStart string from startHour/startMinute if missing
              if (!entry.visitStart && entry.startHour){
                try{ entry.visitStart = (String(entry.startHour).padStart(2,'0') + ':' + (entry.startMinute !== undefined && entry.startMinute !== '' ? String(entry.startMinute).padStart(2,'0') : '00')); }catch(e){}
              }

              // If visitEnd / endTime missing but duration + start available, compute visitEnd
              if ((!entry.visitEnd && !entry.endTime) && entry.duration && entry.visitStart){
                try{
                  const a = (''+entry.visitStart).split(':');
                  const sh = Number(a[0]||0); const sm = Number(a[1]||0);
                  const startMinutes = (sh*60) + sm;
                  const endMinutes = startMinutes + Number(entry.duration || 0);
                  const eh = Math.floor(endMinutes/60) % 24; const em = endMinutes % 60;
                  const endStr = String(eh).padStart(2,'0') + ':' + String(em).padStart(2,'0');
                  entry.endTime = endStr; entry.visitEnd = endStr;
                }catch(e){}
              }

              // If endTime present but visitEnd missing, copy it
              if (entry.endTime && !entry.visitEnd) entry.visitEnd = entry.endTime;
              if (entry.visitEnd && (!entry.endTime || entry.endTime === '')) entry.endTime = entry.visitEnd;
            }catch(e){ /* tolerate */ }
            const key = 'cmass_reports';
            let arr = [];
            try{ arr = JSON.parse(localStorage.getItem(key) || '[]') || []; }catch(e){ arr = []; }

            try{
              const rawEditIndex = window.sessionStorage ? sessionStorage.getItem('cmass:edit_index') : null;
              const rawEditEntry = window.sessionStorage ? sessionStorage.getItem('cmass:edit_entry') : null;
              let replaced = false;
              if (entry && entry.server_id){
                const existingIdx = arr.findIndex(it => it && String(it.server_id||'') === String(entry.server_id));
                if (existingIdx !== -1){ arr[existingIdx] = entry; replaced = true; }
              }

              let usedEditIndex = false;
              if (!replaced && rawEditIndex !== null && rawEditIndex !== undefined && rawEditIndex !== '' && rawEditEntry){
                try{
                  const parsed = JSON.parse(rawEditEntry);
                  const i = Number(rawEditIndex);
                  const idxValid = !Number.isNaN(i) && i >= 0 && i < arr.length;
                  let match = false;
                  if (parsed && typeof parsed === 'object'){
                    if (parsed.server_id && entry.server_id && String(parsed.server_id) === String(entry.server_id)) match = true;
                    else if (parsed._savedAt && entry._savedAt && String(parsed._savedAt) === String(entry._savedAt)) match = true;
                    else if (parsed.staff && parsed.visitDate && parsed.school && parsed.staff === entry.staff && parsed.visitDate === entry.visitDate && parsed.school === entry.school) match = true;
                  }
                  if (match && idxValid){ arr[i] = entry; usedEditIndex = true; }
                }catch(e){}
              }

              if (!replaced && !usedEditIndex){ arr.unshift(entry); }

              if (replaced || usedEditIndex){ try{ sessionStorage.removeItem('cmass:edit_index'); sessionStorage.removeItem('cmass:edit_entry'); }catch(e){} }
            }catch(e){ arr.unshift(entry); }

            if (arr.length > 200) arr.length = 200;
            localStorage.setItem(key, JSON.stringify(arr));

            // fire-and-forget server sync (only when PIN-authenticated as existing logic)
            (async function(){
              try{
                const editIndex = window.sessionStorage ? sessionStorage.getItem('cmass:edit_index') : null;
                let savedIndex = 0;
                if (editIndex !== null && editIndex !== undefined && editIndex !== ''){
                  const i = Number(editIndex);
                  if (!Number.isNaN(i) && i >= 0 && i < arr.length) savedIndex = i;
                }
                const pinAuth = (window.sessionStorage && sessionStorage.getItem('cmass_pin_authenticated')) || null;
                // require both PIN auth and explicit user opt-in (checkbox) to auto-upload on save
                const autoSaveEl = (typeof document !== 'undefined') ? document.getElementById('autoServerSave') : null;
                const autoSave = autoSaveEl ? !!autoSaveEl.checked : false;
                if (!pinAuth || !autoSave){ console.warn('[meeting] 서버 동기화 스킵: PIN 필요 또는 자동저장 비활성'); return; }
                const serverId = await syncEntryToServer(arr[savedIndex], !!(arr[savedIndex] && arr[savedIndex].server_id), savedIndex);
                if (serverId){ arr[savedIndex].server_id = serverId; try{ for (let k = arr.length-1;k>=0;k--){ if (k===savedIndex) continue; try{ if (arr[k] && String(arr[k].server_id||'') === String(serverId)){ arr.splice(k,1); if (k < savedIndex) savedIndex--; } }catch(e){} } }catch(e){} localStorage.setItem(key, JSON.stringify(arr)); }
              }catch(e){ console.warn('[meeting] 서버 동기화 중 예외', e); }
            })();

            try{ console.debug('[meeting] saved cmass_reports length=', (JSON.parse(localStorage.getItem(key)||'[]')||[]).length); }catch(e){}
            return true;
          }catch(e){ return false; }
        }

        function computeAndStoreMetrics(staffToken, visitDate){
          try{
            if (!staffToken || !visitDate) return;
            const key = 'cmass_reports';
            let arr = [];
            try{ arr = JSON.parse(localStorage.getItem(key) || '[]') || []; }catch(e){ arr = []; }
            const filtered = arr.filter(it => String(it.visitDate||'') === String(visitDate) && String(it.staff||'') === String(staffToken));
            const totalMeetings = filtered.length;
            const schools = new Set(filtered.map(it => (it.school||'').toString().trim()).filter(Boolean));
            const totalSchools = schools.size;
                      // 입력완료 후 방문일 기준 리스트 갱신
                      renderHistoryList();
            const contactsSecured = filtered.reduce((s,it)=> s + ((it.phone && String(it.phone).trim()) || (it.email && String(it.email).trim()) ? 1:0), 0);
            const additionalSelections = filtered.reduce((s,it)=>{ const text = ((it.followup||'') + ' ' + (it.request||it.requests||'') + ' ' + (it.conversation||'')).toString(); return s + ((text.indexOf('선정') !== -1) ? 1 : 0); },0);
            const metrics = { visitDate: String(visitDate), totalSchools: totalSchools, totalMeetings: totalMeetings, contactsSecured: contactsSecured, additionalSelections: additionalSelections };
            try{ if (window.sessionStorage) sessionStorage.setItem('cmass:report_metrics', JSON.stringify(metrics)); }catch(e){}
      // 방문일 변경 시에도 리스트 갱신
      const visitDateEl = document.getElementById('visitDate');
      if (visitDateEl) {
        visitDateEl.addEventListener('change', renderHistoryList, true);
      }
      // 최초 진입 시에도 표시
      renderHistoryList();
            return metrics;
          }catch(e){ return null; }
        }

        // Clear only meeting content fields (preserve 기본정보 and 방문기록)
        function clearMeetingContents(){
          try{
            // remove active state from subject/activity/favor buttons
            ['#subjects','#activities','#materials','#favorBtns'].forEach(sel=>{
              try{
                const container = document.querySelector(sel);
                if (!container) return;
                const buttons = Array.from(container.querySelectorAll('button'));
                buttons.forEach(b=>{ b.classList.remove('active'); try{ b.setAttribute('aria-pressed','false'); }catch(e){} });
              }catch(e){}
            });

            // clear simple inputs related to meeting content
            ['teacherName','publisher','phone','email','requests','conversation','issue','deliveries','gifts','followUp'].forEach(id=>{
              try{ const el = document.getElementById(id); if (el) el.value = ''; }catch(e){}
            });

            // clear any dynamically added session entries
            try{ const sc = document.getElementById('sessionContainer'); if (sc) sc.innerHTML = ''; }catch(e){}

            // keep startHour/startMinute/duration/endTime as-is (방문기록 유지)
            try{ if (typeof window._cmass_computeEndTime === 'function') window._cmass_computeEndTime(); }catch(e){}

            try{ console.debug('[meeting] meeting contents cleared (basic info preserved)'); }catch(e){}
          }catch(e){ console.warn('[meeting] clearMeetingContents error', e); }
        }

        function init(){
          const btn = qs('btnSubmit');
          if (btn){
            btn.addEventListener('click', function(){
              try{
                const v = validateForm();
                if (!v.ok){
                  try{
                    const first = v.errors && v.errors.length ? v.errors[0] : null;
                    v.errors.forEach(err => {
                      try{
                        if (!err || !err.field) return;
                        if (err.field === 'subjects'){ const container = document.getElementById('subjects'); if (container) container.classList.add('invalid'); }
                        else { const el = document.getElementById(err.field); if (el) el.classList.add('invalid'); }
                      }catch(e){}
                    });
                    if (first && first.field && first.field !== 'subjects'){ const el = document.getElementById(first.field); if (el && typeof el.focus === 'function'){ el.focus(); } }
                    else if (first && first.field === 'subjects'){ const s = document.querySelector('#subjects'); if (s) s.scrollIntoView({behavior:'smooth', block:'center'}); }
                    alert(v.errors.map(e=>e.msg).join('\n'));
                  }catch(e){ alert('입력값을 확인해 주세요.'); }
                  return;
                }

                const entry = gatherForm(); if (!entry) return;
                try{
                  if (window.sessionStorage){
                    const token = (qs('staff') && qs('staff').value) || entry.staff || '';
                    const label = (qs('staff') && qs('staff').options && qs('staff').selectedIndex>=0) ? qs('staff').options[qs('staff').selectedIndex].text : (entry.staffLabel||'');
                    const date = (qs('visitDate') && qs('visitDate').value) || entry.visitDate || '';
                    const region = (qs('regionSelect') && qs('regionSelect').value) || entry.region || '';
                    try{ if (token) sessionStorage.setItem('cmass:next_staff_token', String(token)); }catch(e){}
                    try{ if (label) sessionStorage.setItem('cmass:next_staff_label', String(label)); }catch(e){}
                    try{ if (date) sessionStorage.setItem('cmass:next_visitDate', String(date)); }catch(e){}
                    try{ if (region) sessionStorage.setItem('cmass:next_region', String(region)); }catch(e){}
                  }
                }catch(e){}

                saveReport(entry);
                try{
                  const token = (qs('staff') && qs('staff').value) || entry.staff || '';
                  const date = (qs('visitDate') && qs('visitDate').value) || entry.visitDate || '';
                  try{ computeAndStoreMetrics(token, date); }catch(e){}
                  // Do NOT navigate to /report. Keep the user on the input page and clear only meeting contents.
                  try{ clearMeetingContents(); try{ alert('저장되었습니다. 미팅 내용은 초기화되었습니다.'); }catch(e){} }catch(e){ }
                }catch(e){}
              }catch(e){}
            }, true);
          }

          const btnDaily = qs('btnDailyReport');
          const staffEl = qs('staff');
          const dateEl = qs('visitDate');
          function updateDailyBtn(){ try{ if (btnDaily) btnDaily.disabled = false; }catch(e){} }
          if (staffEl) staffEl.addEventListener('change', updateDailyBtn, true);
          if (dateEl) dateEl.addEventListener('change', updateDailyBtn, true);
          updateDailyBtn();
          if (btnDaily){
            btnDaily.addEventListener('click', function(){
              const staff = staffEl && staffEl.value;
              const date = dateEl && dateEl.value;
              const region = (qs('regionSelect') && qs('regionSelect').value) || '';
              const school = (qs('schoolSelect') && qs('schoolSelect').value) || '';
              const schoolElRef = qs('schoolSelect');
              const schoolOpt = (schoolElRef && schoolElRef.options && schoolElRef.selectedIndex >= 0) ? schoolElRef.options[schoolElRef.selectedIndex] : null;
              const schoolDisplay = schoolOpt ? (schoolOpt.text || school) : school;
              const schoolScode = schoolOpt && schoolOpt.dataset ? (schoolOpt.dataset.scode || '') : '';
              if (!date){ alert('방문일을 선택해 주세요.'); return; }
              try{ computeAndStoreMetrics(staff || '', date); }catch(e){}
              // Persist region/school in sessionStorage only (do NOT add them to the URL)
              try{ if (window.sessionStorage){ if (region) sessionStorage.setItem('cmass:next_region', String(region)); if (school) sessionStorage.setItem('cmass:next_school', String(school)); if (schoolDisplay) sessionStorage.setItem('cmass:next_school_display', String(schoolDisplay)); if (schoolScode) sessionStorage.setItem('cmass:next_school_scode', String(schoolScode)); } }catch(e){}
              try{ const params = new URLSearchParams(); if (staff) params.set('staff', String(staff)); params.set('visitDate', String(date)); window.location.href = '/report' + (params.toString() ? ('?' + params.toString()) : ''); }catch(e){ let q = '?visitDate=' + encodeURIComponent(String(date)); if (staff) q = 'staff=' + encodeURIComponent(String(staff)) + '&visitDate=' + encodeURIComponent(String(date)); window.location.href = '/report' + q; }
            }, true);
          }

          // backToInput preserves staff/date/region/school in sessionStorage
          try{
            const back = qs('backToInput');
            function updateBackHref(){
              try{
                const token = (qs('staff') && qs('staff').value) || window._cmass_staffParam || '';
                const q = token ? ('?staff=' + encodeURIComponent(String(token))) : '';
                if (back) back.setAttribute('href', '/input' + q);
                if (back){
                  if (window.__cmass_back_click__ && typeof window.__cmass_back_click__ === 'function'){ try{ back.removeEventListener('click', window.__cmass_back_click__); }catch(e){} }
                  window.__cmass_back_click__ = function(ev){
                    try{
                      if (!window.sessionStorage) return;
                      const label = (qs('staff') && qs('staff').options && qs('staff').selectedIndex>=0) ? qs('staff').options[qs('staff').selectedIndex].text : '';
                      const date = (qs('visitDate') && qs('visitDate').value) || '';
                      const region = (qs('regionSelect') && qs('regionSelect').value) || '';
                      const school = (qs('schoolSelect') && qs('schoolSelect').value) || '';
                      try{ if (token) sessionStorage.setItem('cmass:next_staff_token', String(token)); }catch(e){}
                      try{ if (label) sessionStorage.setItem('cmass:next_staff_label', String(label)); }catch(e){}
                      try{ if (date) sessionStorage.setItem('cmass:next_visitDate', String(date)); }catch(e){}
                      try{ if (region) sessionStorage.setItem('cmass:next_region', String(region)); }catch(e){}
                      try{
                        if (school) sessionStorage.setItem('cmass:next_school', String(school));
                        try{
                          const sel = (qs('schoolSelect') && qs('schoolSelect').options && qs('schoolSelect').selectedIndex >= 0) ? qs('schoolSelect').options[qs('schoolSelect').selectedIndex] : null;
                          const disp = sel ? (sel.text || school) : school;
                          const sc = sel && sel.dataset ? (sel.dataset.scode || '') : '';
                          if (disp) sessionStorage.setItem('cmass:next_school_display', String(disp));
                          if (sc) sessionStorage.setItem('cmass:next_school_scode', String(sc));
                        }catch(e){}
                      }catch(e){}
                    }catch(e){}
                  };
                  back.addEventListener('click', window.__cmass_back_click__, true);
                }
              }catch(e){}
            }
            updateBackHref(); if (staffEl) staffEl.addEventListener('change', updateBackHref, true);
          }catch(e){}
        }

        init();

      // === [전역 window에 함수/변수 할당] ===
      try {
        window.gatherForm = gatherForm;
        window.saveReport = saveReport;
        window.computeEndTime = (typeof computeEndTime === 'function') ? computeEndTime : undefined;
        // entries, saveDraft, subjectBtns, durationInput 등은 선언된 경우만 할당
        if (typeof entries !== 'undefined') window.entries = entries;
        if (typeof saveDraft !== 'undefined') window.saveDraft = saveDraft;
        window.subjectBtns = document.querySelectorAll('#subjects .subject-btn');
        window.favorBtns = document.querySelectorAll('#favorBtns .favor-btn');
        window.durationBtns = document.getElementById('durationBtns');
        window.durationInput = document.getElementById('duration');
      } catch(e) { console.warn('window 전역 할당 오류', e); }
      // === [전역 window에 함수/변수 할당 끝] ===
    });
      // 전달자료 표시 조건: 특정 과목에서만 보이도록 제어
      (function(){
        try{
          function updateMaterialsVisibilityBySubjects(){
            try{
              // collectActiveText is defined in the outer scope above
              const active = (typeof collectActiveText === 'function') ? collectActiveText('#subjects','subject-btn') : (Array.from(document.querySelectorAll('#subjects .subject-btn.active')).map(b=>b.textContent.trim()));
              const mats = Array.from(document.querySelectorAll('#materials .subject-btn'));
              mats.forEach(btn=>{
                try{
                  const rule = btn.getAttribute('data-visible-for');
                  if (!rule) return; // no rule -> leave as-is
                  const allowed = rule.split('|').map(s=>s.trim()).filter(Boolean);
                  const show = allowed.some(a => active.indexOf(a) !== -1);
                  btn.style.display = show ? '' : 'none';
                }catch(e){}
              });
            }catch(e){}
          }

          document.addEventListener('DOMContentLoaded', function(){
            try{
              // Update when subjects are clicked (delegated)
              const subjects = document.getElementById('subjects');
              if (subjects) subjects.addEventListener('click', function(){ setTimeout(updateMaterialsVisibilityBySubjects, 0); }, true);
              // Call once to set initial visibility
              setTimeout(updateMaterialsVisibilityBySubjects, 0);
            }catch(e){}
          }, { once:true });
        }catch(e){}
      })();
      </script>

  <script src="/csv-helpers.js" defer></script>

  <script>
    // Populate region & school dropdowns based on the currently-selected 담당자.
    // Keep the staff <select> disabled (do not allow changing it here).
    (function(){
      function parseCSVLine(line){
        const cols = [];
        let cur = '';
        let inQuotes = false;
        for (let i=0;i<line.length;i++){
          const ch = line[i];
          if (inQuotes){
            if (ch === '"'){
              if (i+1 < line.length && line[i+1] === '"'){ cur += '"'; i++; }
              else inQuotes = false;
            } else cur += ch;
          } else {
            if (ch === ','){ cols.push(cur); cur = ''; }
            else if (ch === '"'){ inQuotes = true; }
            else cur += ch;
          }
        }
        cols.push(cur);
        return cols;
      }

      function parseCSV(text){
        const lines = text.split(/\r?\n/).filter(l=>l.trim()!=='');
        if (!lines.length) return [];
        const header = parseCSVLine(lines[0]).map(h=>h.trim());
        const rows = [];
        for (let i=1;i<lines.length;i++){
          const cols = parseCSVLine(lines[i]);
          if (!cols || cols.length === 0) continue;
          const obj = {};
          for (let j=0;j<header.length && j<cols.length;j++) obj[header[j]] = cols[j].trim();
          rows.push(obj);
        }
        return rows;
      }

      async function loadSalesStaff(){
        try{
          const res = await fetch('/sales_staff.csv');
          if (!res.ok) return null;
          const txt = await res.text();
          return parseCSV(txt);
        }catch(e){ console.warn('sales_staff.csv load failed', e); return null; }
      }

      function makeStaffKey(raw){
        if (!raw) return '';
        try{ return raw.normalize('NFKC').trim().replace(/\s+/g,''); }catch(e){ return raw.trim().replace(/\s+/g,''); }
      }

      function stripTitle(name){
        if (!name) return '';
        // remove common Korean honorifics/titles at end: 부장, 차장, 과장, 팀장, 님, 선생님
        return name.replace(/\s*(부장|차장|과장|팀장|님|선생님)$/,'').trim();
      }

      function buildMap(rows){
        // map: staffKey -> { label, regions: Set, schoolsByRegion: { region -> Set } }
        const map = {};
        for (const r of rows){
          const staffRaw = (r['staff'] || r['담당자'] || '').trim();
          if (!staffRaw) continue;
          const staffKeyField = (r['staff_key'] || '').trim();
          const staffKey = staffKeyField || makeStaffKey(staffRaw);
          const labelField = (r['label'] || '').trim();
          const label = labelField || stripTitle(staffRaw);

          const region = (r['region'] || r['지역'] || '').trim();
          const school = (r['school'] || r['학교'] || '').trim();

          if (!map[staffKey]) map[staffKey] = { label: label, regions: new Set(), schoolsByRegion: {} };
          // prefer an explicit label if provided
          if (labelField) map[staffKey].label = labelField;
          if (region) map[staffKey].regions.add(region);
          if (region){ if (!map[staffKey].schoolsByRegion[region]) map[staffKey].schoolsByRegion[region] = new Set(); if (school) map[staffKey].schoolsByRegion[region].add(school); }
        }
        return map;
      }

      function findStaffKeyByLabel(mapKeys, map, optionText){
        if (!optionText) return null;
        // exact label match first
        for (const k of mapKeys) if ((map[k].label||'') === optionText) return k;
        // optionText may include the label (e.g., label "송훈재" and optionText "송훈재 부장")
        for (const k of mapKeys) if (optionText.indexOf(map[k].label||'') !== -1) return k;
        // reverse: label includes optionText
        for (const k of mapKeys) if ((map[k].label||'').indexOf(optionText) !== -1) return k;
        return null;
      }

      // Resolve a staff token (possibly different casing/normalization) to a map key.
      function resolveStaffKey(map, token){
        if (!token) return null;
        // direct hit
        if (map[token]) return token;
        const mk = makeStaffKey(token || '');
        // try normalized match against keys
        for (const k of Object.keys(map)){
          try{
            if (makeStaffKey(k) === mk) return k;
            // also allow matching against labels
            if ((map[k].label || '').toLowerCase() === String(token || '').toLowerCase()) return k;
          }catch(e){}
        }
        return null;
      }

      function populateRegions(regionEl, regions){
        regionEl.innerHTML = '';
        const ph = document.createElement('option'); ph.value = ''; ph.text = '지역 선택...'; regionEl.appendChild(ph);
        Array.from(regions).sort((a,b)=>a.localeCompare(b)).forEach(r=>{ const o=document.createElement('option'); o.value = r; o.text = r; regionEl.appendChild(o); });
      }

      function populateSchools(schoolEl, schools){
        schoolEl.innerHTML = '';
        const ph = document.createElement('option'); ph.value = ''; ph.text = '학교 선택...'; schoolEl.appendChild(ph);
        Array.from(schools).sort((a,b)=>a.localeCompare(b)).forEach(s=>{
          try{
            const o = document.createElement('option');
            o.value = s;
            // Prefer to show school code when available (restore behavior):
            // option text becomes "학교명 (scode)" if metadata has scode.
            let display = s;
            try{
              if (typeof findSalesStaffMeta === 'function'){
                const meta = findSalesStaffMeta(s);
                if (meta && meta.scode){ display = s + ' (' + meta.scode + ')'; o.dataset.scode = meta.scode; }
              }
              // fallback to quick map if available
              if (!o.dataset.scode && window._cmass_scodeQuickMap){
                const normKey = (typeof window.cmassNormalizeSchoolKey === 'function') ? window.cmassNormalizeSchoolKey(s) : (s||'').toLowerCase();
                const sc = window._cmass_scodeQuickMap.get(s) || window._cmass_scodeQuickMap.get(normKey) || '';
                if (sc) { display = s + ' (' + sc + ')'; o.dataset.scode = sc; }
              }
            }catch(e){}
            o.text = display;
            schoolEl.appendChild(o);
          }catch(e){ /* tolerate per-row errors */ }
        });
      }

      async function wire() {
        const rows = await loadSalesStaff();
        if (!rows) return;
        const map = buildMap(rows);
        // Build a quick lookup map for school scodes and a helper so populateSchools
        // can always find scodes when available. This mirrors similar logic in
        // input.html so dropdown options can show "학교명 (scode)" reliably.
        try{
          const scMap = new Map();
          const salesStaffMap = new Map();
          (rows || []).forEach(r => {
            try{
              const name = ((r['school'] || r['학교'] || '') + '').trim();
              const scode = ((r['scode'] || r['s-code'] || r['code'] || '') + '').trim();
              if (!name) return;
              const exact = name;
              const norm = (typeof window.cmassNormalizeSchoolKey === 'function') ? window.cmassNormalizeSchoolKey(name) : name.toLowerCase();
              if (scode) {
                scMap.set(exact, scode);
                scMap.set(norm, scode);
              }
              // store a lightweight meta for findSalesStaffMeta
              const meta = Object.assign({}, r, { scode: scode });
              salesStaffMap.set(exact.toLowerCase(), meta);
              salesStaffMap.set(norm, meta);
            }catch(e){}
          });
          try{
            if (!window._cmass_scodeQuickMap || !(window._cmass_scodeQuickMap instanceof Map)){
              window._cmass_scodeQuickMap = scMap;
            } else {
              scMap.forEach((v,k) => { try{ window._cmass_scodeQuickMap.set(k,v); }catch(e){} });
            }
          }catch(e){ window._cmass_scodeQuickMap = scMap; }
          try{ if (!window.salesStaffMap || !(window.salesStaffMap instanceof Map)) window.salesStaffMap = salesStaffMap; else { salesStaffMap.forEach((v,k)=>{ try{ window.salesStaffMap.set(k,v); }catch(e){} }); } }catch(e){ window.salesStaffMap = salesStaffMap; }
          if (typeof window.findSalesStaffMeta !== 'function'){
            window.findSalesStaffMeta = function(raw){
              try{
                if (!raw) return null;
                const k = (typeof window.cmassNormalizeSchoolKey === 'function') ? window.cmassNormalizeSchoolKey(raw) : String(raw||'').trim().toLowerCase();
                return salesStaffMap.get(raw) || salesStaffMap.get(k) || null;
              }catch(e){ return null; }
            };
          }
        }catch(e){}
        const staffEl = document.getElementById('staff');
        const regionEl = document.getElementById('regionSelect');
        const schoolEl = document.getElementById('schoolSelect');
        const scodeEl = document.getElementById('scodeDisplay');
        if (!staffEl || !regionEl || !schoolEl) return;

        // Rebuild staff <select> from CSV-derived map (option.value = staffKey, option.text = label)
        staffEl.innerHTML = '';
        const phStaff = document.createElement('option'); phStaff.value = ''; phStaff.text = '담당자 선택...'; staffEl.appendChild(phStaff);
        const entries = Object.keys(map).map(k=>({ key: k, label: map[k].label || k, regions: map[k].regions, schoolsByRegion: map[k].schoolsByRegion }));
        entries.sort((a,b)=> (a.label||'').localeCompare(b.label||''));
        entries.forEach(e=>{ const o = document.createElement('option'); o.value = e.key; o.text = e.label || e.key; staffEl.appendChild(o); });

        // Determine staffKey to select: prefer explicit token, then stored label, then current option text
        let staffKey = '';
        try{
          const rawToken = sessionStorage.getItem('cmass:next_staff_token') || '';
          if (rawToken) staffKey = resolveStaffKey(map, rawToken) || '';
        }catch(e){ staffKey = ''; }
        if (!staffKey){
          try{
            const storedLabel = sessionStorage.getItem('cmass:next_staff_label') || '';
            if (storedLabel){
              const k = findStaffKeyByLabel(Object.keys(map), map, storedLabel);
              if (k) staffKey = k;
            }
          }catch(e){}
        }
        if (!staffKey){
          const optionText = (staffEl.options && staffEl.selectedIndex>=0) ? (staffEl.options[staffEl.selectedIndex].text || '') : '';
          if (optionText){
            const k = findStaffKeyByLabel(Object.keys(map), map, optionText);
            if (k) staffKey = k;
          }
        }

        if (!staffKey){
          // nothing to wire specifically for a staff; show all regions
          const allRegions = new Set();
          for (const s of Object.keys(map)) for (const r of map[s].regions) allRegions.add(r);
          populateRegions(regionEl, allRegions);

          // If the user landed here with a previously selected region (from /input),
          // populate the school list with ALL schools that belong to that region
          // across all staff entries rather than leaving it empty.
          try{
            const prevRegion = (sessionStorage && sessionStorage.getItem('cmass:next_region')) || window.selectedRegion || '';
            if (prevRegion){
              // gather schools for this region from all staff entries
              // Be tolerant of minor mismatches in region string (whitespace, case, partial matches)
              const schoolsForRegion = new Set();
              const target = (prevRegion || '').toString().trim().toLowerCase();
              for (const k of Object.keys(map)){
                try{
                  const entry = map[k];
                  if (!entry || !entry.schoolsByRegion) continue;
                  // try direct hit first
                  let set = entry.schoolsByRegion[prevRegion] || entry.schoolsByRegion[target] || null;
                  if (!set){
                    // try tolerant matching against the region keys in this staff entry
                    for (const rk of Object.keys(entry.schoolsByRegion || {})){
                      try{
                        if (!rk) continue;
                        const rkNorm = rk.toString().trim().toLowerCase();
                        if (rkNorm === target || rkNorm.indexOf(target) !== -1 || target.indexOf(rkNorm) !== -1){ set = entry.schoolsByRegion[rk]; break; }
                      }catch(e){}
                    }
                  }
                  if (set){ for (const s of set) schoolsForRegion.add(s); }
                }catch(e){}
              }
              if (schoolsForRegion.size){
                // set regionSelect to prevRegion if option exists
                try{ regionEl.value = prevRegion; }catch(e){}
                populateSchools(schoolEl, schoolsForRegion);
              } else {
                populateSchools(schoolEl, []);
              }
            } else {
              populateSchools(schoolEl, []);
            }
          }catch(e){ populateSchools(schoolEl, []); }
          return;
        }

  const staffEntry = map[staffKey];
  // select the staff option by value (staff_key)
  try{ staffEl.value = staffKey; }catch(e){}
  populateRegions(regionEl, staffEntry.regions || []);

        // try to restore previous region/school from sessionStorage
          // 옵션을 모두 채운 뒤 sessionStorage 값을 select에 반영
          setTimeout(() => {
            const prevRegion = sessionStorage.getItem('cmass:next_region') || '';
            if (prevRegion) {
              // Prefer to show all schools that belong to the prevRegion across all staff entries
              // gather schools across all staff entries, tolerant of minor region-name mismatches
              const schoolsForRegion = new Set();
              const target = (prevRegion || '').toString().trim().toLowerCase();
              for (const k of Object.keys(map)){
                try{
                  const entry = map[k];
                  if (!entry || !entry.schoolsByRegion) continue;
                  let set = entry.schoolsByRegion[prevRegion] || entry.schoolsByRegion[target] || null;
                  if (!set){
                    for (const rk of Object.keys(entry.schoolsByRegion || {})){
                      try{
                        if (!rk) continue;
                        const rkNorm = rk.toString().trim().toLowerCase();
                        if (rkNorm === target || rkNorm.indexOf(target) !== -1 || target.indexOf(rkNorm) !== -1){ set = entry.schoolsByRegion[rk]; break; }
                      }catch(e){}
                    }
                  }
                  if (set){ for (const s of set) schoolsForRegion.add(s); }
                }catch(e){}
              }
              if (schoolsForRegion.size){
                try{ regionEl.value = prevRegion; }catch(e){}
                populateSchools(schoolEl, schoolsForRegion);
                setTimeout(() => {
                  const prevSchoolDisplay = sessionStorage.getItem('cmass:next_school_display') || '';
                  const prevSchoolCode = sessionStorage.getItem('cmass:next_school_scode') || '';
                  const prevSchool = prevSchoolDisplay || (sessionStorage.getItem('cmass:next_school') || '');
                  if (prevSchool){
                    const opt = Array.from(schoolEl.options).find(o => (o.value === prevSchool) || ((o.text || '') === prevSchool) || ((o.dataset && o.dataset.scode) === prevSchoolCode));
                    if (opt) schoolEl.value = opt.value;
                  }
                  // Robust restoration: 담당자, 방문일, 지역, 학교
                  try {
                    const staffToken = sessionStorage.getItem('cmass:next_staff_token') || '';
                    const staffLabel = sessionStorage.getItem('cmass:next_staff_label') || '';
                    if (staffToken) {
                      const resolved = resolveStaffKey(map, staffToken) || '';
                      if (resolved) {
                        const staffOpt = Array.from(staffEl.options).find(o => o.value === resolved);
                        if (staffOpt) staffEl.value = resolved;
                      }
                    } else if (staffLabel) {
                      const staffOpt = Array.from(staffEl.options).find(o => o.text === staffLabel);
                      if (staffOpt) staffEl.value = staffOpt.value;
                    }
                    const visitDate = sessionStorage.getItem('cmass:next_visitDate') || '';
                    if (visitDate) {
                      const visitDateEl = document.getElementById('visitDate'); if (visitDateEl) visitDateEl.value = visitDate;
                    }
                  } catch(e) {}
                }, 0);
                // done
              } else {
                // fallback to staff-local behavior when no global schools found for the region
                if (prevRegion && Array.from(staffEntry.regions).indexOf(prevRegion) !== -1) {
                  try{ regionEl.value = prevRegion; }catch(e){}
                  const schools = staffEntry.schoolsByRegion[prevRegion] || new Set();
                  populateSchools(schoolEl, schools);
                } else {
                  const allSchools = new Set();
                  for (const reg of staffEntry.regions){ const sset = staffEntry.schoolsByRegion[reg] || new Set(); for (const sc of sset) allSchools.add(sc); }
                  populateSchools(schoolEl, allSchools);
                }
                // Robust restoration for staff/visitDate even if region/school not set
                setTimeout(() => {
                  try {
                    const staffToken = sessionStorage.getItem('cmass:next_staff_token') || '';
                    const staffLabel = sessionStorage.getItem('cmass:next_staff_label') || '';
                    if (staffToken) {
                      const staffOpt = Array.from(staffEl.options).find(o => o.value === staffToken);
                      if (staffOpt) staffEl.value = staffToken;
                    } else if (staffLabel) {
                      const staffOpt = Array.from(staffEl.options).find(o => o.text === staffLabel);
                      if (staffOpt) staffEl.value = staffOpt.value;
                    }
                    const visitDate = sessionStorage.getItem('cmass:next_visitDate') || '';
                    if (visitDate) { const visitDateEl = document.getElementById('visitDate'); if (visitDateEl) visitDateEl.value = visitDate; }
                  } catch(e) {}
                }, 0);
              }
            } else {
              // no prevRegion: default populate all schools for the staff across regions
              const allSchools = new Set();
              for (const reg of staffEntry.regions){ const sset = staffEntry.schoolsByRegion[reg] || new Set(); for (const sc of sset) allSchools.add(sc); }
              populateSchools(schoolEl, allSchools);
              // Robust restoration for staff/visitDate even if region/school not set
              setTimeout(() => {
                try {
                  const staffToken = sessionStorage.getItem('cmass:next_staff_token') || '';
                  const staffLabel = sessionStorage.getItem('cmass:next_staff_label') || '';
                  if (staffToken) {
                    const staffOpt = Array.from(staffEl.options).find(o => o.value === staffToken);
                    if (staffOpt) staffEl.value = staffToken;
                  } else if (staffLabel) {
                    const staffOpt = Array.from(staffEl.options).find(o => o.text === staffLabel);
                    if (staffOpt) staffEl.value = staffOpt.value;
                  }
                  const visitDate = sessionStorage.getItem('cmass:next_visitDate') || '';
                  if (visitDate) { const visitDateEl = document.getElementById('visitDate'); if (visitDateEl) visitDateEl.value = visitDate; }
                } catch(e) {}
              }, 0);
            }
          }, 0);

        regionEl.addEventListener('change', function(){
          const r = regionEl.value || '';
          const set = (staffEntry && staffEntry.schoolsByRegion && staffEntry.schoolsByRegion[r]) ? staffEntry.schoolsByRegion[r] : new Set();
          populateSchools(schoolEl, set);

      function isSubject(btn){ return btn.classList && btn.classList.contains('subject-btn'); }
      function isFavor(btn){ return btn.classList && btn.classList.contains('favor-btn'); }

      function toggleSubject(btn){
        try{
          // fallback toggle for subject-like buttons outside the main subjects container (e.g. session templates)
          const active = btn.classList.toggle('active');
          btn.setAttribute('aria-pressed', String(!!active));

      function selectSingleSubject(btn){
        try{
          // Only enforce single-select within the top-level #subjects container
          const container = btn.closest('#subjects') || btn.parentElement || document;
          const others = container.querySelectorAll('.subject-btn') || [];
          const already = btn.classList.contains('active');
          others.forEach(b=>{ b.classList.remove('active'); b.setAttribute('aria-pressed','false'); });
          if (!already){ btn.classList.add('active'); btn.setAttribute('aria-pressed','true'); }
        }catch(e){}
      }

      function selectFavor(btn){
        try{
          const parent = btn.parentElement || document;
          const others = parent.querySelectorAll && parent.querySelectorAll('.favor-btn') || [];
          const already = btn.classList.contains('active');
          // Remove active only from OTHER buttons; preserve clicked button's state until we decide toggle
          Array.from(others).forEach(b=>{ if (b !== btn){ b.classList.remove('active'); b.setAttribute('aria-pressed','false'); } });
          // Toggle clicked button: if it was active, deactivate it; otherwise activate it
          if (already){ btn.classList.remove('active'); btn.setAttribute('aria-pressed','false'); }
          else { btn.classList.add('active'); btn.setAttribute('aria-pressed','true'); }
        }catch(e){}
      }

      function onClick(ev){
        try{
          const btn = closestButton(ev.target);
          // If a capture-phase pointer handler already processed this button interaction,
          // or a pointerdown occurred very recently, ignore the delegated click to avoid double-toggle.
          if (btn && (btn.__cmass_ptr_handled || (btn.__cmass_ptr_time && (Date.now() - btn.__cmass_ptr_time < 700)))){
            try{ btn.__cmass_ptr_handled = false; btn.__cmass_ptr_time = 0; }catch(e){}

            if (btn.closest && btn.closest('#subjects')){

  <script>
    (function(){
      // Populate region and school selects from the consolidated CSV (same source as input.html)
      async function loadRegionsAndSchools(){
        try{
          console.debug('[loadRegionsAndSchools] Starting function');
          console.debug('[loadRegionsAndSchools] Initial selectedRegion:', window.selectedRegion);
          console.debug('[loadRegionsAndSchools] Initial selectedSchool:', window.selectedSchool);

          // Wait briefly for csv helpers to be available
          if (typeof fetchCsvRows !== 'function'){
            await new Promise((resolve)=>{
              const t = setInterval(()=>{ if (typeof fetchCsvRows === 'function'){ clearInterval(t); resolve(); } }, 100);
              setTimeout(()=>{ clearInterval(t); resolve(); }, 2000);
            });
          }

          const rows = (typeof fetchCsvRows === 'function') ? await fetchCsvRows().catch(()=>[]) : [];
          console.debug('[loadRegionsAndSchools] Fetched rows:', rows);
          if (!rows || rows.length < 2) return;
          const header = rows[0] || [];

          function findHeaderIndex(headerArr, candidates){
            if (!Array.isArray(headerArr)) return -1;
            for (let i=0;i<headerArr.length;i++){
              const cell = (headerArr[i]||'').trim();
              if (!cell) continue;
              if (candidates.some(c => c === cell)) return i;
            }
            return -1;
          }

          const idxRegion = findHeaderIndex(header, ['region','지역']);
          const idxSchool = findHeaderIndex(header, ['school','학교','학교명']);
          console.debug('[loadRegionsAndSchools] idxRegion:', idxRegion, 'idxSchool:', idxSchool);

          if (idxRegion === -1 || idxSchool === -1) {
            console.warn('[loadRegionsAndSchools] Region or School index not found in header');
            return;
          }

          const regionSelect = document.getElementById('regionSelect');
          const schoolSelect = document.getElementById('schoolSelect');
          if (!regionSelect || !schoolSelect) {
            console.warn('[loadRegionsAndSchools] regionSelect or schoolSelect not found in DOM');
            return;
          }

          console.debug('[loadRegionsAndSchools] regionSelect options before population:', regionSelect.options);
          console.debug('[loadRegionsAndSchools] schoolSelect options before population:', schoolSelect.options);

          // Build region -> schools map and optional school meta lookup
          try{
            const regionMap = Object.create(null); // region -> Set of schools
            const schoolMeta = Object.create(null); // schoolName -> meta string
            for (let r = 1; r < rows.length; r++){
              const row = rows[r] || [];
              const region = (row[idxRegion] || '').toString().trim();
              const school = (row[idxSchool] || '').toString().trim();
              if (!school) continue;
              if (!region) continue;
              if (!regionMap[region]) regionMap[region] = new Set();
              regionMap[region].add(school);
              // build a small meta summary if possible (use 학교급코드 and staff if present)
              try{
                const idxLevel = findHeaderIndex(header, ['학교급','학교급코드','학교급코드']);
                const idxStaff = findHeaderIndex(header, ['staff','담당자']);
                const parts = [];
                if (idxLevel !== -1 && row[idxLevel]) parts.push(String(row[idxLevel]).trim());
                if (idxStaff !== -1 && row[idxStaff]) parts.push(String(row[idxStaff]).trim());
                if (parts.length) schoolMeta[school] = parts.join(' | ');
              }catch(e){}

            // expose mapping for other scripts
            try{ window._cmass_regionSchoolMap = regionMap; window.schoolMetaMap = schoolMeta; }catch(e){}

            // Populate regionSelect (keep first placeholder option)
            try{
              // remove existing dynamic options (keep first option)
              while (regionSelect.options && regionSelect.options.length > 1) regionSelect.remove(1);
              const regions = Object.keys(regionMap).sort((a,b)=> a.localeCompare(b,'ko'));
              regions.forEach(rn => {
                const opt = document.createElement('option'); opt.value = rn; opt.text = rn; regionSelect.appendChild(opt);
              });
            }catch(e){ console.warn('[loadRegionsAndSchools] region populate error', e); }

            // wire change handler to populate schools for chosen region
            try{
              regionSelect.addEventListener('change', function(){
                try{

                  while (schoolSelect.options && schoolSelect.options.length > 1) schoolSelect.remove(1);
                  if (!sel || !window._cmass_regionSchoolMap || !window._cmass_regionSchoolMap[sel]) return;
                  const schools = Array.from(window._cmass_regionSchoolMap[sel] || []).sort((a,b)=> a.localeCompare(b,'ko'));
                  schools.forEach(sn => {
                    const o = document.createElement('option');
                    o.value = sn;
                    let display = sn;
                    if (window.schoolMetaMap && window.schoolMetaMap[sn]) o.setAttribute('data-meta', window.schoolMetaMap[sn]);
                    try{
                      let scode = '';
                      if (typeof findSalesStaffMeta === 'function'){
                        const m = findSalesStaffMeta(sn);
                        if (m && m.scode) scode = m.scode;
                      }
                      if (!scode && window._cmass_scodeQuickMap){
                        const norm = (typeof window.cmassNormalizeSchoolKey === 'function') ? window.cmassNormalizeSchoolKey(sn) : (sn||'').toLowerCase();
                        scode = window._cmass_scodeQuickMap.get(sn) || window._cmass_scodeQuickMap.get(norm) || '';
                      }
                      if (scode){ o.dataset.scode = scode; display = sn + ' (' + scode + ')'; }
                    }catch(e){}
                    o.text = display;
                    schoolSelect.appendChild(o);
                  });
                  // if there is a previously selectedSchool global, try to set it
                  if (window.selectedSchool){ try{ schoolSelect.value = window.selectedSchool; schoolSelect.dispatchEvent(new Event('change',{ bubbles:true })); }catch(e){} }
                }catch(e){ console.warn('region change handler error', e); }
              }, true);
            }catch(e){ console.warn('[loadRegionsAndSchools] wiring region change failed', e); }

          }catch(e){ console.warn('[loadRegionsAndSchools] building region map failed', e); }

          function trySetRegionAndSchool() {
            console.debug('[trySetRegionAndSchool] Attempting to set region and school');
            try{
              let didSet = false;
              if (regionSelect && window.selectedRegion && regionSelect.options.length > 1) {
                try{ regionSelect.value = window.selectedRegion; regionSelect.dispatchEvent(new Event('change', { bubbles: true })); didSet = true; }catch(e){}
              }
              if (schoolSelect && window.selectedSchool && schoolSelect.options.length > 1) {
                try{
                  const opt = Array.from(schoolSelect.options).find(o => (o.value === window.selectedSchool) || ((o.text || '') === window.selectedSchool));
                  if (opt) { schoolSelect.value = opt.value; schoolSelect.dispatchEvent(new Event('change', { bubbles: true })); didSet = true; }
                }catch(e){}
              }
              return didSet;
            }catch(e){ return false; }
          }

          // Retry logic: attempt to set after a short delay in case selects are populated later
          try{
            let attempts = 0;
            const iv = setInterval(()=>{
              try{ attempts++; const ok = trySetRegionAndSchool(); if (ok || attempts > 12) clearInterval(iv); }catch(e){ clearInterval(iv); }
            }, 150);
          }catch(e){ }
        } catch (e) {
          console.error('[loadRegionsAndSchools] Error:', e);
        }
      }

  // run once after init to apply any session edit left by report page
  try{ if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ try{ if (typeof applySessionEditIfPresent === 'function') applySessionEditIfPresent().catch(()=>{}); }catch(e){} }); else { try{ if (typeof applySessionEditIfPresent === 'function') applySessionEditIfPresent().catch(()=>{}); }catch(e){} } }catch(e){}

  // populate region/school selects after DOM ready
  try{
    // If a staff token is already known (from input flow or staffStore), prefer the

    // would overwrite staff-scoped options with the full CSV listing.
    const shouldRunGlobalLoader = !(window._cmass_staffToken || (document.getElementById && document.getElementById('staff') && document.getElementById('staff').value));
    if (shouldRunGlobalLoader) {
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', loadRegionsAndSchools); else loadRegionsAndSchools();
    } else {
      // still schedule a gentle fallback: if wire() didn't populate regions after a short delay,
      // allow the global loader to run to avoid leaving selects empty (defensive).
      try{ setTimeout(()=>{ try{ const rs = document.getElementById('regionSelect'); if (rs && rs.options && rs.options.length <= 1){ loadRegionsAndSchools().catch(()=>{}); } }catch(e){} }, 800); }catch(e){}
    }
  }catch(e){}
    })();

  <script>
    // Defensive fix:ㅇ ensure time selects and duration buttons are interactive
    // Some webviews/overlays can prevent native selects from opening. This script
    // forces selects to be enabled, stops event propagation on clicks, and
    // wires a robust pointer handler for duration buttons that updates the
    // hidden #duration input and triggers change so computeEndTime runs.
    (function(){
      function qs(id){ return document.getElementById(id); }
      function ensure(){
        try{
          const sh = qs('startHour');
          const sm = qs('startMinute');
          const durHidden = qs('duration');
          const durBtns = qs('durationBtns');

          // Ensure selects are enabled and can receive focus/clicks
          [sh, sm].forEach(el=>{
            try{
              if (!el) return;
              el.disabled = false;
              // make sure pointer events are allowed and stop propagation so
              // document-level handlers or overlays don't swallow the interaction
              el.style.pointerEvents = 'auto';
              el.tabIndex = el.tabIndex || 0;
              el.addEventListener('click', function(ev){ ev.stopPropagation(); }, true);
              el.addEventListener('mousedown', function(){ try{ this.focus(); }catch(e){} }, true);
            }catch(e){}
          });
          console.debug('[ensure] startHour options:', sh ? sh.options.length : 'null');
          console.debug('[ensure] startMinute options:', sm ? sm.options.length : 'null');

          // Robust duration button handling: pointerdown to capture before other handlers
          if (durBtns && durHidden){
            // Prevent adding duplicate listeners
            if (!durBtns.__cmass_duration_installed){
              durBtns.addEventListener('pointerdown', function(ev){
                try{
                  const btn = ev.target && ev.target.closest ? ev.target.closest('button.dur-btn') : null;
                  if (!btn) return;
                  ev.preventDefault(); ev.stopPropagation();
                  // set hidden value and mark active class
                  const val = btn.getAttribute('data-min') || '';
                  durHidden.value = val;
                  Array.from(durBtns.querySelectorAll('button.dur-btn')).forEach(b=>b.classList.remove('active'));
                  btn.classList.add('active');
                  // dispatch change so computeEndTime runs
                  try{ durHidden.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){}
                }catch(e){ /* tolerate */ }
              }, true);
              durBtns.__cmass_duration_installed = true;
            }
          }

          // Trigger computeEndTime once in case values already set
          try{ const ev = new Event('change',{bubbles:true}); if (qs('duration')) qs('duration').dispatchEvent(ev); }catch(e){}
        }catch(e){ console.warn('time-control ensure failed', e); }
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ensure); else setTimeout(ensure, 50);
    })();
  </script>

  <script>

    (function(){

      function activateSingleSubject(btn){
        try{
          const container = qs('subjects'); if (!container || !btn) return;
          const others = Array.from(container.querySelectorAll('button.subject-btn'));
          others.forEach(b=>{ b.classList.remove('active'); b.setAttribute('aria-pressed','false'); });

          const subjects = qs('subjects');
          const active = subjects ? subjects.querySelector('button.subject-btn.active') : null;
          const activeText = active ? (active.textContent||'').toString().trim() : '';
          const show = (activeText === '정보');
          const infoOnly = Array.from(materials.querySelectorAll('button.subject-btn[data-info-only]'));

              if (!show){ b.classList.remove('active'); b.setAttribute('aria-pressed','false'); }
            }catch(e){}
          });
        }catch(e){}
      }
      function toggleActivity(btn){
        try{ if (!btn) return; const active = btn.classList.toggle('active'); btn.setAttribute('aria-pressed', String(!!active)); }catch(e){}
      }

            }, true);

                // intact so other handlers relying on click can run. We mark the
                // button as handled so delegated click handlers can skip double-handling.
